# Settings the merge queue reads from this branch.
#
# Autoheal: when a run fails only because a box case listed as an expected failure (or as not
# applicable) now passes, the queue removes that entry from the list the failing lane read, commits
# it on the PR and tests the PR again. Recipes only ever delete lines, so the lists only shrink.
autoheal:
  recipes:
    # One row of a lane's "outcome changed" block, bound to that block: the lookbehind reads the
    # lane from the block's own `FAILED <lane box expectations>` header (only rows of that block
    # may follow it), and the lookahead finds the same lane's `disagrees with` line without
    # crossing into another report, then takes the list path that lane printed for its version.
    - name: stale-expected-failures
      uses: remove-lines
      match: '(?<=^FAILED <(?<lane>[a-z0-9-]+) box expectations>: \d+ file\(s\) outcome changed:\n(?:  [^\n]*\n)*)^  (?<entry>\S+): expected fail, got pass$(?=(?:(?!^FAILED )[\s\S])*?^\k<lane> box conformance disagrees with \S*?/(?<list>tests/box_expected_failures/\k<lane>/[0-9][^/\s]*\.txt) and )'
      file: '{list}'
      line: '{entry}'
      paths: ['tests/box_expected_failures/*/*.txt']
    - name: stale-not-applicable
      uses: remove-lines
      match: '(?<=^FAILED <(?<lane>[a-z0-9-]+) box expectations>: \d+ file\(s\) outcome changed:\n(?:  [^\n]*\n)*)^  (?<entry>\S+): expected not-applicable, got pass$(?=(?:(?!^FAILED )[\s\S])*?^\k<lane> box conformance disagrees with \S+ and \S*?/(?<list>tests/box_expected_not_applicable/\k<lane>/[0-9][^/\s]*\.txt);)'
      file: '{list}'
      line: '{entry}'
      paths: ['tests/box_expected_not_applicable/*/*.txt']
    # A diagnostics case krusty no longer falsely accepts: drop it from the list the lane printed.
    - name: stale-diagnostics-false-accepts
      uses: remove-lines
      match: '^  (?<entry>\S+): no longer a false accept; remove it from \S*?/(?<list>tests/diagnostics_false_accepts/[^/\s]+/[^/\s]+\.txt)$'
      file: '{list}'
      line: '{entry}'
      paths: ['tests/diagnostics_false_accepts/*/*.txt']

# Re-runs: a run whose only failed jobs failed for reasons outside its PRs runs those jobs again
# instead of failing. The queue already knows a lost runner, a job GitHub could not set up, and a
# download that hit the network or a rate limit. These rules add what only this repository's logs
# say. `match` is a failure annotation of the job, `step` the step that failed.
rerun:
  # The focused Wasm lanes stop at 600 s (`timeout 600s`); a slow runner reaches it with every test
  # still passing. One re-run: a second timeout is the PR's.
  - name: Wasm conformance timed out on a slow runner
    job: '^conformance '
    step: '[Ww]asm (box )?conformance'
    match: '^Process completed with exit code 124\.$'
    times: 1
  # curl -f exits 22 when Maven Central answers 404 or 429 for the stdlib jar the smoke build reads.
  - name: Maven Central refused the Bazel smoke download
    job: '^bazel '
    step: '^build the packaged Bazel module'
    match: '^Process completed with exit code 22\.$'
