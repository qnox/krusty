version: 2
updates:
  # Keep GitHub Actions current (supply-chain): alerts + PRs when a pinned action
  # publishes a new version. Pairs with the workflows; review/merge to advance pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Rust dependencies.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cranelift:
        patterns: ["cranelift-*"]

  # The Gradle plugin build. Its lockfiles and gradle/verification-metadata.xml are committed, so an
  # update also refreshes them (docs/ARCHITECTURE.md) before the build-gradle-plugin job passes.
  - package-ecosystem: gradle
    directory: "/tools/krusty-gradle"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
