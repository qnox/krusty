name: route
description: >-
  Ask the runner controller where this run's jobs should run. The request comes from the
  workflow itself (scripts/route-request.py); the caller proves who it is with the job's GitHub
  OIDC token, so no secret is stored. The answer never blocks CI: when the controller does not
  answer in time or refuses, the step warns and `runs-on` is empty, so every job keeps its own
  labels.
inputs:
  workflow:
    description: Workflow file whose jobs are placed.
    required: true
  asking:
    description: The route job's own id; it is already running, so it is not placed.
    required: true
  outputs:
    description: Newline-separated JOB.OUTPUT=JSON values a matrix is built from.
    default: ''
  url:
    description: The controller's route endpoint.
    default: https://runner-controller.infragnite.dev/route/v1
  audience:
    description: The OIDC audience the controller accepts.
    default: https://runner-controller.infragnite.dev
  timeout:
    description: Seconds to wait for each call.
    default: '10'
outputs:
  mode:
    description: The controller's mode (`shadow` or `enforce`), empty when it gave no answer.
    value: ${{ steps.ask.outputs.mode }}
  runs-on:
    description: JSON object of labels by job key (and by row key for a matrix job); `{}` without an answer.
    value: ${{ steps.ask.outputs.runs-on }}
runs:
  using: composite
  steps:
    - id: ask
      shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        ASKING: ${{ inputs.asking }}
        OUTPUTS: ${{ inputs.outputs }}
        URL: ${{ inputs.url }}
        AUDIENCE: ${{ inputs.audience }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        fallback() {
          echo "::warning title=route::$1; every job keeps its own runs-on"
          echo "mode=" >> "$GITHUB_OUTPUT"
          echo "runs-on={}" >> "$GITHUB_OUTPUT"
          exit 0
        }
        args=(--asking "$ASKING")
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--output "$line")
        done <<< "$OUTPUTS"
        request=$(mktemp)
        python3 "$GITHUB_ACTION_PATH/../../../scripts/route-request.py" "$WORKFLOW" "${args[@]}" > "$request" \
          || fallback "could not build the request"
        [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || fallback "no OIDC token (the job needs id-token: write)"
        token=$(curl -sS --max-time "$TIMEOUT" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value // empty' || true)
        [ -n "$token" ] || fallback "GitHub gave no OIDC token"
        echo "::add-mask::$token"
        answer=$(mktemp)
        status=$(curl -sS --max-time "$TIMEOUT" -o "$answer" -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
          --data-binary "@$request" "$URL" || true)
        if [ "$status" != 200 ]; then
          fallback "the controller answered ${status:-nothing}: $(head -c 500 "$answer" 2>/dev/null || true)"
        fi
        jq -e '."runs-on" | type == "object"' "$answer" > /dev/null || fallback "the answer has no runs-on object"
        echo "mode=$(jq -r '.mode // empty' "$answer")" >> "$GITHUB_OUTPUT"
        echo "runs-on=$(jq -c '."runs-on"' "$answer")" >> "$GITHUB_OUTPUT"
        {
          echo "### route ($(jq -r '.mode // "?"' "$answer"))"
          echo '```json'
          jq . "$answer"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        jq -c . "$answer"
