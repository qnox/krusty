name: batch85-outcomes
on:
  push:
    branches: [ci/batch85-outcomes]
permissions:
  contents: read
  actions: read
jobs:
  survey:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {version: '2.4.10', target: native}
          - {version: '2.4.20', target: native}
          - {version: '2.4.21', target: native}
          - {version: '2.4.0', target: wasm-js}
          - {version: '2.4.10', target: wasm-js}
          - {version: '2.4.20', target: wasm-js}
          - {version: '2.4.21', target: wasm-js}
          - {version: '2.4.0', target: wasm-wasi}
          - {version: '2.4.10', target: wasm-wasi}
          - {version: '2.4.21', target: wasm-wasi}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ca7fff01740b852817c2ea7d693343025b75e7d2
          fetch-depth: 1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: startsWith(matrix.target, 'wasm-')
        with:
          node-version: '22.22.2'
      - name: find installed just
        id: just
        run: if command -v just >/dev/null; then echo 'found=true' >> "$GITHUB_OUTPUT"; fi
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        if: steps.just.outputs.found != 'true'
        with:
          tool: just
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/cache/kotlinc/${{ matrix.version }}
          key: kotlinc-${{ matrix.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.target == 'native'
        with:
          path: target/cache/kotlin-native/${{ matrix.version }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: startsWith(matrix.target, 'wasm-')
        with:
          path: target/cache/krusty-deps
          key: wasm-target-klibs-v1-${{ matrix.target }}-${{ matrix.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.target == 'native'
        with:
          path: target/cache/native-recordings
          key: recorded-kotlinc-native-bytes-${{ matrix.version }}-ca7fff01740b852817c2ea7d693343025b75e7d2
          restore-keys: recorded-kotlinc-native-bytes-${{ matrix.version }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/cache/klib-references
          key: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-ca7fff01740b852817c2ea7d693343025b75e7d2
          restore-keys: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/cache/box-reference-classes
          key: box-reference-classes-${{ matrix.target }}-${{ matrix.version }}-ca7fff01740b852817c2ea7d693343025b75e7d2
          restore-keys: box-reference-classes-${{ matrix.target }}-${{ matrix.version }}-
      - name: reuse the exact completed batch compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: conformance-bin
          run-id: 43575585236
          github-token: ${{ github.token }}
      - name: authenticate complete inputs
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git rev-parse HEAD)" = ca7fff01740b852817c2ea7d693343025b75e7d2
          git rev-parse HEAD > evidence/source.txt
          printf '%s\n' "$VERSION" > evidence/version.txt
          printf '%s\n' "$TARGET" > evidence/target.txt
          echo 'ef982364096f8c50dd8f78022068eb95e5ae0169b21403a3cd48aa959b21e1fb  conformance-bin' | sha256sum -c -
          sha256sum conformance-bin > evidence/binary.sha256
          find tests/box_expected_failures tests/box_expected_not_applicable -type f -name '*.txt' -print0 | sort -z | xargs -0 sha256sum > evidence/manifests.sha256
          find tests/box_regressions -type f -name '*.kt' -print0 | sort -z | xargs -0 sha256sum > evidence/fixtures.sha256
          { java -version 2>&1; if command -v node >/dev/null; then node --version; fi; uname -a; } > evidence/runtime.txt
          chmod +x conformance-bin
          if [ "$TARGET" = native ]; then
            if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
            echo "KRUSTY_RUNTIME_CC=$(command -v clang)" >> "$GITHUB_ENV"
          fi
      - name: full exact-version strict survey
        timeout-minutes: 40
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
          KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: '1800'
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: '1'
          KRUSTY_CLASS_DUMP_WRITE: '0'
        run: |
          set -uo pipefail
          set +e
          unset KRUSTY_BLESS_BOX_EXPECTATIONS KRUSTY_BOX_ONLY KRUSTY_NATIVE_BOX_ONLY KRUSTY_WASM_JS_BOX_ONLY KRUSTY_WASM_WASI_BOX_ONLY
          if [ "$TARGET" = native ]; then
            export KRUSTY_CLASS_DUMP_DIR="$PWD/target/cache/native-recordings"
            timeout 2200 just native-conformance-run "$PWD/conformance-bin" "$VERSION" evidence/native-pct.txt > evidence/survey.log 2>&1
          else
            export KRUSTY_CLASS_DUMP_DIR="$PWD/target/cache/klib-references"
            timeout 2200 just wasm-conformance-run "$TARGET" "$PWD/conformance-bin" "$VERSION" > evidence/survey.log 2>&1
          fi
          status=$?
          printf '%s\n' "$status" > evidence/strict-status.txt
          cat evidence/survey.log
          python3 - <<'PY'
          import json,pathlib,re,sys
          root=pathlib.Path('evidence');text=(root/'survey.log').read_text(errors='replace')
          status=int((root/'strict-status.txt').read_text());lane=(root/'target.txt').read_text().strip()
          rows=re.findall(r'(native|wasm-js|wasm-wasi)-klib conformance: scanned (\d+),[^\n]*compiler-panics (\d+),[^\n]*failed (\d+)',text)
          changes=re.findall(r'^\s+([^\s]+\.kt): expected (\w+), got (\w+)\s*$',text,re.M)
          valid=(len(rows)==1 and rows[0][0]==lane and int(rows[0][1])>=7500 and rows[0][2]=='0' and status in (0,1,101) and 'unexpected non-pass' not in text and 'CompilerPanic' not in text and all(before=='fail' and after=='pass' for _,before,after in changes))
          if status!=0 and not changes:valid=False
          if status==0 and rows and rows[0][3]!='0':valid=False
          if changes and rows and rows[0][3]!='1':valid=False
          result={'source':(root/'source.txt').read_text().strip(),'version':(root/'version.txt').read_text().strip(),'target':lane,'strict_status':status,'full_footer':rows,'changes':changes,'complete_and_only_positive':valid}
          (root/'result.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result));sys.exit(0 if valid else 1)
          PY
          result=$?
          sha256sum -c evidence/manifests.sha256 > evidence/manifests-after.txt || result=1
          sha256sum -c evidence/fixtures.sha256 > evidence/fixtures-after.txt || result=1
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: batch85-outcomes-${{ matrix.target }}-${{ matrix.version }}
          path: evidence/
          if-no-files-found: error
