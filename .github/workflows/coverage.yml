name: coverage

# Instrumented coverage of krusty's own suite, measured once a night on master and held to
# coverage-baseline.json (scripts/coverage-gate.sh). The merge queue runs the same tests
# uninstrumented in ci.yml's `ci` and `e2e` jobs; a regression found here is fixed or blessed in a
# pull request of its own. This is also the only run that executes the compiler's `debug_assert!`
# invariants: the `coverage` profile keeps them on, the `gate` profile does not.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
  id-token: write

env:
  KRUSTY_TEST_FAILURE_DIR: ${{ github.workspace }}/test-failures

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # Coverage mappings are compiler-version dependent. Keep the committed baseline and the
      # instrumenting compiler on the same immutable nightly.
      KRUSTY_COVERAGE_TOOLCHAIN: nightly-2026-09-05
      # The instrumented build compiles krusty's lib and test targets side by side, and every
      # extra job token also lets rustc run more LLVM threads. Four jobs fit in 16 GB, which is
      # what GitHub's four-core runners use; eight do not.
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: base commit
        id: base
        run: |
          base=$(git log -1 --format='%(trailers:key=Merge-Queue-Base,valueonly)' HEAD | head -n 1)
          echo "sha=${base:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # Self-hosted runners have no preinstalled rustup.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - name: install coverage tooling
        run: rustup toolchain install "$KRUSTY_COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # Prebuilt binary: `cargo install cargo-llvm-cov` compiled it from source on every run
      # (~75s of the ci job).
      - id: llvm-cov-on-path
        name: look for an installed cargo-llvm-cov
        run: if command -v cargo-llvm-cov > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.llvm-cov-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - id: just-on-path
        name: look for an installed just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.just-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just
      # krusty-toolchain's oracle builds the Build Tools API implementation with its Gradle
      # wrapper, which does not run on JDK 25; the coverage gate points it at JDK 21. The last
      # version listed stays JAVA_HOME.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: |
            21.0.13+0.3.1
            25.0.5+0.3.1
      # Toolchain entries are named by the exact toolchain they hold, never by a hash of the
      # checkout, and every job that needs one restores the same entry.
      - name: select the maximum Kotlin version
        id: max-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore kotlinc ${{ steps.max-version.outputs.version }}
        id: kotlinc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ steps.max-version.outputs.version }}
          key: kotlinc-${{ steps.max-version.outputs.version }}
      - name: restore serialization and KSP corpora
        id: kotlin-corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/plugin-corpus
            target/cache/ksp-corpus
          key: kotlin-test-corpora-${{ steps.max-version.outputs.version }}
      - name: restore box corpus
        id: box-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus
          # The checkout carries the box corpus, the mock JDK its tests compile against, the CLI
          # corpus, the bytecode corpora, and the test-generator sources that select each target's
          # cases. A key hit is never re-saved, so the key changes whenever those inputs do.
          key: box-cli-diagnostics-and-generator-corpus-v4-${{ hashFiles('kotlin-versions', 'scripts/box_selection.py', 'tests/box_selection_sources.txt') }}
      # A hit must already hold every corpus input: provisioning then refuses to fetch.
      - name: forbid corpus fetches after a cache hit
        if: steps.box-corpus.outputs.cache-hit == 'true'
        run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
      - name: select recorded-byte cache version
        id: recorded-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore recorded kotlinc bytes
        id: recorded-bytes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-
      # krusty-toolchain's references (JetBrains' `kotlin` and the JDK glob matcher) are cached the
      # same way: restored from the base, run only for a missing entry, saved by master.
      # `tests/support/oracle.rs` keys each entry by the reference's identity and its inputs.
      - name: restore Kotlin Toolchain oracle output
        id: toolchain-oracle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-toolchain-oracle
          key: kotlin-toolchain-oracle-${{ steps.base.outputs.sha }}
          restore-keys: |
            kotlin-toolchain-oracle-
      - name: restore Kotlin Toolchain distribution
        id: kotlin-toolchain-cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: kotlin-toolchain-cli-${{ runner.os }}-${{ hashFiles('scripts/kotlin-toolchain/kotlin') }}
      # The restored archive is replayed, and a test it lacks compiles with kotlinc. The master
      # `e2e` job publishes the archive; this workflow only restores the caches it reads.
      - name: select recorded-byte cache mode
        id: recorded-mode
        run: |
          echo "record=0" >> "$GITHUB_OUTPUT"
          echo "write=0" >> "$GITHUB_OUTPUT"
          echo "compile_missing=1" >> "$GITHUB_OUTPUT"
      # The native runtime's thread drivers run on every supported architecture: built for each
      # with clang and lld, and run under QEMU's user-mode emulators (tests/native_runtime_e2e.rs).
      # The packages are cached by the runner's release, so a run installs them without the Ubuntu
      # archive: the hosted runners' resolver failed for every *.ubuntu.com host for hours at a time.
      - name: select cross-architecture package cache
        id: cross-packages
        run: echo "key=cross-packages-v1-$(. /etc/os-release && echo "$ID-$VERSION_ID")-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
      - name: restore cross-architecture packages
        id: cross-packages-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cross-packages
          key: ${{ steps.cross-packages.outputs.key }}
      - name: install cross-architecture runners
        # The POSIX drivers compile against each target's own glibc headers, so the layer's
        # hand-copied numbers and layouts are checked against the target's, not the host's.
        # Self-hosted runners ship these preinstalled and have no sudo.
        run: |
          set -euo pipefail
          if [ -x /usr/bin/qemu-aarch64 ] && [ -x /usr/bin/qemu-riscv64 ] && [ -x /usr/bin/ld.lld ] &&
            [ -d /usr/aarch64-linux-gnu/include ] && [ -d /usr/riscv64-linux-gnu/include ]; then
            exit 0
          fi
          packages=(qemu-user lld libc6-dev-arm64-cross libc6-dev-riscv64-cross)
          # The cached packages are exactly what the archive installed on this release: no network.
          if compgen -G "$HOME/cross-packages/*.deb" >/dev/null && sudo dpkg -i "$HOME"/cross-packages/*.deb; then
            exit 0
          fi
          # From the archive, falling back to another official mirror when the archive's hosts do
          # not resolve. apt verifies every index against Ubuntu's signing keys either way.
          if ! sudo apt-get update --error-on=any; then
            mirror=https://mirrors.edge.kernel.org/ubuntu/
            echo "::warning::the Ubuntu archive is unreachable; installing from $mirror"
            [ ! -f /etc/apt/apt-mirrors.txt ] || echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            for f in /etc/apt/sources.list.d/*.sources; do
              [ ! -f "$f" ] || sudo sed -i -E "s#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#$mirror#g" "$f"
            done
            sudo apt-get update --error-on=any
          fi
          sudo apt-get install -y --download-only "${packages[@]}"
          mkdir -p "$HOME/cross-packages"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/cross-packages/" {} +
          sudo apt-get install -y "${packages[@]}"
      - name: restore Kotlin/Native ${{ steps.max-version.outputs.version }}
        id: kotlin-native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ steps.max-version.outputs.version }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.max-version.outputs.version }}
      - name: provision Native for the normal test suites
        run: |
          root=$(just kotlin-native "$(just max-version)")
          echo "KRUSTY_KOTLIN_NATIVE=$root" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/krusty-tools/maven
          key: maven-distribution-3.9.11-v1
      - name: install Maven
        run: scripts/install-maven.sh 3.9.11
      # Maven Central, the Gradle Plugin Portal and the krusty-build-tools wrapper's distribution
      # through Infragnite's package cache (maven.infragnite.dev), into the Gradle user home the
      # coverage gate's Gradle builds use.
      - name: send Gradle's and Maven's downloads through the package cache
        uses: infragnite/package-cache-action@3301abc273091e9b02fb391abdfd3a887a18ef4f # main
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/krusty-build-tools-gradle-user-home
        with:
          maven: 'true'
      - name: coverage gate
        id: coverage
        env:
          # The e2e suite is one process. An instrumented run is about seventeen minutes; thirty
          # minutes leaves room for a slow runner and still fails a hung binary.
          KRUSTY_COVERAGE_E2E_TIMEOUT_SECONDS: 1800
          # A change to what krusty-toolchain's oracle entries hold re-runs every Kotlin Toolchain
          # case live (this workflow restores, but never saves, the oracle cache), which takes
          # compile_cases past the ordinary 120 seconds.
          KRUSTY_COVERAGE_TEST_TIMEOUT_SECONDS: 600
          KRUSTY_BUILD_TOOLS_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          # rust-cache prunes target before archiving it. A Gradle Kotlin-DSL workspace restored
          # from there can therefore lack metadata.bin, which Gradle 8 cannot regenerate.
          KRUSTY_BUILD_TOOLS_GRADLE_USER_HOME: ${{ runner.temp }}/krusty-build-tools-gradle-user-home
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_RECORD_CLASS_DUMPS: ${{ steps.recorded-mode.outputs.record }}
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
          KRUSTY_TOOLCHAIN_RUN_MISSING: 1
          KRUSTY_REQUIRE_KLIB: "1"
          KRUSTY_REQUIRE_KOTLIN_NATIVE: "1"
        run: just coverage-gate
      - name: upload failed program evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: test-failures/
          if-no-files-found: ignore
