name: oss corpus

# Conformance on the top-starred Kotlin projects and the Android sample listed in
# scripts/oss-corpus/projects.tsv. Each project builds twice from a pinned commit with its own
# Gradle build: once with kotlinc, once with the krusty Gradle plugin applied by an init script. The
# run reports, per project, how many Kotlin/JVM compilations krusty built, how many classes match
# kotlinc's byte for byte, why the rest missed, how many of the project's own tests that pass on
# kotlinc's classes also pass on krusty's, and what both builds cost (compile time, wall and CPU
# time, peak memory). It needs full network access for the projects'
# dependencies and toolchains. It runs nightly on master and on demand; ordinary pushes and pull
# requests never schedule it, and it gates nothing.
#
# The nightly run, and a manual run that asks to publish, records its results on the
# `corpus-results` branch: README.md is the current scoreboard, projects/<name>/ the latest result
# of each project, and history.tsv one line per project per run.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: Space-separated project names from scripts/oss-corpus/projects.tsv; empty runs every project.
        required: false
        default: ''
      publish:
        description: Record the results on the corpus-results branch.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One corpus run at a time. Neither a running nor a pending run is cancelled: `queue: max` keeps
# every waiting run queued instead of the single pending slot a newer run would replace.
concurrency:
  group: oss-corpus
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test the corpus scripts
        run: python3 -m unittest discover -s scripts/oss-corpus -p 'test_*.py'
      - name: select projects
        id: select
        env:
          REQUESTED: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          listed=$(awk -F'\t' '!/^#/ && NF { print $1 }' scripts/oss-corpus/projects.tsv)
          if [ -n "$REQUESTED" ]; then
            for name in $REQUESTED; do
              grep -qxF "$name" <<<"$listed" || { echo "unknown corpus project: $name" >&2; exit 1; }
            done
            listed=$(tr ' ' '\n' <<<"$REQUESTED" | awk NF)
          fi
          echo "projects=$(jq -Rnc '[inputs]' <<<"$listed")" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: build krusty and its Gradle plugin
        # Frame pointers let the project jobs sample krusty's call stacks cheaply.
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          set -euo pipefail
          cargo build --profile gate -p krusty-cli --bin krusty
          version=$(just version)
          scripts/package-gradle-plugin.sh "$version" "$PWD/dist-gradle"
          mkdir corpus-tools
          cp target/gate/krusty corpus-tools/krusty
          unzip -q "dist-gradle/krusty-gradle-plugin-$version.zip" -d corpus-tools
          echo "$version" > corpus-tools/plugin-version
          cargo install inferno --version 0.12.8 --locked --root corpus-tools/inferno
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-tools
          path: corpus-tools
          if-no-files-found: error

  project:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.prepare.outputs.projects) }}
    runs-on: ubuntu-latest
    # Two measured builds, each followed by a test build of up to an hour, after a warm-up.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: |
            25
            17
            21
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-tools
          path: corpus-tools
      - name: install perf
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)"
          # Lets the runner's user sample every process and resolve kernel symbols.
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: build and test ${{ matrix.project }} with kotlinc and with krusty
        env:
          CORPUS_PERF: perf
        run: |
          set -euo pipefail
          chmod +x corpus-tools/krusty corpus-tools/inferno/bin/*
          export CORPUS_FLAMEGRAPH=$PWD/corpus-tools/inferno/bin/inferno-flamegraph
          version=$(cat corpus-tools/plugin-version)
          scripts/oss-corpus/run.sh "${{ matrix.project }}" "$RUNNER_TEMP/corpus" \
            "$PWD/corpus-tools/krusty" \
            "$PWD/corpus-tools/krusty-gradle-plugin-$version/repository" "$version"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/corpus/out/${{ matrix.project }}/compare.json
            ${{ runner.temp }}/corpus/logs
          if-no-files-found: warn

  summary:
    needs: [project]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: corpus-*
          path: results
      - name: look up stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A pinned fork (a mirror that keeps the pinned commit) counts its upstream's stars.
          awk -F'\t' '!/^#/ && NF { print $1 "\t" $2 }' scripts/oss-corpus/projects.tsv |
            while IFS=$'\t' read -r name url; do
              repo=${url#https://github.com/}
              stars=$(gh api "repos/$repo" --jq 'if .fork then .source.stargazers_count else .stargazers_count end' || true)
              printf '%s\t%s\n' "$name" "$stars"
            done > stars.tsv
      - name: summarize
        run: |
          set -euo pipefail
          mapfile -t reports < <(find results -name compare.json | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "no project produced a comparison" >&2
            exit 1
          fi
          python3 scripts/oss-corpus/summarize.py --stars stars.tsv --plugins results "${reports[@]}" \
            | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary
          path: summary.md
      - name: publish to corpus-results
        if: github.event_name == 'schedule' || inputs.publish
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tree=$RUNNER_TEMP/corpus-results
          if git fetch -q --depth 1 origin corpus-results; then
            git worktree add -q "$tree" FETCH_HEAD
            git -C "$tree" checkout -q -B corpus-results
          else
            git worktree add -q --orphan -b corpus-results "$tree"
          fi
          python3 scripts/oss-corpus/publish.py results "$tree" scripts/oss-corpus/projects.tsv \
            "$GITHUB_SHA" "$(date -u +%F)" "$RUN_URL"
          mapfile -t published < <(find "$tree/projects" -name compare.json | sort)
          {
            echo '# krusty conformance corpus'
            echo
            echo 'Each project is built from a pinned commit with its own Gradle build, once with kotlinc and'
            echo 'once with the krusty Gradle plugin, and the class files of every Kotlin/JVM compilation are'
            echo 'compared byte for byte; the project'"'"'s own tests then run on the classes each build compiled.'
            echo 'Written by the `oss corpus` workflow (`.github/workflows/oss-corpus.yml`'
            echo 'on master); `projects/` holds each project'"'"'s latest result and `history.tsv` every run.'
            echo
            python3 scripts/oss-corpus/summarize.py --stars stars.tsv --plugins "$tree/projects" \
              --json "$tree/results.json" "${published[@]}"
          } > "$tree/README.md"
          git -C "$tree" add -A
          if git -C "$tree" diff --cached --quiet; then
            echo "corpus-results is unchanged"
            exit 0
          fi
          # AGENTS.md: every commit, this data branch's included, is the maintainer's.
          GIT_AUTHOR_NAME='Anton Efimchuk' GIT_AUTHOR_EMAIL='anton.efimchuk@gmail.com' \
            GIT_COMMITTER_NAME='Anton Efimchuk' GIT_COMMITTER_EMAIL='anton.efimchuk@gmail.com' \
            git -C "$tree" commit -q -m "Corpus results for ${GITHUB_SHA::7} ($(date -u +%F))"
          git -C "$tree" push -q origin corpus-results
