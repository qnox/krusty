name: oss corpus

# Conformance on the top-starred Kotlin projects and the Android sample listed in
# scripts/oss-corpus/projects.tsv. A row whose lane is `lsp` only would be measured by
# scripts/parity-scan.py and not built here. intellij-community builds with Bazel
# (scripts/oss-corpus/bazel.sh). Each built project builds twice from a pinned commit with its own
# Gradle or Bazel build: once with kotlinc, once with the krusty Gradle plugin applied by an init script. The
# run reports, per project, how many Kotlin/JVM compilations krusty built, how many classes match
# kotlinc's byte for byte, why the rest missed, how many of the project's own tests that pass on
# kotlinc's classes also pass on krusty's, and what both builds cost (compile time, wall and CPU
# time, peak memory). It needs full network access for the projects'
# dependencies and toolchains. It runs nightly on master and on demand; ordinary pushes and pull
# requests never schedule it, and it gates nothing.
#
# Per-project results and logs, plus the combined Markdown and JSON summaries, remain in
# this run's workflow artifacts.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: Space-separated project names from scripts/oss-corpus/projects.tsv; empty runs every project.
        required: false
        default: ''

permissions:
  contents: read

# One corpus run at a time. Neither a running nor a pending run is cancelled: `queue: max` keeps
# every waiting run queued instead of the single pending slot a newer run would replace.
concurrency:
  group: oss-corpus
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test the corpus scripts
        run: python3 -m unittest discover -s scripts/oss-corpus -p 'test_*.py'
      - name: select projects
        id: select
        env:
          REQUESTED: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          listed=$(python3 scripts/oss-corpus/projects.py --lane compile)
          if [ -n "$REQUESTED" ]; then
            for name in $REQUESTED; do
              grep -qxF "$name" <<<"$listed" || { echo "unknown corpus project: $name" >&2; exit 1; }
            done
            listed=$(tr ' ' '\n' <<<"$REQUESTED" | awk NF)
          fi
          echo "projects=$(jq -Rnc '[inputs]' <<<"$listed")" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: build krusty and its Gradle plugin
        # Frame pointers let the project jobs sample krusty's call stacks cheaply.
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          set -euo pipefail
          cargo build --profile gate -p krusty-cli --bin krusty
          version=$(just version)
          scripts/package-gradle-plugin.sh "$version" "$PWD/dist-gradle"
          mkdir corpus-tools
          cp target/gate/krusty corpus-tools/krusty
          unzip -q "dist-gradle/krusty-gradle-plugin-$version.zip" -d corpus-tools
          echo "$version" > corpus-tools/plugin-version
          cargo install inferno --version 0.12.8 --locked --root corpus-tools/inferno
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-tools
          path: corpus-tools
          if-no-files-found: error

  project:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.prepare.outputs.projects) }}
    runs-on: ubuntu-latest
    # Two measured builds, each followed by a test build of up to an hour, after a warm-up.
    timeout-minutes: 360
    # Bitwarden resolves its SDK from GitHub Packages, which answers 401 without a token even for a
    # public package; its settings script reads the token from GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          # kotlin's own build asks for JDK 8, 11 and 17 toolchains; run.sh offers Gradle every one
          # installed here. The last one listed is JAVA_HOME.
          java-version: |
            8.0.512+9
            11.0.33+10
            25.0.5+0.3.1
            17.0.21+0.3.1
            21.0.13+0.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-tools
          path: corpus-tools
      - name: free disk space for a Bazel project
        # A Bazel build keeps its whole output tree and every external repository (toolchains,
        # libraries) on disk; the runner's preinstalled SDKs it does not use make room for them.
        if: hashFiles(format('scripts/oss-corpus/bazel/{0}/targets', matrix.project)) != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
      - name: install perf
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)"
          # Lets the runner's user sample every process and resolve kernel symbols.
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: build and test ${{ matrix.project }} with kotlinc and with krusty
        env:
          CORPUS_PERF: perf
          # A read-only token: the workflow's own, or CORPUS_PACKAGES_TOKEN (read:packages only) when
          # the workflow's token cannot read another owner's package.
          GITHUB_TOKEN: ${{ secrets.CORPUS_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          chmod +x corpus-tools/krusty corpus-tools/inferno/bin/*
          export CORPUS_FLAMEGRAPH=$PWD/corpus-tools/inferno/bin/inferno-flamegraph
          version=$(cat corpus-tools/plugin-version)
          scripts/oss-corpus/run.sh "${{ matrix.project }}" "$RUNNER_TEMP/corpus" \
            "$PWD/corpus-tools/krusty" \
            "$PWD/corpus-tools/krusty-gradle-plugin-$version/repository" "$version"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/corpus/out/${{ matrix.project }}/compare.json
            ${{ runner.temp }}/corpus/logs
          if-no-files-found: warn

  summary:
    needs: [prepare, project]
    if: always()
    runs-on: ubuntu-latest
    # Reading the previous run's summary artifact takes actions: read.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: corpus-*
          path: results
      - name: look up stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A pinned fork (a mirror that keeps the pinned commit) counts its upstream's stars.
          python3 scripts/oss-corpus/projects.py --lane compile --urls |
            while IFS=$'\t' read -r name url; do
              repo=${url#https://github.com/}
              stars=$(gh api "repos/$repo" --jq 'if .fork then .source.stargazers_count else .stargazers_count end' || true)
              printf '%s\t%s\n' "$name" "$stars"
            done > stars.tsv
      - name: fetch the previous nightly's summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest scheduled master run created before this one whose summary artifact is still
          # kept; none on the first run or after every earlier artifact expired. Creation time, not
          # the latest attempt, orders the runs, so a rerun of an older nightly never compares itself
          # with a later one.
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          gh run list -R "$GITHUB_REPOSITORY" --workflow oss-corpus.yml --branch master --event schedule \
            --status completed --limit 60 --json databaseId,createdAt |
            jq -r --arg created "$created" \
              '[.[] | select((.createdAt | fromdate) < ($created | fromdate))] | sort_by(.createdAt) | reverse | .[].databaseId' |
            while read -r id; do
              kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                --jq '[.artifacts[] | select(.name == "summary" and (.expired | not))] | length')
              [ "$kept" -eq 1 ] || continue
              gh run download -R "$GITHUB_REPOSITORY" "$id" -n summary -D previous
              break
            done
      - name: summarize
        env:
          # The projects this run was asked to measure: a run limited to some projects expects only those.
          EXPECTED: ${{ needs.prepare.outputs.projects }}
        run: |
          set -euo pipefail
          jq -r '.[]' <<<"$EXPECTED" > expected.tsv
          previous=()
          if [ -f previous/summary.json ]; then
            previous=(--previous previous/summary.json)
          fi
          mapfile -t reports < <(find results -name compare.json | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "no project produced a comparison" >&2
            exit 1
          fi
          # A project of this run whose job left no comparison is reported as not measured, with why,
          # instead of vanishing from the tables. The job summary page refuses more than 1 MiB, so
          # it gets the report cut to fit; summary.md, uploaded below, is complete.
          python3 scripts/oss-corpus/summarize.py --stars stars.tsv --expected expected.tsv --results results \
            --plugins results --json summary.json --step-summary "$GITHUB_STEP_SUMMARY" \
            "${previous[@]}" "${reports[@]}" > summary.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary
          path: |
            summary.md
            summary.json
      - name: fail when a project was not measured
        run: |
          set -euo pipefail
          # The summary and its json are published above either way, so the next run still compares
          # with this one; the run itself is not green while a project has no result.
          if jq -e '.not_measured | length == 0' summary.json >/dev/null; then
            exit 0
          fi
          jq -r '.not_measured[] | "::error title=\(.name) was not measured::\(.reason)"' summary.json
          exit 1
