name: attribution

# AGENTS.md forbids AI, assistant and tool attribution in commits and pull requests. `edited` re-runs
# the check when only the title or body changes, which the main ci workflow does not react to.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: commits
        env:
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.event.after) || format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: scripts/check-attribution.sh "$RANGE"
      # A squash merge is authored by whoever opened the pull request, so a PR opened by an
      # assistant's app account lands on master under that account. Such a PR must be reopened
      # from the maintainer's account.
      - name: title, body and author
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf 'opened by %s\n\n%s\n\n%s\n' "$PR_AUTHOR" "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/check-attribution.sh --text "$RUNNER_TEMP/pr.txt" "pull request"
