name: attribution

# AGENTS.md forbids AI, assistant and tool attribution in commits and pull requests. Commit
# messages are checked at the start of the ci job, which already runs on a push, a merge queue,
# and a pull request synchronize. This workflow is only the title and body: `edited` does not
# start ci, and queueing a second runner for an 18-second check on every push was filling the
# same runner cap as the conformance jobs.
on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: read

# A new edit replaces the queued run. Repeated title or body updates were leaving several copies
# of this check waiting on a runner.
concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read the current title and body rather than the event payload: an integration may append a
      # footer at creation that is removed right after, and a re-run must see the edited text.
      # Dependabot's text is quoted upstream release notes, which may name an assistant that
      # contributed upstream; it says nothing about who wrote this change.
      - name: title and body
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body --jq '.title + "\n\n" + .body' > "$RUNNER_TEMP/pr.txt"
          scripts/check-attribution.sh --text "$RUNNER_TEMP/pr.txt" "pull request text"
      # A squash merge is authored by whoever opened the pull request, so a squash-merged PR opened
      # by an assistant's app account lands on master under that account. Warn so it is merged with
      # "Rebase and merge", which keeps the maintainer-authored commits.
      - name: opener
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if printf '%s\n' "$PR_AUTHOR" | grep -qiE 'claude|codex|copilot|openai|anthropic'; then
            echo "::warning title=attribution::opened by $PR_AUTHOR; merge with Rebase and merge, not squash, so master keeps the maintainer as author"
          fi
