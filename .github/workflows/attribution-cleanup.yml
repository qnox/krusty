name: attribution cleanup

# A pull_request run uses the workflow and script of the pull request's base and head, so a
# pull request stacked on a branch cut before the footer removal landed, or one from a fork (whose
# token is read-only), fails the attribution check on a footer or header an integration added
# instead of removing it. A workflow_run always runs master's copy of this file with a write
# token, so it removes that text with master's script and re-runs the failed check. Nothing from
# the pull request is checked out or run.
on:
  workflow_run:
    workflows: [attribution]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: attribution-cleanup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  strip:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ["self-hosted", "utility"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only a body this script changes is written back and re-checked. A failure on any other
      # mention stays failed, so a re-run cannot repeat.
      - name: strip and re-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$HEAD" \
            --jq '.[].number' > "$RUNNER_TEMP/prs.txt"
          while read -r pr; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.body // ""' > "$RUNNER_TEMP/body.txt"
            scripts/check-attribution.sh --strip-footer "$RUNNER_TEMP/body.txt" > "$RUNNER_TEMP/clean.txt"
            if cmp -s "$RUNNER_TEMP/body.txt" "$RUNNER_TEMP/clean.txt"; then
              echo "#$pr: nothing to remove"
              continue
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F "body=@$RUNNER_TEMP/clean.txt" > /dev/null
            echo "::notice title=attribution::removed the footer from the body of #$pr"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/rerun-failed-jobs" > /dev/null
          done < "$RUNNER_TEMP/prs.txt"
