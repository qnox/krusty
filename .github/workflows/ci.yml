name: coroutine machine combined validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on:
      - self-hosted
      - rust-4c-8gb
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: build-tool-bins
          save-if: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: find installed just
        id: just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: install just
        if: steps.just.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: just
      - name: authenticate the exact combined source and whole fixtures
        run: |
          set -euo pipefail
          mkdir -p evidence
          source=b50427b8be676a73c4e4edbf490835d54b980ae0
          git diff --exit-code "$source" HEAD -- . ':!.github/workflows/ci.yml'
          git rev-parse "$source" > evidence/source-commit.txt
          sha256sum \
            tests/box_regressions/suspendStateMachineResumesLocalsAndFailure.kt \
            tests/box_regressions/multimodule/suspendStateMachineExternalCps.kt \
            tests/box_regressions/suspendLambdaRetainedInlineObject.kt \
            tests/box_regressions/suspendLambdaRetainedInlineObjectCaptures.kt \
            tests/box_regressions/resultCompanionIdentity.kt \
            src/klib_lowering/tests/accessor_calls.rs \
            > evidence/fixtures.sha256
      - name: check every target and test API
        timeout-minutes: 25
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 cargo check --workspace --all-targets > evidence/check.log 2>&1
          cat evidence/check.log
      - name: build the conformance executable once
        timeout-minutes: 40
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 bash scripts/cargo-test-binary.sh conformance -p krusty --test conformance > evidence/build.log 2>&1
          cat evidence/build.log
          tail -n 1 evidence/build.log > evidence/binary-path.txt
          cp "$(tail -n 1 evidence/build.log)" conformance-bin
          cp conformance-bin evidence/conformance-bin
          sha256sum conformance-bin > evidence/binary.sha256
      - name: provision exact JVM, Native, and Wasm inputs
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q clang; fi
          echo "KRUSTY_RUNTIME_CC=$(command -v clang)" >> "$GITHUB_ENV"
          echo "KRUSTY_LANGUAGE_VERSION=2.4.21" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLINC=$(just kotlinc 2.4.21)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native 2.4.21)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_BOX_DIR=$(just box-corpus 2.4.21)" >> "$GITHUB_ENV"
      - name: run focused accessor owner tests
        timeout-minutes: 25
        env:
          KRUSTY_REQUIRE_KLIB: '1'
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 cargo test -p krusty --lib dependency_accessors_require_exact_generic_substitutions -- --nocapture > evidence/accessor-backend.log 2>&1
          cat evidence/accessor-backend.log
          CARGO_BUILD_JOBS=1 cargo test -p krusty --lib a_generic_extension_getter_keeps_its_selected_formal_through_body_lowering -- --nocapture > evidence/accessor-klib-producer.log 2>&1
          cat evidence/accessor-klib-producer.log
      - name: run every whole coroutine and Result companion fixture on all four targets
        timeout-minutes: 35
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_TEST_THREADS: '1'
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: '1'
          KRUSTY_REQUIRE_WASM_JS_CONFORMANCE: '1'
          KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE: '1'
        run: |
          set -uo pipefail
          set +e
          result=0
          run_case() {
            local lane="$1" fixture="$2" test_name="$3" key="$4" selector
            if [ "$lane" = JVM ]; then
              selector=KRUSTY_BOX_ONLY
            else
              selector="KRUSTY_${lane}_BOX_ONLY"
            fi
            env "$selector=$fixture" timeout 120 ./conformance-bin "$test_name" --nocapture > "evidence/$key.log" 2>&1
            local status=$?
            printf '%s\t%s\n' "$key" "$status" | tee -a evidence/status.tsv
            cat "evidence/$key.log"
            if [ "$status" -ne 0 ] || ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "evidence/$key.log"; then
              result=1
            fi
          }
          for fixture in \
            suspendStateMachineResumesLocalsAndFailure.kt \
            multimodule/suspendStateMachineExternalCps.kt \
            suspendLambdaRetainedInlineObject.kt \
            suspendLambdaRetainedInlineObjectCaptures.kt \
            resultCompanionIdentity.kt; do
            run_case JVM "$fixture" kotlin_codegen_box_conformance "jvm-$(basename "$fixture" .kt)"
            run_case NATIVE "$fixture" kotlin_codegen_box_native_conformance "native-$(basename "$fixture" .kt)"
            run_case WASM_JS "$fixture" kotlin_codegen_box_wasm_js_conformance "wasm-js-$(basename "$fixture" .kt)"
            run_case WASM_WASI "$fixture" kotlin_codegen_box_wasm_wasi_conformance "wasm-wasi-$(basename "$fixture" .kt)"
          done
          exit "$result"
      - name: upload complete evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coroutine-result-combined-evidence
          path: evidence/
          if-no-files-found: error
