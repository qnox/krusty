name: ci

# Build the conformance test binary once. Every supported Kotlin version gets independent JVM,
# Native, and Wasm matrix rows. Each row owns its corpus and focused target regressions.
# Publish only after all rows pass and every version matches its committed platform expectations.
# `ci-and-conformance` is the one required check over core CI, conformance (including the focused
# KLIB decoder/oracle checks), and Gradle release/compatibility validation.
# `merge_group` runs the same checks on a merge queue's combined commit: two pull requests can each
# match the lists on their own base and still disagree with them once both are on master.
on:
  pull_request:
  merge_group:
  push:
    branches: [master]

permissions:
  contents: read

# One run per pull-request or merge-group ref, so an update supersedes its older run. Every master
# push uses a unique group and remains authoritative evidence even when a newer commit is queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Asks the runner controller where this run's jobs should run (infragnite/route-runner). In shadow
  # mode the answer is only logged and recorded beside where each job really ran; every job keeps
  # its own runs-on. No job waits for this one. Fork PRs get no OIDC token and do not ask.
  route:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runners that ship just skip the download (install-action always fetches it from
      # GitHub releases, even when it is installed); others install it as before.
      - &just-on-path
        id: just-on-path
        name: look for an installed just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - &install-just
        if: steps.just-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      # The same value build-tool-bins publishes as its matrix output.
      - name: select supported Kotlin versions
        id: versions
        run: echo "matrix=$(just matrix-json)" >> "$GITHUB_OUTPUT"
      - uses: infragnite/route-runner@2c24bcc9fe2f764ea321e285faeffda8e50f89ea # v1
        with:
          workflow: .github/workflows/ci.yml
          asking: route
          outputs: build-tool-bins.matrix=${{ steps.versions.outputs.matrix }}

  # Lint and coverage are independent merge gates. Give each its own runner so the clean Clippy
  # build does not sit on the coverage critical path. Conformance and Gradle run prebuilt artifact
  # families from their independent producer jobs below; neither matrix compiles krusty again.
  # TEMP (2026-11-07): GHA hosted queue is backed up — temporarily run the heavy ubuntu-latest
  # jobs on self-hosted rust-4c-8gb too (same fork guard). Revert once the hosted backlog clears;
  # then dual-label + route enforce can choose GHA vs own. route stays on ubuntu-latest.
  # Fork PRs still run on ubuntu-latest: self-hosted runners never take fork PR jobs.
  lint:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Commit messages are checked here so a push does not queue a second workflow for them.
      # The check finishes in seconds; a separate job was still waiting on a runner.
      - name: attribution commits
        env:
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.event.after) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || 'HEAD^1..HEAD^2' }}
        run: scripts/check-attribution.sh "$RANGE"
      - name: validate pinned IntelliJ patch
        run: scripts/check-intellij-patch.sh
      # The release job runs tools/krusty-gradle's wrapper with the signing key, without setup-gradle's
      # wrapper validation; every committed wrapper is checked here instead.
      - name: validate Gradle wrappers
        run: scripts/check-gradle-wrappers.sh
      - name: outcome manifests only shrink
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: scripts/check-outcome-lists.sh "$BASE" "$HEAD"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Self-hosted runners have no JDK on PATH (ubuntu-latest defaults to 17); the justfile runs
      # `java -version`.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - *just-on-path
      - *install-just
      - name: lint
        run: just lint

  # krusty-plugin-host is outside the default members and the coverage packages, so its own
  # compiler-independent tests run here. Compiler-dependent plugin integrations run in `ci`.
  plugin-host:
    # GitHub-hosted: these tests ran out of memory on the 8 GB self-hosted runners, and GitHub's
    # Linux runners (16 GB) had free slots.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      # The host tests start real compiler-plugin hosts from their pinned toolchains on the
      # runner's JDK. The toolchains and compiled adapters stay in krusty's cache. Each job keeps
      # its own entry: this job and ci provision different Kotlin versions, and an entry is never
      # saved again once its key hits, so a shared one held only the first saver's jars and the
      # other job downloaded the rest from Maven Central on every run (~190 MB).
      - &plugin-host-runtime-cache
        name: cache plugin host runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/krusty/plugin-host
          key: plugin-host-${{ github.job }}-${{ hashFiles('crates/krusty-plugin-host/src/pins/*.tsv', 'crates/krusty-plugin-host/adapter/*', 'crates/krusty-plugin-host/ksp-adapter/**') }}
      - name: plugin host tests
        run: cargo test --profile gate -p krusty-plugin-host -- --include-ignored

  ci:
    runs-on: ubuntu-latest
    env:
      # Coverage mappings are compiler-version dependent. Keep the committed baseline and the
      # instrumenting compiler on the same immutable nightly.
      KRUSTY_COVERAGE_TOOLCHAIN: nightly-2026-09-05
      # The instrumented build compiles krusty's lib and test targets side by side, and every
      # extra job token also lets rustc run more LLVM threads. Four jobs fit in 16 GB, which is
      # what GitHub's four-core runners use; eight do not.
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Self-hosted runners have no preinstalled rustup.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: install coverage tooling
        run: rustup toolchain install "$KRUSTY_COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # Prebuilt binary: `cargo install cargo-llvm-cov` compiled it from source on every run
      # (~75s of the ci job).
      - id: llvm-cov-on-path
        name: look for an installed cargo-llvm-cov
        run: if command -v cargo-llvm-cov > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.llvm-cov-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - *just-on-path
      - *install-just
      # krusty-toolchain's oracle builds the Build Tools API implementation with its Gradle
      # wrapper, which does not run on JDK 25; the coverage gate points it at JDK 21. The last
      # version listed stays JAVA_HOME.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: |
            21
            25
      - name: cache kotlin toolchain and corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/kotlinc
            target/cache/ser-corpus
            target/cache/ksp-corpus
          key: kotlin-toolchain-${{ hashFiles('kotlin-versions') }}
      - name: cache box corpus
        id: box-corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus
          # The checkout carries the box corpus, the mock JDK its tests compile against, and the CLI
          # corpus. A key hit is never re-saved, so the salt changes whenever those inputs do.
          key: box-and-cli-corpus-v1-${{ hashFiles('kotlin-versions') }}
      # A hit must already hold every corpus input: provisioning then refuses to fetch.
      - name: forbid corpus fetches after a cache hit
        if: steps.box-corpus.outputs.cache-hit == 'true'
        run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
      - name: select recorded-byte cache version
        id: recorded-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore recorded kotlinc bytes
        id: recorded-bytes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-
      # krusty-toolchain's references (JetBrains' `kotlin` and the JDK glob matcher) are cached the
      # same way: restored from the base, run only for a missing entry, saved by master.
      # `tests/support/oracle.rs` keys each entry by the reference's identity and its inputs.
      - name: restore Kotlin Toolchain oracle output
        id: toolchain-oracle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-toolchain-oracle
          key: kotlin-toolchain-oracle-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            kotlin-toolchain-oracle-
      - name: cache Kotlin Toolchain distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: kotlin-toolchain-cli-${{ runner.os }}-${{ hashFiles('scripts/kotlin-toolchain/kotlin') }}
      - name: select recorded-byte cache mode
        id: recorded-mode
        env:
          CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          # A restored entry is replayed. A test absent from this job's archive compiles
          # with kotlinc instead of failing. Master publishes the archive, including that
          # new recording, under this commit. A pull request does not write it.
          record=0
          compile_missing=1
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "compile_missing=$compile_missing" >> "$GITHUB_OUTPUT"
      # The native runtime's thread drivers run on every supported architecture: built for each
      # with clang and lld, and run under QEMU's user-mode emulators (tests/native_runtime_e2e.rs).
      - name: install cross-architecture runners
        # The POSIX drivers compile against each target's own glibc headers, so the layer's
        # hand-copied numbers and layouts are checked against the target's, not the host's.
        # Self-hosted runners ship these preinstalled and have no sudo.
        run: |
          if [ -x /usr/bin/qemu-aarch64 ] && [ -x /usr/bin/qemu-riscv64 ] && [ -x /usr/bin/ld.lld ] &&
            [ -d /usr/aarch64-linux-gnu/include ] && [ -d /usr/riscv64-linux-gnu/include ]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y qemu-user lld libc6-dev-arm64-cross libc6-dev-riscv64-cross
      - name: coverage gate
        id: coverage
        env:
          # The e2e suite is one process. An instrumented run is about seventeen minutes; thirty
          # minutes leaves room for a slow runner and still fails a hung binary.
          KRUSTY_COVERAGE_E2E_TIMEOUT_SECONDS: 1800
          # A change to what krusty-toolchain's oracle entries hold re-runs every Kotlin Toolchain
          # case live (a pull request restores, but never saves, the oracle cache), which takes
          # compile_cases past the ordinary 120 seconds.
          KRUSTY_COVERAGE_TEST_TIMEOUT_SECONDS: 600
          KRUSTY_BUILD_TOOLS_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          # rust-cache prunes target before archiving it. A Gradle Kotlin-DSL workspace restored
          # from there can therefore lack metadata.bin, which Gradle 8 cannot regenerate.
          KRUSTY_BUILD_TOOLS_GRADLE_USER_HOME: ${{ runner.temp }}/krusty-build-tools-gradle-user-home
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          # This job's archive only. The conformance job publishes a separate one.
          KRUSTY_RECORD_CLASS_DUMPS: ${{ steps.recorded-mode.outputs.record }}
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
          KRUSTY_TOOLCHAIN_RUN_MISSING: 1
        run: just coverage-gate
      - name: save recorded kotlinc bytes
        if: steps.recorded-mode.outputs.write == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-${{ github.sha }}
      - name: save Kotlin Toolchain oracle output
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.toolchain-oracle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-toolchain-oracle
          key: kotlin-toolchain-oracle-${{ github.sha }}
      # Reuse coverage's exact compiler e2e executable for its ignored plugin/KSP controls.
      # This pass runs after the coverage report and does not change its measured workload.
      - *plugin-host-runtime-cache
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - name: compiler plugin integration tests
        env:
          E2E_BINARY: ${{ steps.coverage.outputs.compiler_e2e_binary }}
          RUST_MIN_STACK: "134217728"
          LLVM_PROFILE_FILE: ${{ runner.temp }}/plugin-host-compiler-%p-%m.profraw
        run: |
          set -euo pipefail
          source scripts/test-gate-defaults.sh
          source scripts/test-deadline.sh
          test -n "$E2E_BINARY" && test -x "$E2E_BINARY"
          ignored_tests="$("$E2E_BINARY" plugin_host_compiler_e2e:: --ignored --list --format=terse)"
          printf '%s\n' "$ignored_tests"
          grep -q ': test$' <<< "$ignored_tests"
          echo "plugin host compiler tests: $E2E_BINARY plugin_host_compiler_e2e:: --include-ignored --test-threads=1 (timeout=${KRUSTY_E2E_TIMEOUT_SECONDS}s)"
          run_with_deadline "$KRUSTY_E2E_TIMEOUT_SECONDS" "$E2E_BINARY" plugin_host_compiler_e2e:: --include-ignored --test-threads=1

  # Each artifact family has one producer. They run on separate hosted runners so the conformance
  # matrix waits for the slowest required build instead of serializing every unrelated target graph
  # on one runner. Consumers never compile krusty again.
  build-conformance-bin:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Self-hosted runners have no JDK on PATH (ubuntu-latest defaults to 17); the justfile runs
      # `java -version`.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - *just-on-path
      - *install-just
      - name: build conformance binary
        run: |
          set -euo pipefail
          source scripts/phase-timing.sh
          phase_log_prefix=conformance-bin
          PHASE_TIMING_LOG="$(mktemp)"
          trap 'phase_report || true' EXIT
          phase_begin conformance-test-binary
          bin=$(just conformance-bin)
          phase_end conformance-test-binary
          cp "$bin" conformance-bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-bin
          path: conformance-bin
          if-no-files-found: error

  build-klib-test-bins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Self-hosted runners have no JDK on PATH (ubuntu-latest defaults to 17); the justfile runs
      # `java -version`.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - name: build focused KLIB test binaries
        run: |
          set -euo pipefail
          source scripts/phase-timing.sh
          phase_log_prefix=klib-test-bins
          PHASE_TIMING_LOG="$(mktemp)"
          trap 'phase_report || true' EXIT
          phase_begin focused-klib-test-binaries
          scripts/build-klib-test-binaries.sh "$PWD"
          phase_end focused-klib-test-binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klib-test-bins
          path: |
            klib-e2e-tests
            klib-unit-tests
          if-no-files-found: error

  build-tool-bins:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    outputs:
      # Every consumer already waits for this artifact family. Publish the manifest-derived matrix
      # here instead of scheduling a separate ten-second runner solely for these two values.
      matrix: ${{ steps.versions.outputs.matrix }}
      max: ${{ steps.versions.outputs.max }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Self-hosted runners have no JDK on PATH (ubuntu-latest defaults to 17); the justfile runs
      # `java -version`.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - *just-on-path
      - *install-just
      - name: select supported Kotlin versions
        id: versions
        run: |
          echo "matrix=$(just matrix-json)" >> "$GITHUB_OUTPUT"
          echo "max=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: build compiler and Gradle test binaries
        run: |
          set -euo pipefail
          source scripts/phase-timing.sh
          phase_log_prefix=tool-bins
          PHASE_TIMING_LOG="$(mktemp)"
          trap 'phase_report || true' EXIT
          phase_begin krusty-cli
          cargo build --profile gate -p krusty-cli
          phase_end krusty-cli
          cp target/gate/krusty krusty
          phase_begin krusty-build-tests
          bin=$(just krusty-build-tests)
          phase_end krusty-build-tests
          cp "$bin" krusty-build-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-bins
          path: |
            krusty
            krusty-build-tests
          if-no-files-found: error

  conformance:
    name: conformance (${{ matrix.version }}, ${{ matrix.target }})
    # JVM consumes no focused KLIB test binary, so keep it off that producer's critical path. Native
    # and Wasm both enforce KLIB implementation coverage below and therefore wait for the artifact.
    needs: [build-conformance-bin, build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
        target: [jvm]
    # Cold reflective box() calls share one deadline. Hosted runners and forks keep 2s. The 8 GB
    # pool missed it once: functions/functionNtoString.kt on Kotlin 2.4.0, while the same source
    # passed for 2.4.10, 2.4.20, and 2.4.21. Give that pool 8s. The client round-trip wait stays
    # 8s above the JVM deadline.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    env:
      KRUSTY_BOX_CASE_TIMEOUT_MS: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '2000' || '8000' }}
    steps: &conformance-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *just-on-path
      - *install-just
      # Kotlin's CLI corpus names JDK 8, 11, 17 and 21 homes; kotlin_cli_jvm_conformance finds them
      # through the JAVA_HOME_<release>_X64 variables this exports and fails a case it cannot run.
      # The last version listed stays JAVA_HOME.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: |
            8
            11
            17
            21
            25
      - name: cache kotlin toolchain and conformance corpora (${{ matrix.version }})
        if: matrix.target == 'jvm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/kotlinc/${{ matrix.version }}
            target/cache/ser-corpus/${{ matrix.version }}
            target/cache/ksp-toolchain
            target/cache/krusty-deps
          # Do not reuse the former box-only immutable cache: it can never acquire the newly
          # required serialization/KSP inputs.
          key: kotlin-conformance-all-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      - name: cache Kotlin compiler for ${{ matrix.target }} conformance (${{ matrix.version }})
        if: matrix.target != 'jvm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ matrix.version }}
          # Do not let a Native or Wasm row publish the JVM row's broader immutable cache before its
          # serialization/KSP inputs exist. Every key still identifies one exact compiler version.
          key: kotlin-${{ matrix.target }}-conformance-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      - name: cache Wasm target KLIB dependencies (${{ matrix.version }})
        if: startsWith(matrix.target, 'wasm-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: wasm-target-klibs-v1-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      # Native cases are analyzed against this version's Kotlin/Native stdlib KLIB.
      # `scripts/kotlin-native.sh` re-downloads a restored root whose stdlib payload is incomplete.
      - name: cache Kotlin/Native distribution (${{ matrix.version }})
        if: matrix.target == 'native'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ matrix.version }}
          key: kotlin-native-conformance-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      # Every Native row compiles kotlinc-native KLIB references for its box byte score; the
      # maximum-version row also runs the focused kotlinc-native oracle checks.
      - name: cache Kotlin/Native dependencies
        if: matrix.target == 'native'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan/dependencies
            target/cache/krusty-deps
          key: native-conformance-konan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      - name: restore recorded kotlinc-native bytes
        if: matrix.target == 'native' && matrix.version == needs.build-tool-bins.outputs.max
        id: native-recordings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/native-recordings
          key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            recorded-kotlinc-native-bytes-${{ matrix.version }}-
      - name: select kotlinc-native recording mode
        if: matrix.target == 'native' && matrix.version == needs.build-tool-bins.outputs.max
        id: native-recording-mode
        env:
          CACHE_HIT: ${{ steps.native-recordings.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"
      # kotlinc's KLIB bytes for each box case, keyed like the JVM recordings: restored from the
      # base, completed live for a missing entry, and saved only by a master push.
      - name: restore KLIB box reference bytes
        if: matrix.target != 'jvm'
        id: klib-recordings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/klib-references
          key: box-klib-references-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            box-klib-references-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-
      - name: cache box corpus (${{ matrix.version }})
        id: box-corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus/${{ matrix.version }}
          # The checkout carries the box corpus, the mock JDK its tests compile against, and the CLI
          # corpus. A key hit is never re-saved, so the salt changes whenever those inputs do.
          key: box-and-cli-corpus-v1-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      # A hit must already hold every corpus input: provisioning then refuses to fetch.
      - name: forbid corpus fetches after a cache hit (${{ matrix.version }})
        if: steps.box-corpus.outputs.cache-hit == 'true'
        run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
      # One archive per Kotlin version. A restored entry is replayed; a missing test compiles with
      # that lane's kotlinc. Master saves newly observed recordings under the exact version/commit.
      - name: restore recorded kotlinc bytes (${{ matrix.version }})
        if: matrix.target == 'jvm'
        id: recorded-bytes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-conformance-${{ matrix.version }}-
      - name: select recorded-byte cache mode
        if: matrix.target == 'jvm'
        id: recorded-mode
        env:
          CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          compile_missing=1
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "compile_missing=$compile_missing" >> "$GITHUB_OUTPUT"
      # The byte score compiles every applicable box case with that version's kotlinc. Those
      # inventories live in their own cache, target/cache/ref-classes, whose entries
      # tests/box_reference_classes.rs keys by source, classpath, unit modes, the exact compiler and
      # the producing JDK. Restored from the base and saved by master like the recorded bytes; the
      # key also hashes the inventory owner, shared case planning, reference server/Javac driver and
      # content-identity implementation. A producer or layout change therefore starts a fresh cache
      # instead of replaying inventories built by code that a hit would otherwise never execute.
      # Owned Native/Wasm cases require these same JVM oracle inventories.
      - name: restore kotlinc box references (${{ matrix.version }})
        id: box-references
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/ref-classes
          key: box-reference-classes-${{ matrix.version }}-${{ hashFiles('tests/box_reference_classes.rs', 'tests/common/kotlinc_server.rs', 'tests/common/server_pool.rs', 'tests/common/mod.rs', 'tests/common/producing_jdk.rs', 'tests/common/byte_dump.rs', 'tests/common/byte_dump/**', 'src/conformance.rs', 'src/conformance/**') }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            box-reference-classes-${{ matrix.version }}-${{ hashFiles('tests/box_reference_classes.rs', 'tests/common/kotlinc_server.rs', 'tests/common/server_pool.rs', 'tests/common/mod.rs', 'tests/common/producing_jdk.rs', 'tests/common/byte_dump.rs', 'tests/common/byte_dump/**', 'src/conformance.rs', 'src/conformance/**') }}-
      - name: download conformance binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-bin
      - name: download compiler binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - name: download focused KLIB test binaries
        if: matrix.target != 'jvm'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: klib-test-bins
      # One box run writes both reports over the same applicable cases: pct.txt is the case report
      # "<pct> <passed> <applicable>" and jvm-byte-equality.txt the JVM byte report
      # "<pct> <matched> <total>" (.class bytes). Printing their badge fields validates each and
      # previews, without publishing, what the master release would show.
      - name: run box conformance ${{ matrix.version }}
        if: matrix.target == 'jvm'
        env:
          # A cold lane compiles every missing kotlinc reference before it can publish the cache.
          # Keep the 120-second local default; give GHA enough time to bootstrap an empty cache.
          KRUSTY_CONFORMANCE_TIMEOUT_SECONDS: "1800"
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
        run: |
          set -euo pipefail
          chmod +x conformance-bin krusty
          just conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" jvm-byte-equality.txt > pct.txt
          bash scripts/conformance-badge.sh fields conformance pct.txt "${{ matrix.version }}"
          bash scripts/conformance-badge.sh fields jvm-byte-equality jvm-byte-equality.txt "${{ matrix.version }}"
      - name: save kotlinc box references (${{ matrix.version }})
        if: matrix.target == 'jvm' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.box-references.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/ref-classes
          key: box-reference-classes-${{ matrix.version }}-${{ hashFiles('tests/box_reference_classes.rs', 'tests/common/kotlinc_server.rs', 'tests/common/server_pool.rs', 'tests/common/mod.rs', 'tests/common/producing_jdk.rs', 'tests/common/byte_dump.rs', 'tests/common/byte_dump/**', 'src/conformance.rs', 'src/conformance/**') }}-${{ github.sha }}
      - name: run native box conformance ${{ matrix.version }}
        if: matrix.target == 'native'
        id: native_box
        continue-on-error: true
        # Complete migration runs exceeded the former 600-second corpus budget. Keep ordinary
        # and focused deadlines unchanged; a corpus timeout still fails this row.
        env:
          KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: "1800"
          KRUSTY_NATIVE_BYTE_REPORT: ${{ github.workspace }}/native-byte-equality.txt
          KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true' && '1' || '0' }}
        run: |
          chmod +x conformance-bin
          just native-conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" native-pct.txt
          bash scripts/conformance-badge.sh fields native-conformance native-pct.txt "${{ matrix.version }}"
      - name: run focused Native conformance ${{ matrix.version }}
        # Keep focused target regressions independent of a recorded corpus failure. They share the
        # exact Native distribution/KLIB setup, but not the corpus process or its ratchet.
        if: matrix.target == 'native' && (success() || steps.native_box.outcome == 'failure')
        id: native_focused
        continue-on-error: true
        run: just native-conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      - name: upload Native conformance
        if: always() && matrix.target == 'native'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pct-${{ matrix.version }}
          path: native-pct.txt
          if-no-files-found: error
      - name: run focused KLIB semantics and Native oracle coverage
        # The corpus step records its failure and enforcement follows this step, so the focused
        # decoder/oracle coverage remains independent just as it was in its former standalone job.
        if: matrix.target == 'native' && matrix.version == needs.build-tool-bins.outputs.max && (success() || steps.native_box.outcome == 'failure' || steps.native_focused.outcome == 'failure')
        env:
          KRUSTY_TEST_TIMEOUT_SECONDS: "600"
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/native-recordings
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.native-recording-mode.outputs.write }}
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_REQUIRE_KLIB: "1"
          KRUSTY_REQUIRE_KLIB_IMPLEMENTATION_TARGETS: native
          KRUSTY_REQUIRE_KOTLIN_NATIVE: "1"
          RUST_MIN_STACK: "134217728"
        run: |
          set -euo pipefail
          chmod +x klib-e2e-tests klib-unit-tests
          root=$(just kotlin-native "${{ matrix.version }}")
          kotlinc=$(just kotlinc "${{ matrix.version }}")
          export KRUSTY_KOTLIN_NATIVE="$root"
          export KRUSTY_KOTLINC="$kotlinc"
          timeout 600s ./klib-e2e-tests klib_ --nocapture
          timeout 600s ./klib-e2e-tests value_class_declaration_e2e --nocapture
          timeout 600s ./klib-e2e-tests \
            native_value_classes_e2e::a_value_class_needs_no_jvm_inline_on_native --nocapture
          timeout 600s ./klib-unit-tests klib_ --nocapture
      - name: save recorded kotlinc-native bytes
        if: matrix.target == 'native' && matrix.version == needs.build-tool-bins.outputs.max && steps.native-recording-mode.outputs.write == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/native-recordings
          key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ github.sha }}
      - name: enforce native box conformance ${{ matrix.version }}
        if: matrix.target == 'native' && steps.native_box.outcome == 'failure'
        run: exit 1
      - name: enforce focused Native conformance ${{ matrix.version }}
        if: matrix.target == 'native' && steps.native_focused.outcome == 'failure'
        run: exit 1
      # Both Wasm lanes run every accepted case under Node.js, which runs WasmGC without flags from
      # version 22. Each lane's ratchet fails the step on a regression or an unrecorded pass. Each
      # lane analyzes against its exact wasm-js or wasm-wasi stdlib KLIB before target
      # emission. They remain separate because Kotlin publishes different platform surfaces.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: startsWith(matrix.target, 'wasm-')
        with:
          node-version: '22'
      - name: run wasm box conformance ${{ matrix.version }}
        if: startsWith(matrix.target, 'wasm-')
        # Each case now also compiles kotlinc's KLIB reference, so the corpus step gets the same
        # budget the Native corpus step has.
        env:
          KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: "1800"
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_WASM_JS_BYTE_REPORT: ${{ github.workspace }}/wasm-js-byte-equality.txt
          KRUSTY_WASM_WASI_BYTE_REPORT: ${{ github.workspace }}/wasm-wasi-byte-equality.txt
          KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x conformance-bin
          just wasm-conformance-run "${{ matrix.target }}" "$PWD/conformance-bin" "${{ matrix.version }}"
      # Focused Wasm checks exercise both targets; run that complete inventory once per version.
      - name: run focused Wasm conformance ${{ matrix.version }}
        if: matrix.target == 'wasm-js'
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: just wasm-conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      - name: enforce exact KLIB implementation coverage ${{ matrix.version }}
        # The maximum Native row already runs every focused KLIB unit test above. The remaining
        # Native rows and every Wasm row run this one provider-owned ratchet against their exact
        # selected stdlib, so no version or target can hide a newly bodyless declaration.
        if: startsWith(matrix.target, 'wasm-') || (matrix.target == 'native' && matrix.version != needs.build-tool-bins.outputs.max)
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_REQUIRE_KLIB: "1"
          KRUSTY_REQUIRE_KLIB_IMPLEMENTATION_TARGETS: ${{ matrix.target }}
          KRUSTY_TEST_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          chmod +x klib-unit-tests
          export KRUSTY_LANGUAGE_VERSION="${{ matrix.version }}"
          if [ "${{ matrix.target }}" = native ]; then
            export KRUSTY_KOTLIN_NATIVE="$(just kotlin-native "${{ matrix.version }}")"
          else
            export KRUSTY_KOTLINC="$(just kotlinc "${{ matrix.version }}")"
          fi
          timeout 600s ./klib-unit-tests \
            klib_libraries::tests::implementation_coverage:: --nocapture
      - name: save KLIB box reference bytes
        if: always() && matrix.target != 'jvm' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/klib-references
          key: box-klib-references-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ github.sha }}
      - name: upload KLIB byte equality
        if: always() && matrix.target != 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klib-byte-equality-${{ matrix.version }}-${{ matrix.target }}
          path: '*-byte-equality.txt'
          if-no-files-found: error
      - name: run non-box conformance ${{ matrix.version }}
        if: matrix.target == 'jvm'
        env:
          # Required serialization/reference CLI toolchains can be cold. Keep the local
          # 120-second default; this complete CI pass includes their provisioning and compilation.
          KRUSTY_CONFORMANCE_TIMEOUT_SECONDS: "600"
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_RECORD_CLASS_DUMPS: "0"
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_REQUIRE_SERIALIZATION_CONFORMANCE: "1"
        run: just conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      - name: save recorded kotlinc bytes (${{ matrix.version }})
        if: matrix.target == 'jvm' && steps.recorded-mode.outputs.write == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ github.sha }}
      - name: upload pct
        if: always() && matrix.target == 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pct-${{ matrix.version }}
          path: pct.txt
          if-no-files-found: error
      - name: upload JVM byte equality
        if: always() && matrix.target == 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-byte-equality-${{ matrix.version }}
          path: jvm-byte-equality.txt
          if-no-files-found: error

  # GitHub resolves `needs` before expanding a matrix, so the Native and Wasm focused-test producer
  # dependency requires a second scheduler job. Both jobs execute the one anchored conformance step
  # inventory; this is not a separate semantic suite or target-specific case list.
  conformance-klib:
    name: conformance (${{ matrix.version }}, ${{ matrix.target }})
    needs: [build-conformance-bin, build-klib-test-bins, build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
        target: [native, wasm-js, wasm-wasi]
    # Native retains its prior hosted capacity. Wasm uses the guarded self-hosted pool.
    # Separate target rows preserve independent measurements.
    runs-on: ${{ (matrix.target == 'native' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps: *conformance-steps

  # The one check a ruleset requires: its context does not change with either matrix. A required
  # check that is skipped counts as passing, so this job is always scheduled and fails itself unless
  # core CI, the complete conformance matrix (including KLIB semantics), the plugin build, and the
  # complete Gradle matrix succeeded. A failed shared build or version inventory skips a consumer,
  # which fails this aggregate too.
  ci-and-conformance:
    name: ci-and-conformance
    needs: [ci, lint, plugin-host, conformance, conformance-klib, build-gradle-plugin, gradle, maven, build-tools, bazel]
    if: always()
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "helper-1c-1gb"]') }}
    steps:
      - name: require every merge gate to succeed
        env:
          CI_RESULT: ${{ needs.ci.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PLUGIN_HOST_RESULT: ${{ needs.plugin-host.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          KLIB_CONFORMANCE_RESULT: ${{ needs.conformance-klib.result }}
          GRADLE_PLUGIN_RESULT: ${{ needs.build-gradle-plugin.result }}
          GRADLE_RESULT: ${{ needs.gradle.result }}
          MAVEN_RESULT: ${{ needs.maven.result }}
          BUILD_TOOLS_RESULT: ${{ needs.build-tools.result }}
          BAZEL_RESULT: ${{ needs.bazel.result }}
        run: |
          echo "ci: $CI_RESULT"
          echo "lint: $LINT_RESULT"
          echo "plugin-host: $PLUGIN_HOST_RESULT"
          echo "conformance: $CONFORMANCE_RESULT"
          echo "KLIB conformance: $KLIB_CONFORMANCE_RESULT"
          echo "build-gradle-plugin: $GRADLE_PLUGIN_RESULT"
          echo "gradle: $GRADLE_RESULT"
          echo "maven: $MAVEN_RESULT"
          echo "build-tools: $BUILD_TOOLS_RESULT"
          echo "bazel: $BAZEL_RESULT"
          if [ "$CI_RESULT" != success ] \
            || [ "$LINT_RESULT" != success ] \
            || [ "$PLUGIN_HOST_RESULT" != success ] \
            || [ "$CONFORMANCE_RESULT" != success ] \
            || [ "$KLIB_CONFORMANCE_RESULT" != success ] \
            || [ "$GRADLE_PLUGIN_RESULT" != success ] \
            || [ "$GRADLE_RESULT" != success ] \
            || [ "$MAVEN_RESULT" != success ] \
            || [ "$BUILD_TOOLS_RESULT" != success ] \
            || [ "$BAZEL_RESULT" != success ]; then
            echo "lint, plugin host tests, coverage, conformance (including KLIB semantics), every Gradle gate, the Maven goal, every build-tools lane, and every Bazel lane must succeed" >&2
            exit 1
          fi

  # Build the release bytes once. The compatibility matrix below consumes this Maven repository;
  # it never rebuilds the plugin from the checkout.
  build-gradle-plugin:
    # GitHub-hosted: a one- or two-minute producer that the gradle matrix waits for; in the
    # self-hosted queue it waited hours (2026-11-04), holding the whole run open.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: build portable local-Maven distribution
        run: |
          set -euo pipefail
          version=$(just version)
          scripts/package-gradle-plugin.sh "$version" "$PWD/dist-gradle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-gradle-plugin
          path: |
            dist-gradle/*.jar
            dist-gradle/*.zip
            dist-gradle/*-SHA256SUMS
          if-no-files-found: error

  # Build, test and package the Kotlin Build Tools API implementation once per exact supported
  # Kotlin version, driving the shared krusty binary. Release publishes these bytes unchanged.
  build-tools:
    name: build-tools (${{ matrix.kotlin }})
    needs: [build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - name: build, test and package for Kotlin ${{ matrix.kotlin }}
        run: |
          set -euo pipefail
          chmod +x krusty
          scripts/package-build-tools.sh "$(just version)" "${{ matrix.kotlin }}" "$PWD/krusty" "$PWD/dist-build-tools"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-build-tools-kotlin-${{ matrix.kotlin }}
          path: dist-build-tools/*
          if-no-files-found: error

  # Execute the exact release bytes against every supported Kotlin Gradle plugin.
  gradle:
    needs: [build-tool-bins, build-gradle-plugin]
    strategy:
      fail-fast: false
      matrix:
        # Every release in the kotlin-versions manifest runs on the newest validated Gradle; the
        # rows below add the older Gradle boundaries.
        kotlin: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
        gradle: [9.7.0]
        ksp: [true]
        include:
          # KSP's Gradle plugin does not load on Gradle 7.6 (its build-script metadata is newer than
          # Gradle 7.6's embedded Kotlin compiler reads), so the KSP2 test runs on the other lanes.
          - { kotlin: 2.4.0,  gradle: 7.6.3,  ksp: false }
          - { kotlin: 2.4.0,  gradle: 9.5.0,  ksp: true }
          - { kotlin: 2.4.10, gradle: 8.14.3, ksp: true }
          - { kotlin: 2.4.20, gradle: 7.6.3,  ksp: false }
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - name: select Android integration requirements
        id: android
        run: |
          if printf '9.6.0\n%s\n' "${{ matrix.gradle }}" | sort -V -C; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: provision the Android integration SDK
        if: steps.android.outputs.enabled == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # SDK installation and downloader state belong to one matrix job, including reruns.
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/sdk
          ANDROID_HOME: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/sdk
          ANDROID_USER_HOME: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/user
        with:
          packages: 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}
          # The integration harness deliberately uses an isolated user home below. Do not restore
          # an unused ~/.gradle cache; the next step owns the exact home the nested builds consume.
          cache-provider: external
      - name: cache Gradle integration dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/krusty-gradle-user-home/caches
          # Each matrix lane has a different Gradle/KGP/KSP dependency graph. The generated fixture
          # build scripts live in gradle.rs, while the tested plugin build lives under tools/.
          key: gradle-integration-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gradle }}-${{ matrix.kotlin }}-${{ matrix.ksp }}-${{ hashFiles('Cargo.lock', 'crates/krusty-build/src/gradle.rs', 'tools/krusty-gradle/**') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krusty-gradle-plugin
          path: dist-gradle
      - name: verify and unpack the tested Gradle plugin distribution
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist-gradle && sha256sum -c "krusty-gradle-plugin-$version-SHA256SUMS")
          unzip -q "dist-gradle/krusty-gradle-plugin-$version.zip" -d dist-gradle/unpacked
          echo "KRUSTY_GRADLE_PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "KRUSTY_GRADLE_PLUGIN_PROJECT=$PWD/dist-gradle/unpacked/krusty-gradle-plugin-$version" >> "$GITHUB_ENV"
      - name: run Gradle ${{ matrix.gradle }} integration with Kotlin ${{ matrix.kotlin }}
        env:
          # setup-android exports both SDK aliases; retain its isolated user state here too.
          ANDROID_USER_HOME: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/user
          KRUSTY_GRADLE_TEST_BIN: ${{ github.workspace }}/krusty
          KRUSTY_GRADLE_KGP_VERSION: ${{ matrix.kotlin }}
          KRUSTY_GRADLE_VERSION: ${{ matrix.gradle }}
          # Keep Gradle's mutable Kotlin DSL workspace out of the checkout. A later archive of the
          # workspace must not retain a script directory without its metadata.bin.
          KRUSTY_GRADLE_USER_HOME: ${{ runner.temp }}/krusty-gradle-user-home
        run: |
          chmod +x krusty krusty-build-tests
          tests="kotlin_compiler_slice_compiles_through_krusty kotlin_dsl_build_src_compiles_through_krusty"
          tests="$tests serialization_plugin_compiles_through_krusty kapt_project_compiles_through_krusty"
          tests="$tests verify_task_reports_krusty_against_kotlinc verify_task_reports_only_the_current_invocation"
          tests="$tests verify_task_reports_an_unsupported_kotlin_gradle_plugin verify_task_reports_projects_that_each_load_the_plugin"
          tests="$tests verify_task_reports_kotlin_dsl_compiles_after_kotlinc_compiles_them"
          tests="$tests verify_task_reports_a_kotlin_gradle_plugin_older_than_the_plugin_api"
          tests="$tests multiplatform_jvm_compiles_through_krusty"
          tests="$tests oss_corpus_init_script_applies_the_packaged_plugin"
          if [ "${{ matrix.ksp }}" = true ]; then
            tests="$tests ksp2_generated_sources_compile_through_krusty"
          fi
          # The SDK setup uses the same Gradle compatibility decision as the test inventory.
          if [ "${{ steps.android.outputs.enabled }}" = true ]; then
            tests="$tests android_variants_compile_through_krusty"
          fi
          KRUSTY_GRADLE_BIN=$(command -v gradle) \
            ./krusty-build-tests --ignored $tests

  # Build the Maven plugin's release bytes once: a portable local Maven repository the release
  # publishes and the job below consumes.
  build-maven-plugin:
    # GitHub-hosted: a one- or two-minute producer that the maven matrix waits for; in the
    # self-hosted queue it waited hours (2026-11-04), holding the whole run open.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
          cache-dependency-path: tools/krusty-maven/pom.xml
      - uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: '3.9.11'
      - name: build portable local-Maven distribution
        run: |
          set -euo pipefail
          version=$(just version)
          scripts/package-maven-plugin.sh "$version" "$PWD/dist-maven"
      - uses: actions/upload-artifact@v7
        with:
          name: krusty-maven-plugin
          path: |
            dist-maven/*.jar
            dist-maven/*.zip
            dist-maven/*-SHA256SUMS
          if-no-files-found: error

  # Run the Maven plugin's verify goal from the packaged release repository against
  # kotlin-maven-plugin builds, with the shared krusty binary.
  maven:
    needs: [build-tool-bins, build-maven-plugin]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
          cache-dependency-path: tools/krusty-maven/pom.xml
      - uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: '3.9.11'
      - uses: actions/download-artifact@v8
        with:
          name: tool-bins
      - uses: actions/download-artifact@v8
        with:
          name: krusty-maven-plugin
          path: dist-maven
      - name: verify and unpack the tested Maven plugin distribution
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist-maven && sha256sum -c "krusty-maven-plugin-$version-SHA256SUMS")
          unzip -q "dist-maven/krusty-maven-plugin-$version.zip" -d dist-maven/unpacked
          echo "KRUSTY_MAVEN_PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "KRUSTY_MAVEN_PLUGIN_REPOSITORY=$PWD/dist-maven/unpacked/krusty-maven-plugin-$version/repository" >> "$GITHUB_ENV"
      - name: run the Maven verify goal
        env:
          KRUSTY_MAVEN_TEST_BIN: ${{ github.workspace }}/krusty
        run: |
          chmod +x krusty krusty-build-tests
          ./krusty-build-tests --ignored maven_verify_goal_ --test-threads=1

  # Build Kotlin with the Bazel module the release would publish, as a consumer depends on it,
  # with the toolchain's compiler and an override, in action and worker mode.
  bazel:
    needs: [build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        bazel: [8.4.2, 9.3.1]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - *just-on-path
      - *install-just
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      # The smoke test generates the registry with the site's Node.js script; the self-hosted image
      # has no Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # ubuntu-latest has Bazelisk installed as `bazel`; the self-hosted image installs it as
      # `bazelisk`.
      - name: put bazelisk on PATH as bazel
        run: |
          set -euo pipefail
          if ! command -v bazel >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$(command -v bazelisk)" "$RUNNER_TEMP/bin/bazel"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - name: build the packaged Bazel module with Bazel ${{ matrix.bazel }}
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: |
          set -euo pipefail
          chmod +x krusty
          kotlin=$(just max-version)
          curl -fsSLo "$RUNNER_TEMP/kotlin-stdlib.jar" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/$kotlin/kotlin-stdlib-$kotlin.jar"
          scripts/bazel-smoke.sh "$PWD/krusty" "$RUNNER_TEMP/kotlin-stdlib.jar"

  # Every covered master commit builds its own immutable release artifacts, even after master
  # advances. All six platforms can build concurrently on their hosted runners.
  build-release:
    needs: [ci-and-conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { triple: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { triple: aarch64-apple-darwin,      os: macos-15 }
          - { triple: x86_64-apple-darwin,       os: macos-15-intel }
          - { triple: x86_64-pc-windows-msvc,   os: windows-latest }
          - { triple: aarch64-pc-windows-msvc,  os: windows-11-arm }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target.triple }}
      - *just-on-path
      - *install-just
      - name: install aarch64-linux linker
        if: matrix.target.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # build.rs cross-compiles the native runtime for every Linux target, riscv64 included. Apple's
      # clang ships without the RISC-V backend, so macOS builds use Homebrew's LLVM clang instead.
      # The major is pinned, not Homebrew's moving `llvm`: the runner images already ship llvm@18,
      # the clang the Linux runners use too.
      - name: select LLVM clang for the native runtime
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! brew list --versions llvm@18 >/dev/null; then
            brew install llvm@18
          fi
          clang="$(brew --prefix llvm@18)/bin/clang"
          test -x "$clang"
          "$clang" --print-targets | grep -q riscv64
          echo "KRUSTY_RUNTIME_CC=$clang" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        env:
          CARGO_TERM_VERBOSE: 'true'
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          node scripts/release-build-progress.cjs &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true; wait "$progress_pid" 2>/dev/null || true' EXIT
          time just build-release "${{ matrix.target.triple }}"
      - name: upload release build timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-timings-${{ matrix.target.triple }}
          path: target/cargo-timings/
          if-no-files-found: warn
      - name: package compiler
        id: compiler_pkg
        shell: bash
        run: echo "path=$(just package "${{ matrix.target.triple }}")" >> "$GITHUB_OUTPUT"
      - name: package language server
        id: lsp_pkg
        shell: bash
        run: echo "path=$(just package "${{ matrix.target.triple }}" krusty-lsp)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-${{ matrix.target.triple }}
          path: |
            ${{ steps.compiler_pkg.outputs.path }}
            ${{ steps.lsp_pkg.outputs.path }}
          if-no-files-found: error

  release:
    needs: [ci, lint, plugin-host, conformance, conformance-klib, build-gradle-plugin, gradle, build-maven-plugin, maven, build-tools, bazel, build-tool-bins, build-release]
    if: github.ref == 'refs/heads/master'
    # Publication runs Gradle to build and sign Maven Central and Plugin Portal artifacts.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    # Shorter than either lock's TTL; only dead jobs' locks may be taken over.
    timeout-minutes: 25
    permissions:
      contents: write
      # Dispatches the pages workflow, which regenerates the Bazel registry.
      actions: write
      # Sign and store the build provenance attestations of the release files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Every validated master ancestor publishes. Only retries of this exact commit wait on
      # this lock; slow immutable package publication cannot hold the global latest/badge lock.
      - name: take the commit publication lock
        id: lock
        run: |
          set -euo pipefail
          lock=$(scripts/release-publisher.sh acquire)
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: publish this validated master commit
        id: tip
        run: scripts/release-publisher.sh check >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: steps.tip.outputs.publish == 'true'
        with:
          tool: just
      - name: collect all target artifacts
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: krusty-*
          path: dist
          merge-multiple: true
      - name: verify Gradle plugin release assets
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist && sha256sum -c "krusty-gradle-plugin-$version-SHA256SUMS")
      - name: verify Maven plugin release assets
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist && sha256sum -c "krusty-maven-plugin-$version-SHA256SUMS")
      - name: verify Build Tools API implementation release assets
        if: steps.tip.outputs.publish == 'true'
        env:
          KOTLIN_VERSIONS: ${{ needs.build-tool-bins.outputs.matrix }}
        run: |
          set -euo pipefail
          version=$(just version)
          for kotlin in $(jq -r '.[]' <<<"$KOTLIN_VERSIONS"); do
            (cd dist && sha256sum -c "krusty-build-tools-$version-kotlin-$kotlin-SHA256SUMS")
          done
      - name: compute version + tag
        if: steps.tip.outputs.publish == 'true'
        id: v
        run: |
          ver=$(just version)
          echo "ver=$ver"  >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      # The Gradle plugin downloads its release's compiler and checks it against this file, which it
      # trusts only through the signature beside it: by a subkey that the maintainer's root key
      # (bundled in the plugin) binds, published as krusty-<ver>-signing-key.asc.
      - name: checksum the compiler archives
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          ver=${{ steps.v.outputs.ver }}
          (cd dist && sha256sum krusty-"$ver"-*.tar.gz krusty-"$ver"-*.zip > "krusty-$ver-SHA256SUMS")
          test "$(wc -l < "dist/krusty-$ver-SHA256SUMS")" -eq 6
      - name: sign the compiler checksums
        if: steps.tip.outputs.publish == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: scripts/sign-release-checksums.sh "${{ steps.v.outputs.ver }}" dist
      - name: package Zed extension
        if: steps.tip.outputs.publish == 'true'
        shell: bash
        run: just package-zed
      # The Bazel module of this release, naming the SHA-256 of each compiler archive above.
      - name: package Bazel module
        if: steps.tip.outputs.publish == 'true'
        run: scripts/package-bazel-module.sh "${{ steps.v.outputs.ver }}" dist
      # The validated max-version reports travel with each immutable release.
      - name: download max-version pct
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pct-${{ needs.build-tool-bins.outputs.max }}
      - name: download max-version JVM byte equality
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jvm-byte-equality-${{ needs.build-tool-bins.outputs.max }}
      - name: download max-version Native conformance
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-pct-${{ needs.build-tool-bins.outputs.max }}
      - name: package release badge data
        if: steps.tip.outputs.publish == 'true'
        env:
          MAX_VERSION: ${{ needs.build-tool-bins.outputs.max }}
        run: bash scripts/package-release-badges.sh "$MAX_VERSION" . dist
      # SLSA build provenance for every published file, so `gh attestation verify <file> -R qnox/krusty`
      # ties it to this workflow run and commit.
      - name: attest build provenance
        if: steps.tip.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
      # A tag is immutably bound before publication, including retries after a rewritten history.
      # Drafts may resume incomplete uploads; a public release's assets are never replaced.
      - name: publish
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -euo pipefail
          scripts/release-publisher.sh bind-tag "$TAG"
          mapfile -t assets < <(find dist -type f | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            case $draft in
              true)
                gh release upload "$TAG" --clobber "${assets[@]}"
                gh release edit "$TAG" --draft=false --latest=false
                ;;
              false) ;;
              *) echo "cannot determine draft state of $TAG" >&2; exit 1 ;;
            esac
          else
            notes_file="$RUNNER_TEMP/krusty-release-notes.md"
            trap 'rm -f "$notes_file"' EXIT
            gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" |
              python3 scripts/format-release-notes.py > "$notes_file"
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --latest=false \
              --title "krusty $VER: Kotlin compiler written in Rust" --notes-file "$notes_file" "${assets[@]}"
            gh release edit "$TAG" --draft=false --latest=false
          fi
      # Each exact version keeps its existing Maven Central deployment journal. The Plugin Portal
      # also checks its immutable marker before retrying a previously successful upload.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.tip.outputs.publish == 'true'
        with:
          distribution: zulu
          java-version: '17'
      # No setup-gradle here: it injects an init script into every Gradle build, and these builds
      # hold the signing key and publishing credentials. The lint job validates the wrapper jar,
      # whose properties pin the distribution's checksum.
      # The maintainer's krusty signing subkey (`gpg --armor --export-secret-subkeys <id>!`) signs
      # every published artifact. SIGNING_KEY_ID, its 8-hex-digit short id, is optional: without
      # it the id is read from the key itself.
      - name: signing key id
        id: signing
        if: steps.tip.outputs.publish == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEY_ID" ]]; then
            id=$SIGNING_KEY_ID
          elif [[ -n "$SIGNING_KEY" ]]; then
            # A pipe, not a here-string, which an older bash backs with a temporary file.
            id=$(printf '%s\n' "$SIGNING_KEY" | scripts/signing-key-id.sh)
          else
            id=
          fi
          echo "signing key: ${id:-none}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: make the public signing subkey retrievable for Maven Central
        if: steps.tip.outputs.publish == 'true'
        run: scripts/publish-release-signing-key.sh "${{ steps.v.outputs.ver }}" dist
      # Maven Central goes first: it skips a version it already has, so a rerun after a failed
      # Plugin Portal upload does not trip over Central's immutable versions.
      - name: publish the Gradle plugin to Maven Central
        if: steps.tip.outputs.publish == 'true'
        env:
          # A Central Portal user token for the verified dev.krustythecompiler namespace.
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ steps.signing.outputs.id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_CENTRAL_USERNAME" || -z "$MAVEN_CENTRAL_PASSWORD" ]]; then
            echo "MAVEN_CENTRAL_USERNAME/MAVEN_CENTRAL_PASSWORD are not set; skipping Maven Central"
            exit 0
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo "SIGNING_KEY is not set; refusing to publish an unsigned plugin" >&2
            exit 1
          fi
          scripts/publish-maven-central.sh "${{ steps.v.outputs.ver }}"
      - name: publish the Gradle plugin to the Gradle Plugin Portal
        if: steps.tip.outputs.publish == 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ steps.signing.outputs.id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$GRADLE_PUBLISH_KEY" || -z "$GRADLE_PUBLISH_SECRET" ]]; then
            echo "GRADLE_PUBLISH_KEY/GRADLE_PUBLISH_SECRET are not set; skipping the Plugin Portal"
            exit 0
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo "SIGNING_KEY is not set; refusing to publish an unsigned plugin" >&2
            exit 1
          fi
          scripts/publish-gradle-plugin-portal.sh "${{ steps.v.outputs.ver }}"
      # Rebuild the site, whose Bazel registry is generated from the releases, so it lists this one.
      - name: refresh the Bazel registry
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
      # The global lock is held only while promoting latest and the released ref.
      - name: take the latest promotion lock
        if: steps.tip.outputs.publish == 'true'
        id: latest_lock
        run: |
          set -euo pipefail
          lock=$(scripts/release-publisher.sh acquire-latest)
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: select monotonic latest promotion
        if: steps.tip.outputs.publish == 'true'
        id: latest
        run: scripts/release-publisher.sh check-promotion >> "$GITHUB_OUTPUT"
      # Advance the monotonic guard before external updates. If a later update fails, this same
      # SHA may retry; an older publisher can never overwrite it after the lock is released.
      - name: record the promoted commit
        if: steps.latest.outputs.promote == 'true'
        run: scripts/release-publisher.sh record
      - name: promote the GitHub release
        if: steps.latest.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release edit "$TAG" --latest
      - name: drop the latest promotion lock
        if: always() && steps.latest_lock.outputs.lock != ''
        run: scripts/release-publisher.sh release-latest "${{ steps.latest_lock.outputs.lock }}"
      - name: drop the release lock
        if: always() && steps.lock.outputs.lock != ''
        run: scripts/release-publisher.sh release "${{ steps.lock.outputs.lock }}"
