name: 3496 adapter validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-source-layout:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-tool-bins
          save-if: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install just when absent
        shell: bash
        run: |
          if ! command -v just >/dev/null; then
            cargo install just --locked
          fi
      - name: Record source, fixture, runner and tool versions
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="$(just max-version)"
          kotlinc_path="$(just kotlinc "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kotlinc=$kotlinc_path" >> "$GITHUB_OUTPUT"
          echo "KRUSTY_LANGUAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLINC=$kotlinc_path" >> "$GITHUB_ENV"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow_ref=$GITHUB_REF"
            echo "runner=$(uname -a)"
            echo "version=$version"
            echo "kotlinc=$kotlinc_path"
            "$kotlinc_path" -version 2>&1 || true
            java -version 2>&1 || true
            node --version
            cargo --version
            rustc --version --verbose
            git status --short --branch
          } > artifacts/provenance.txt
          sha256sum tests/box_regressions/multimodule/sourceLibraryClassLayout.kt \
            tests/box_regressions/multimodule/sourceLibraryUnboxedFunctionBridge.kt \
            > artifacts/fixture-sha256.txt
      - name: Check Wasm library and test API
        id: wasm_check
        env:
          CARGO_BUILD_JOBS: '1'
        shell: bash
        run: |
          set -o pipefail
          cargo check --profile gate -p krusty-wasm --lib --tests 2>&1 | tee artifacts/wasm-api-check.log
      - name: Build one conformance test binary
        id: conformance_build
        env:
          CARGO_BUILD_JOBS: '1'
        shell: bash
        run: |
          set -euo pipefail
          bin="$(scripts/cargo-test-binary.sh --build conformance -p krusty --test conformance 2> >(tee artifacts/conformance-build.log >&2))"
          echo "$bin" > artifacts/conformance-binary-path.txt
          sha256sum "$bin" > artifacts/conformance-binary-sha256.txt
      - name: Run JVM oracle and Wasm JS and WASI source layout regression
        id: source_layout
        env:
          KRUSTY_LANGUAGE_VERSION: ${{ steps.provenance.outputs.version }}
          KRUSTY_KOTLINC: ${{ steps.provenance.outputs.kotlinc }}
        shell: bash
        run: |
          set +e
          bin="$(cat artifacts/conformance-binary-path.txt)"
          filter=kotlin_box_wasm_conformance::wasm_source_library_superclasses_keep_their_layout_and_dispatch
          "$bin" "$filter" --exact --test-threads 1 --nocapture 2>&1 | tee artifacts/source-library-class-layout.log
          status=${PIPESTATUS[0]}
          echo "source_library_class_layout_exit=$status" | tee -a artifacts/status.txt
          exit "$status"
      - name: Run JVM oracle and Wasm JS and WASI inherited adapter regression
        id: unboxed_bridge
        if: ${{ always() && steps.conformance_build.outcome == 'success' }}
        env:
          KRUSTY_LANGUAGE_VERSION: ${{ steps.provenance.outputs.version }}
          KRUSTY_KOTLINC: ${{ steps.provenance.outputs.kotlinc }}
        shell: bash
        run: |
          set +e
          bin="$(cat artifacts/conformance-binary-path.txt)"
          filter=kotlin_box_wasm_conformance::wasm_source_library_inherits_unboxed_function_parameter_adapters
          "$bin" "$filter" --exact --test-threads 1 --nocapture 2>&1 | tee artifacts/source-library-unboxed-function-bridge.log
          status=${PIPESTATUS[0]}
          echo "source_library_unboxed_function_bridge_exit=$status" | tee -a artifacts/status.txt
          exit "$status"
      - name: Capture artifacts and test counts
        if: always()
        shell: bash
        run: |
          set +e
          for log in artifacts/source-library-class-layout.log artifacts/source-library-unboxed-function-bridge.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---" >> artifacts/test-summary.txt
              grep -E 'test result:|running [0-9]+ tests?|test .* \.\.\.' "$log" >> artifacts/test-summary.txt
              echo "grep_exit=$?" >> artifacts/test-summary.txt
            fi
          done
          sha256sum artifacts/* > artifacts/artifact-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: 3496-wasm-source-layout-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
