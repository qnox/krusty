name: unsigned array full outcome evidence
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-tool-bins:
    runs-on:
    - self-hosted
    - rust-4c-8gb
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: verify exact implementation source
      run: |
        set -euo pipefail
        git diff --exit-code f72862af779d355f651a69799e3d2ccb1a3a82a5 HEAD -- . ':!.github/workflows/ci.yml'
        printf '%s\n' 'f72862af779d355f651a69799e3d2ccb1a3a82a5' > implementation-source.txt
        git rev-parse HEAD > runner-source.txt
        sha256sum tests/box_regressions/unsignedArrayViews.kt > fixture.sha256
        uname -a > build-platform.txt
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: zulu
        java-version: '17'
    - id: just-on-path
      name: look for an installed just
      shell: bash
      run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.just-on-path.outputs.found != 'true'
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
      with:
        tool: just
    - name: build exact conformance and compiler binaries
      run: |
        set -euo pipefail
        bin=$(just conformance-bin-and-cli 2> >(tee compiler-build.log >&2))
        cp "$bin" conformance-bin
        sha256sum conformance-bin > conformance-bin.sha256
    - name: upload exact conformance binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: conformance-bin
        path: conformance-bin
        if-no-files-found: error
    - name: upload compiler source provenance
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: compiler-build-provenance
        path: |-
          implementation-source.txt
          runner-source.txt
          fixture.sha256
          conformance-bin.sha256
          build-platform.txt
          compiler-build.log
        if-no-files-found: error
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
  conformance:
    name: conformance (${{ matrix.version }}, ${{ matrix.target }})
    needs: build-tool-bins
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version:
        - 2.4.0
        - 2.4.10
        - 2.4.20
        - 2.4.21
        target:
        - native
        - wasm-js
        - wasm-wasi
    runs-on:
    - self-hosted
    - rust-4c-8gb
    env:
      KRUSTY_BOX_CASE_TIMEOUT_MS: '8000'
      BOX_REFERENCES: box-reference-classes-${{ matrix.target != 'jvm' && format('{0}-', matrix.target) || '' }}${{ matrix.version
        }}
      KRUSTY_TEST_THREADS: '4'
      KRUSTY_DEPS_DEADLINE_SECONDS: '3600'
      KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: base commit
      id: base
      run: |
        base=$(git log -1 --format='%(trailers:key=Merge-Queue-Base,valueonly)' HEAD | head -n 1)
        echo "sha=${base:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
    - id: just-on-path
      name: look for an installed just
      shell: bash
      run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.just-on-path.outputs.found != 'true'
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
      with:
        tool: just
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: zulu
        java-version: |
          8
          11
          17
          21
          25
    - name: restore kotlinc ${{ matrix.version }}
      id: kotlinc
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlinc/${{ matrix.version }}
        key: kotlinc-${{ matrix.version }}
    - name: restore serialization and KSP conformance inputs (${{ matrix.version }})
      id: conformance-inputs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          target/cache/ser-corpus/${{ matrix.version }}
          target/cache/ksp-toolchain
          target/cache/krusty-deps
        key: kotlin-conformance-inputs-${{ matrix.version }}
    - name: restore Wasm target KLIB dependencies (${{ matrix.version }})
      if: startsWith(matrix.target, 'wasm-')
      id: wasm-klibs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/krusty-deps
        key: wasm-target-klibs-v1-${{ matrix.target }}-${{ matrix.version }}
    - name: restore Kotlin/Native ${{ matrix.version }}
      if: matrix.target == 'native'
      id: kotlin-native
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlin-native/${{ matrix.version }}
        key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}
    - name: restore recorded kotlinc-native bytes
      if: matrix.target == 'native'
      id: native-recordings
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/native-recordings
        key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ steps.base.outputs.sha }}
        restore-keys: |
          recorded-kotlinc-native-bytes-${{ matrix.version }}-
    - name: select kotlinc-native recording mode
      if: matrix.target == 'native'
      id: native-recording-mode
      env:
        CACHE_HIT: ${{ steps.native-recordings.outputs.cache-hit }}
        MASTER_PUSH: ${{ github.ref == 'refs/heads/master' }}
      run: |
        set -euo pipefail
        write=0
        if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
          write=1
        fi
        echo "write=$write" >> "$GITHUB_OUTPUT"
    - name: restore KLIB box reference bytes
      if: matrix.target != 'jvm'
      id: klib-recordings
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/klib-references
        key: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch
          }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ steps.base.outputs.sha }}
        restore-keys: |
          box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-
    - name: list restored KLIB box reference bytes
      if: matrix.target != 'jvm'
      id: klib-recordings-restored
      run: echo "entries=$(scripts/cache-entries.sh target/cache/klib-references)" >> "$GITHUB_OUTPUT"
    - name: restore box corpus (${{ matrix.version }})
      id: box-corpus
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/box-corpus/${{ matrix.version }}
        key: box-cli-and-generator-corpus-v3-${{ matrix.version }}-${{ hashFiles('kotlin-versions', 'scripts/box_selection.py',
          'tests/box_selection_sources.txt') }}
    - name: forbid corpus fetches after a cache hit (${{ matrix.version }})
      if: steps.box-corpus.outputs.cache-hit == 'true'
      run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
    - name: restore kotlinc box references (${{ matrix.version }})
      id: box-references
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/ref-classes
        key: ${{ env.BOX_REFERENCES }}-${{ steps.base.outputs.sha }}
        restore-keys: |
          ${{ env.BOX_REFERENCES }}-
          box-reference-classes-${{ matrix.version }}-
    - name: download conformance binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: conformance-bin
    - name: download exact compiler provenance
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: compiler-build-provenance
    - name: verify exact source and compiler artifact
      run: |
        set -euo pipefail
        test "$(cat implementation-source.txt)" = 'f72862af779d355f651a69799e3d2ccb1a3a82a5'
        test "$(cat runner-source.txt)" = "$GITHUB_SHA"
        git diff --exit-code f72862af779d355f651a69799e3d2ccb1a3a82a5 HEAD -- . ':!.github/workflows/ci.yml'
        sha256sum -c conformance-bin.sha256
        sha256sum -c fixture.sha256
        chmod +x conformance-bin
    - name: provision exact reference atomicfu inputs
      env:
        VERSION: ${{ matrix.version }}
      run: |
        set -euo pipefail
        mkdir -p "$KRUSTY_DEPS_CACHE"
        for spec in "org/jetbrains/kotlin kotlin-atomicfu-compiler-plugin-embeddable $VERSION" "org/jetbrains/kotlinx atomicfu-jvm 0.32.1"; do
          read -r group artifact version <<< "$spec"
          destination="$KRUSTY_DEPS_CACHE/$artifact-$version.jar"
          if [ ! -s "$destination" ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 10 --max-time 180 "https://repo1.maven.org/maven2/$group/$artifact/$version/$artifact-$version.jar" --output "$destination.pending"
            mv "$destination.pending" "$destination"
          fi
          jar tf "$destination" >/dev/null
        done
    - name: run native box conformance ${{ matrix.version }}
      if: matrix.target == 'native'
      id: native_box
      continue-on-error: true
      env:
        KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: '1800'
        KRUSTY_NATIVE_BYTE_REPORT: ${{ github.workspace }}/native-byte-equality.txt
        KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/native-recordings
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: '1'
        KRUSTY_CLASS_DUMP_WRITE: ${{ steps.native-recording-mode.outputs.write }}
      run: |
        set +e
        (
        chmod +x conformance-bin
        just native-conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" native-pct.txt
        lane_status=$?
        bash scripts/conformance-badge.sh fields native-conformance native-pct.txt "${{ matrix.version }}"

        exit "$lane_status"

        ) 2>&1 | tee complete-lane.log
        status=${PIPESTATUS[0]}
        printf "%s\n" "$status" > complete-lane.exit
        exit "$status"
    - name: upload Native conformance
      if: always() && matrix.target == 'native'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-pct-${{ matrix.version }}
        path: native-pct.txt
        if-no-files-found: error
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: startsWith(matrix.target, 'wasm-')
      with:
        node-version: '22'
    - name: run wasm box conformance ${{ matrix.version }}
      if: startsWith(matrix.target, 'wasm-')
      env:
        KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: '1800'
        KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        KRUSTY_WASM_JS_BYTE_REPORT: ${{ github.workspace }}/wasm-js-byte-equality.txt
        KRUSTY_WASM_WASI_BYTE_REPORT: ${{ github.workspace }}/wasm-wasi-byte-equality.txt
        KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/klib-references
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: '1'
        KRUSTY_CLASS_DUMP_WRITE: ${{ github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true'
          && '1' || '0' }}
      run: |
        set +e
        (
        set -euo pipefail
        chmod +x conformance-bin
        just wasm-conformance-run "${{ matrix.target }}" "$PWD/conformance-bin" "${{ matrix.version }}"

        ) 2>&1 | tee complete-lane.log
        status=${PIPESTATUS[0]}
        printf "%s\n" "$status" > complete-lane.exit
        exit "$status"
      continue-on-error: true
      id: wasm_box
    - name: upload KLIB byte equality
      if: always() && matrix.target != 'jvm'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: klib-byte-equality-${{ matrix.version }}-${{ matrix.target }}
        path: '*-byte-equality.txt'
        if-no-files-found: error
    - name: capture every strict outcome and failure ledger
      if: always()
      env:
        TARGET: ${{ matrix.target }}
        VERSION: ${{ matrix.version }}
      run: |
        set -euo pipefail
        python3 - <<'CAPTURE'
        import hashlib,json,os,re,subprocess
        from pathlib import Path
        path=Path('complete-lane.log')
        text=path.read_text(errors='replace') if path.exists() else ''
        exit_path=Path('complete-lane.exit')
        status=int(exit_path.read_text().strip()) if exit_path.exists() else None
        label=os.environ['TARGET']+'-klib'
        summaries=re.findall(re.escape(label)+r' conformance: ([^\n]+)',text)
        counts={}
        if len(summaries)==1:
         for item in summaries[0].split(','):
          found=re.match(r'\s*([a-z-]+) (\d+)',item)
          if found: counts[found[1]]=int(found[2])
        changes=[{'path':p,'expected':old,'actual':new} for p,old,new in re.findall(r'^\s+([^\n]+): expected ([a-z-]+), got ([a-z-]+)\s*$',text,re.M)]
        mismatch_counts=[int(x) for x in re.findall(r'FAILED <[^>]+ box expectations>: (\d+) file\(s\) outcome changed:',text)]
        unexpected=re.findall(r'^\s+unexpected(?: non-pass)? [^\n]*',text,re.M)
        panics=[line for line in text.splitlines() if re.search(r'CompilerPanic|compiler panicked|panicked at',line)]
        complete=len(summaries)==1 and counts.get('scanned',0)>1000
        pure_positive=(complete and counts.get('compiler-panics')==0 and not unexpected and bool(changes) and all(c['expected']=='fail' and c['actual']=='pass' for c in changes) and mismatch_counts==[len(changes)] and counts.get('failed')==1 and status==101)
        clean=complete and counts.get('compiler-panics')==0 and counts.get('failed')==0 and not changes and not unexpected and status==0
        classification='clean' if clean else 'pure-positive' if pure_positive else 'incomplete' if not complete else 'requires-review'
        manifest_root=Path('tests/box_expected_failures')/label
        manifests={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(manifest_root.glob('*.txt'))}
        evidence={'production_source':Path('implementation-source.txt').read_text().strip() if Path('implementation-source.txt').exists() else None,'runner_source':os.environ['GITHUB_SHA'],'target':os.environ['TARGET'],'version':os.environ['VERSION'],'strict_exit':status,'classification':classification,'complete_summary_count':len(summaries),'summaries':summaries,'counts':counts,'changes':changes,'mismatch_counts':mismatch_counts,'unexpected':unexpected,'panic_lines':panics,'manifest_hashes':manifests}
        Path('full-lane-outcomes.json').write_text(json.dumps(evidence,indent=2)+'\n')
        print(json.dumps(evidence,indent=2))
        CAPTURE
        git diff --exit-code -- tests/box_expected_failures tests/box_expected_not_applicable
    - name: upload complete strict lane evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: outcomes-${{ matrix.target }}-${{ matrix.version }}
        path: |-
          full-lane-outcomes.json
          complete-lane.log
          complete-lane.exit
          *-pct.txt
          *-byte-equality.txt
          implementation-source.txt
          runner-source.txt
          fixture.sha256
          conformance-bin.sha256
        if-no-files-found: error
    - name: enforce the original strict survey exit
      if: always()
      run: |
        set -euo pipefail
        test -s complete-lane.exit
        status=$(cat complete-lane.exit)
        exit "$status"
    timeout-minutes: 45
