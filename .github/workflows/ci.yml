name: batch80 native constructor trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-native-regressions:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prepare trace artifact directory
        run: mkdir -p target/batch80-native-trace

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'

      - name: look for an installed just
        id: just-on-path
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: install just
        if: steps.just-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: build one trace-enabled conformance binary and run the exact Native regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/batch80-native-trace
          bin="$(scripts/cargo-test-binary.sh --build conformance -p krusty --features trace --test conformance)"
          cp "$bin" target/batch80-native-trace/conformance-bin
          version=2.4.0
          native="$(just kotlin-native "$version")"
          kotlinc="$(just kotlinc "$version")"
          corpus="$(just box-corpus "$version")"
          {
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'conformance_binary=%s\n' "$bin"
            printf 'kotlin_version=%s\n' "$version"
            printf 'native_root=%s\n' "$native"
            printf 'kotlinc=%s\n' "$kotlinc"
            printf 'box_corpus=%s\n' "$corpus"
          } | tee target/batch80-native-trace/environment.txt

          run_case() {
            local pattern="$1"
            local trace="$2"
            local name="$3"
            local status
            set +e
            KRUSTY_LANGUAGE_VERSION="$version" \
              KRUSTY_KOTLIN_NATIVE="$native" \
              KRUSTY_KOTLINC="$kotlinc" \
              KRUSTY_KOTLIN_BOX_DIR="$corpus" \
              KRUSTY_NATIVE_BOX_ONLY="$pattern" \
              KRUSTY_TRACE="$trace" \
              KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS=1800 \
              just native-conformance-run "$PWD/target/batch80-native-trace/conformance-bin" "$version" \
              >"target/batch80-native-trace/$name.log" 2>&1
            status=$?
            set -e
            printf '%s=%s\n' "$name" "$status" | tee -a target/batch80-native-trace/results.txt
          }

          run_case kt23117.kt lower kt23117
          run_case delegateWithPrivateSet.kt '' delegate_with_private_set
          run_case kt13557.kt '' kt13557
          run_case kt19690.kt '' kt19690
          run_case protectedVarWithPrivateSet.kt '' protected_var_with_private_set
          run_case libraryDelegatesNotNullDispatch.kt lower exact_any_to_string

      - name: upload trace and focused Native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: batch80-native-constructor-trace
          path: target/batch80-native-trace
          if-no-files-found: error
