name: delegate callable-name trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-callable-name:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prepare evidence directory
        run: mkdir -p target/delegate-callable-name-trace

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5

      - name: look for an installed just
        id: just-on-path
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: install just
        if: steps.just-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: build exact trace-enabled conformance binary
        shell: bash
        run: |
          set -euo pipefail
          evidence=target/delegate-callable-name-trace
          version=2.4.0
          bin="$(scripts/cargo-test-binary.sh --build conformance -p krusty --features trace --test conformance 2> >(tee "$evidence/build-stderr.log" >&2))"
          cp "$bin" "$evidence/conformance-bin"
          native="$(just kotlin-native "$version")"
          kotlinc="$(just kotlinc "$version")"
          corpus="$(just box-corpus "$version")"
          fixture=tests/box_regressions/delegatePropertyNameCapability.kt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'source_head=7432b84417865af8441831d07af6af3c3ab8bc63\n'
            printf 'diagnostic_head=%s\n' "$GITHUB_SHA"
            printf 'checked_out_head=%s\n' "$(git rev-parse HEAD)"
            printf 'conformance_binary=%s\n' "$bin"
            printf 'conformance_binary_sha256=%s\n' "$(sha256sum "$bin" | cut -d' ' -f1)"
            printf 'delegate_fixture_sha256=%s\n' "$(sha256sum "$fixture" | cut -d' ' -f1)"
            printf 'kotlin_version=%s\n' "$version"
            printf 'native_root=%s\n' "$native"
            printf 'kotlinc=%s\n' "$kotlinc"
            printf 'box_corpus=%s\n' "$corpus"
          } | tee "$evidence/environment.txt"
          printf '%s\n' "$bin" > "$evidence/binary-path.txt"

          run_case() {
            local test_name="$1" selector="$2" box_only_env="$3" extra_env="$4" log="$5"
            local status
            set +e
            env KRUSTY_LANGUAGE_VERSION="$version" \
              KRUSTY_KOTLINC="$kotlinc" \
              KRUSTY_KOTLIN_BOX_DIR="$corpus" \
              "$box_only_env=$selector" \
              KRUSTY_TRACE=lower \
              $extra_env \
              "$evidence/conformance-bin" "$test_name" --exact --nocapture \
              > "$evidence/$log" 2>&1
            status=$?
            set -e
            printf '%s=%s\n' "$log" "$status" | tee -a "$evidence/status.txt"
            return 0
          }

          run_case kotlin_box_native_conformance::kotlin_codegen_box_native_conformance \
            delegatePropertyNameCapability \
            KRUSTY_NATIVE_BOX_ONLY \
            "KRUSTY_KOTLIN_NATIVE=$native KRUSTY_REQUIRE_NATIVE_CONFORMANCE=1" native-box-lane.log
          run_case kotlin_box_native_conformance::native_runtime_and_library_delegates_receive_dynamic_property_names \
            delegatePropertyNameCapability \
            KRUSTY_NATIVE_BOX_ONLY \
            "KRUSTY_KOTLIN_NATIVE=$native KRUSTY_REQUIRE_NATIVE_CONFORMANCE=1" native-focused-harness.log
          run_case kotlin_box_wasm_conformance::kotlin_codegen_box_wasm_js_conformance \
            delegatePropertyNameCapability \
            KRUSTY_WASM_JS_BOX_ONLY \
            "KRUSTY_REQUIRE_WASM_JS_CONFORMANCE=1" wasm-js.log
          run_case kotlin_box_wasm_conformance::kotlin_codegen_box_wasm_wasi_conformance \
            delegatePropertyNameCapability \
            KRUSTY_WASM_WASI_BOX_ONLY \
            "KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE=1" wasm-wasi.log

      - name: upload exact binary and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delegate-callable-name-trace
          path: target/delegate-callable-name-trace
          if-no-files-found: error
