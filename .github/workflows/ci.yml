name: Kotlin RC reference evidence

# Manual-only generation of release tables and exact compiler/KLIB provenance. This uses the
# repository's self-hosted runner because the release downloads and Maven closure are large.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 120
    env:
      KOTLIN_VERSION: 2.5.0-RC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: "17"
      - uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: "3.9.11"
      - name: Prepare evidence directory and exact-version metadata
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kotlin-rc-evidence/release-tables"
          mkdir -p "$RUNNER_TEMP/kotlin-rc-evidence/klib"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/kotlin-rc-evidence/source-commit.txt"
          printf '%s\n' "$KOTLIN_VERSION" > "$RUNNER_TEMP/kotlin-rc-evidence/requested-version.txt"
      - name: Generate release tables from the exact RC distribution
        run: |
          set -euo pipefail
          # RC is compared with 2.4.21. Remove Beta2 inventories so they cannot be selected as
          # the prior release while generating the RC tables.
          rm -f \
            crates/krusty-cli/src/kotlinc_arguments/releases/2.5.0-Beta2.tsv \
            src/features/releases/2.5.0-Beta2.features.tsv \
            src/features/releases/2.5.0-Beta2.language-versions.tsv \
            src/diag/releases/2.5.0-Beta2.diagnostics.tsv
          dist="$(just kotlinc "$KOTLIN_VERSION")"
          zip="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_VERSION.zip"
          curl -fsSL --connect-timeout 30 --retry 8 --retry-max-time 300 \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -o "$zip"
          sha256sum "$zip" > "$RUNNER_TEMP/kotlin-rc-evidence/kotlinc-distribution.sha256"
          printf '%s\n' "$dist" > "$RUNNER_TEMP/kotlin-rc-evidence/kotlinc-bin.txt"
          just kotlinc-arguments "$KOTLIN_VERSION" 2>&1 | tee "$RUNNER_TEMP/kotlin-rc-evidence/release-tables/generator.log"
          cp "crates/krusty-cli/src/kotlinc_arguments/releases/$KOTLIN_VERSION.tsv" \
            "$RUNNER_TEMP/kotlin-rc-evidence/release-tables/" 2>/dev/null || true
          cp "src/features/releases/$KOTLIN_VERSION.features.tsv" \
            "$RUNNER_TEMP/kotlin-rc-evidence/release-tables/" 2>/dev/null || true
          cp "src/features/releases/$KOTLIN_VERSION.language-versions.tsv" \
            "$RUNNER_TEMP/kotlin-rc-evidence/release-tables/" 2>/dev/null || true
          cp "src/diag/releases/$KOTLIN_VERSION.diagnostics.tsv" \
            "$RUNNER_TEMP/kotlin-rc-evidence/release-tables/" 2>/dev/null || true
          find "$RUNNER_TEMP/kotlin-rc-evidence/release-tables" -type f -printf '%f\n' | sort \
            > "$RUNNER_TEMP/kotlin-rc-evidence/release-tables/files.txt"
      - name: Resolve and hash the exact Maven compiler classpath
        run: |
          set -euo pipefail
          python3 scripts/generate-compiler-pins.py "$KOTLIN_VERSION" \
            "$RUNNER_TEMP/kotlin-rc-evidence/kotlin-compiler.tsv" \
            2>&1 | tee "$RUNNER_TEMP/kotlin-rc-evidence/maven-resolution.log"
      - name: Capture exact Kotlin/Native KLIB version stamp
        run: |
          set -euo pipefail
          root="$(just kotlin-native "$KOTLIN_VERSION" 2>"$RUNNER_TEMP/kotlin-rc-evidence/klib/download.log")"
          stdlib="$root/klib/common/stdlib/default"
          test -s "$stdlib/manifest"
          test -n "$(find "$stdlib/linkdata" -type f -name '*.knm' -size +0 -print -quit)"
          cp "$stdlib/manifest" "$RUNNER_TEMP/kotlin-rc-evidence/klib/stdlib.manifest"
          find "$stdlib/linkdata" -type f -name '*.knm' -size +0 -print0 | sort -z | \
            xargs -0 sha256sum > "$RUNNER_TEMP/kotlin-rc-evidence/klib/stdlib-knm.sha256"
          printf '%s\n' "$root" > "$RUNNER_TEMP/kotlin-rc-evidence/klib/native-root.txt"
          grep -E '^(compiler_version|abi_version|metadata_version|unique_name)=' "$stdlib/manifest" \
            > "$RUNNER_TEMP/kotlin-rc-evidence/klib/version-stamp.txt" || true
      - name: Upload generated tables, pins, and provenance even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-2.5.0-RC-reference-evidence
          path: ${{ runner.temp }}/kotlin-rc-evidence
          if-no-files-found: warn
