name: 3300 delegate property validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3300-delegate-property-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-tool-bins
          save-if: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: find installed just
        id: just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: install just
        if: steps.just.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: authenticate exact product source and owned fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          source_pin=574077d937bc7390ed657db80c331f4a9cc57f2c
          git merge-base --is-ancestor "$source_pin" HEAD
          git diff --exit-code "$source_pin" HEAD -- . ':!.github/workflows/ci.yml'
          printf '%s\n' "$source_pin" > evidence/source-commit.txt
          git rev-parse HEAD > evidence/validation-commit.txt
          sha256sum \
            tests/box_regressions/delegatePropertyNameCapability.kt \
            tests/box_regressions/libraryDelegatesNotNullDispatch.kt \
            tests/box_regressions/libraryObjectMembers.kt \
            tests/box_regressions/multimodule/genericElvisNullProof.kt \
            > evidence/owned-fixtures.sha256
      - name: provision pinned Kotlin and target inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          echo "KRUSTY_RUNTIME_CC=$(command -v clang)" >> "$GITHUB_ENV"
          echo "KRUSTY_LANGUAGE_VERSION=2.4.0" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLINC=$(just kotlinc 2.4.0)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native 2.4.0)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_BOX_DIR=$(just box-corpus 2.4.0)" >> "$GITHUB_ENV"
          echo "KRUSTY_DEPS_CACHE=$GITHUB_WORKSPACE/target/cache/krusty-deps" >> "$GITHUB_ENV"
          mkdir -p evidence
          for fixture in \
            delegatedProperty/delegateWithPrivateSet.kt \
            delegatedProperty/local/kt13557.kt \
            delegatedProperty/local/kt19690.kt \
            delegatedProperty/local/kt23117.kt \
            delegatedProperty/protectedVarWithPrivateSet.kt; do
            sha256sum "$(just box-corpus 2.4.0)/$fixture"
          done > evidence/upstream-fixtures.sha256
      - name: syntax-check the Native runtime with build.rs target flags
        working-directory: crates/krusty-native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../evidence
          compiler="${KRUSTY_RUNTIME_CC:-$(command -v clang)}"
          common_flags=(
            -std=c11 -ffreestanding -nostdlib -fno-pic -fno-stack-protector
            -fno-asynchronous-unwind-tables -fno-unwind-tables -ffunction-sections -O2
            -fsyntax-only
          )
          sources=(
            krusty_rt.c krusty_unsigned_arrays.c krusty_collections.c krusty_maps.c
            krusty_classes.c krusty_lang.c krusty_appendable.c krusty_fp.c krusty_gc.c
            krusty_threads.c krusty_start.c krusty_posix_thread.c krusty_posix_io.c
            krusty_posix_net.c krusty_posix_process.c krusty_posix_string.c
          )
          for arch in x86_64 aarch64 riscv64; do
            triple="$arch-unknown-linux-gnu"
            case "$arch" in
              x86_64) arch_flags=(-mcmodel=small -fcf-protection=none) ;;
              aarch64) arch_flags=(-mcmodel=small) ;;
              riscv64) arch_flags=(-mno-relax) ;;
            esac
            for source in "${sources[@]}"; do
              "$compiler" "--target=$triple" "${common_flags[@]}" "${arch_flags[@]}" \
                -I runtime "runtime/$source" >> ../../evidence/c-preflight.log 2>&1 || {
                  cat ../../evidence/c-preflight.log
                  exit 1
                }
            done
          done
          printf 'syntax-checked %s runtime sources for x86_64, aarch64, and riscv64\n' "${#sources[@]}" \
            | tee ../../evidence/c-preflight-summary.txt
      - name: provision Native crash inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gdb >/dev/null; then sudo apt-get update && sudo apt-get install -y gdb; fi
      - name: build conformance executable once
        id: build_conformance
        timeout-minutes: 40
        env:
          CARGO_BUILD_JOBS: '1'
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 bash scripts/cargo-test-binary.sh conformance -p krusty --test conformance > evidence/build.log 2>&1
          cat evidence/build.log
          binary="$(tail -n 1 evidence/build.log)"
          test -x "$binary"
          cp "$binary" conformance-bin
          sha256sum conformance-bin > evidence/conformance-binary.sha256
          cp conformance-bin evidence/conformance-bin
      - name: capture and diagnose the Native generated executable
        timeout-minutes: 20
        env:
          KRUSTY_TEST_THREADS: '1'
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: '1'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/native-tmp evidence/native-executables
          tmpdir="$GITHUB_WORKSPACE/evidence/native-tmp"
          printf '%s\n' "TMPDIR=$tmpdir" > evidence/native-diagnostic-environment.txt
          cat /proc/sys/kernel/core_pattern > evidence/core-pattern-original.txt
          cat evidence/core-pattern-original.txt >> evidence/native-diagnostic-environment.txt
          cat /proc/sys/kernel/core_uses_pid >> evidence/native-diagnostic-environment.txt
          sudo sysctl -w "kernel.core_pattern=$GITHUB_WORKSPACE/evidence/core.%e.%p" \
            > evidence/core-pattern-active.txt
          ulimit -c unlimited
          ulimit -c >> evidence/native-diagnostic-environment.txt
          python3 -u - "$tmpdir" evidence/native-executables <<'PY' > evidence/native-executable-watcher.log 2>&1 &
          import os, pathlib, shutil, sys, time
          root, output = map(pathlib.Path, sys.argv[1:])
          copied = set()
          while True:
              for path in root.rglob("*"):
                  try:
                      if not path.is_file() or not os.stat(path).st_mode & 0o111:
                          continue
                      if path in copied:
                          continue
                      with path.open("rb") as stream:
                          magic = stream.read(4)
                      if magic != b"\x7fELF":
                          continue
                      destination = output / f"{path.name}.elf"
                      shutil.copy2(path, destination)
                      copied.add(path)
                      print(f"captured {path} -> {destination} bytes={destination.stat().st_size}", flush=True)
                  except FileNotFoundError:
                      pass
              time.sleep(0.005)
          PY
          watcher=$!
          set +e
          cd evidence
          TMPDIR="$tmpdir" KRUSTY_BOX_ONLY=delegatePropertyNameCapability.kt timeout 600 ../conformance-bin \
            --exact kotlin_box_ir_jvm_conformance::kotlin_codegen_box_conformance --nocapture --test-threads=1 \
            > jvm-delegatePropertyNameCapability.log 2>&1
          jvm_status=$?
          printf 'jvm-delegatePropertyNameCapability\t%s\n' "$jvm_status" | tee -a status.tsv
          cat jvm-delegatePropertyNameCapability.log
          TMPDIR="$tmpdir" KRUSTY_REQUIRE_NATIVE_CONFORMANCE=1 \
            timeout 600 ../conformance-bin \
            --exact kotlin_box_native_conformance::native_runtime_and_library_delegates_receive_dynamic_property_names \
            --nocapture --test-threads=1 > native-klib-module-harness.log 2>&1
          native_status=$?
          printf 'native-klib-module-harness\t%s\n' "$native_status" | tee -a status.tsv
          cat native-klib-module-harness.log
          kill "$watcher" 2>/dev/null
          wait "$watcher" 2>/dev/null
          set -e
          find . -maxdepth 1 -type f -name 'core*' -print > core-files.txt
          if command -v gdb >/dev/null; then
            for executable in native-executables/*.elf; do
              [ -f "$executable" ] || continue
              sha256sum "$executable" >> native-executables.sha256
              if command -v file >/dev/null; then
                file "$executable" > "$(basename "$executable").file.txt"
              fi
              if command -v readelf >/dev/null; then
                readelf -h -Ws "$executable" > "$(basename "$executable").symbols.txt" 2>&1 || true
              fi
              env -i PATH="$PATH" gdb -q -batch -ex 'set pagination off' -ex run \
                -ex 'thread apply all bt full' -ex 'info registers' -ex 'x/16i $pc-32' \
                --args "$executable" > "gdb-run-$(basename "$executable").log" 2>&1 || true
              for core in $(cat core-files.txt); do
                gdb -q -batch -ex 'set pagination off' -ex 'thread apply all bt full' \
                  -ex 'info registers' -ex 'x/16i $pc-32' "$executable" "$core" \
                  > "gdb-$(basename "$core").log" 2>&1 || true
              done
            done
          fi
          test "$jvm_status" -eq 0 && grep -q 'test result: ok. 1 passed; 0 failed;' jvm-delegatePropertyNameCapability.log
          test "$native_status" -eq 0 && grep -q 'test result: ok. 1 passed; 0 failed;' native-klib-module-harness.log
      - name: restore runner core pattern
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s evidence/core-pattern-original.txt ]; then
            original="$(cat evidence/core-pattern-original.txt)"
            sudo sysctl -w "kernel.core_pattern=$original"
          fi
      - name: upload full validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 3300-delegate-property-validation
          path: evidence/
          if-no-files-found: error
