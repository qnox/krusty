name: ci

# PR gate (req #4): the whole gate is one command — `just ci` (lint + coverage-gate +
# conformance-all-plain) — run identically locally, in the pre-commit/pre-push hooks, and here in the
# `ci` job. Also runs on master pushes so the default branch never goes red unnoticed. Locally and in
# the hooks, conformance runs against the LATEST supported Kotlin version only, so the inner loop
# stays fast.
#
# CI additionally validates EVERY supported Kotlin reference version in the `conformance` job — one
# parallel matrix job per version (list computed from the kotlin-versions manifest via
# `just matrix-json`), each running `just conformance-one <ver>` against that version's own vendored
# kotlinc + box corpus. So the local gate is quick and CI still covers the whole support matrix.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one-command local gate: lint + coverage + conformance (latest version only).
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install coverage tooling
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25' # krusty's reference toolchain is Java 25; JVM-run e2e tests need it
      # Cache the reference kotlinc dist + the codegen/box corpus, keyed by manifest hash. `just ci`
      # (-> conformance-all-plain) provisions the latest version's toolchain + corpus on a miss, so
      # the conformance gate actually runs (it FAILS, not skips, without these).
      - name: cache kotlin toolchain + box corpus
        uses: actions/cache@v6
        with:
          path: |
            target/cache/kotlinc
            target/cache/box-corpus
            target/cache/ser-corpus
            target/cache/ksp-corpus
          key: kotlin-toolchain-${{ hashFiles('kotlin-versions') }}
      - name: just ci
        run: just ci

  # Emit the supported-version list (from the kotlin-versions manifest) as the conformance matrix.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - id: set
        run: echo "matrix=$(just matrix-json)" >> "$GITHUB_OUTPUT"

  # Reference/box conformance against EVERY supported Kotlin version — one parallel job per version.
  # fail-fast off so one version's failure doesn't cancel the others (each stands on its own).
  conformance:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      # Per-version kotlinc dist + box corpus cache. `just conformance-one` provisions both on a miss.
      - name: cache kotlin toolchain + box corpus (${{ matrix.version }})
        uses: actions/cache@v6
        with:
          path: |
            target/cache/kotlinc/${{ matrix.version }}
            target/cache/box-corpus/${{ matrix.version }}
          key: kotlin-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      - name: conformance ${{ matrix.version }}
        run: just conformance-one ${{ matrix.version }}
