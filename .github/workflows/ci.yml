name: Generic dependency class layout evidence

# Manual diagnostic run for the exact generic-layout product commit; failures are recorded per check
# and do not prevent the later versions or whole-fixture checks from running.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-layout:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Provision Native runtime compiler and exact 2.4.21 inputs
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
          runtime_cc="$(command -v clang)"
          "$runtime_cc" --version
          echo "KRUSTY_RUNTIME_CC=$runtime_cc" >> "$GITHUB_ENV"
          echo "KRUSTY_LANGUAGE_VERSION=2.4.21" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLINC=$(just kotlinc 2.4.21)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native 2.4.21)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_BOX_DIR=$(just box-corpus 2.4.21)" >> "$GITHUB_ENV"
      - name: Verify exact source and prepare evidence
        id: prepare
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/generic-layout-evidence"
          mkdir -p "$evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          source_commit=84d767b26f6f61cda5196732dc38f52c50197365
          git merge-base --is-ancestor "$source_commit" HEAD
          git diff --quiet "$source_commit" HEAD -- . ':(exclude).github/workflows/ci.yml'
          printf '%s\n' "$source_commit" > "$evidence/source-commit.txt"
          git rev-parse HEAD > "$evidence/workflow-commit.txt"
          git status --short --branch > "$evidence/checkout-status.txt"
      - name: Build compiler library unit and conformance binaries once
        id: binaries
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -uo pipefail
          snapshot() {
            {
              date -Is
              free -h
              for path in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events; do
                if [ -r "$path" ]; then
                  printf '\n--- %s ---\n' "$path"
                  cat "$path"
                fi
              done
              printf '\n--- top resident processes ---\n'
              ps -eo pid,ppid,rss,etime,comm,args --sort=-rss | awk 'NR <= 12'
            } >> "$EVIDENCE/compiler-memory.log" 2>&1
          }
          build_one() {
            local kind="$1"
            local recipe="$2"
            local logfile="$EVIDENCE/${kind}-build.log"
            snapshot
            just "$recipe" > "$logfile" 2>&1 &
            local build_pid=$!
            (
              while kill -0 "$build_pid" 2>/dev/null; do
                snapshot
                sleep 5
              done
            ) &
            local monitor_pid=$!
            set +e
            wait "$build_pid"
            local status=$?
            set -e
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            snapshot
            cat "$logfile" >&2
            printf '%s\n' "$status" > "$EVIDENCE/${kind}-build.exit-code"
            if [ "$status" -ne 0 ]; then return "$status"; fi
            tail -n 1 "$logfile"
          }
          set -e
          # The gate profile's optimized cfg(test) rustc process peaks near the 8 GiB
          # self-hosted runner limit. Build only this library unit-test binary with the existing
          # coverage profile (opt-level 1, debug info/LTO off); conformance stays on gate below.
          snapshot
          printf '%s\n' 'coverage' > "$EVIDENCE/compiler-unit-profile.txt"
          unit_log="$EVIDENCE/compiler-unit-build.log"
          cargo test --profile coverage --no-run -p krusty --lib --message-format=json \
            > "$unit_log" 2>&1 &
          unit_pid=$!
          (
            while kill -0 "$unit_pid" 2>/dev/null; do
              snapshot
              sleep 5
            done
          ) &
          monitor_pid=$!
          set +e
          wait "$unit_pid"
          unit_status=$?
          set -e
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          snapshot
          cat "$unit_log" >&2
          printf '%s\n' "$unit_status" > "$EVIDENCE/compiler-unit-build.exit-code"
          if [ "$unit_status" -ne 0 ]; then exit "$unit_status"; fi
          unitbin="$(jq -Rr 'fromjson? | select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "krusty" and .executable != null) | .executable' "$unit_log" | tail -n 1)"
          if [ ! -x "$unitbin" ]; then
            echo "could not locate krusty library test binary in cargo artifact stream" >&2
            exit 1
          fi
          printf '%s\n' "$unitbin" > "$EVIDENCE/unit-binary.txt"
          conformancebin="$(build_one conformance conformance-bin)"
          echo "$conformancebin" > "$EVIDENCE/conformance-binary.txt"
          echo "UNITBIN=$(realpath "$unitbin")" >> "$GITHUB_ENV"
          echo "CONFORMANCEBIN=$(realpath "$conformancebin")" >> "$GITHUB_ENV"
      - name: Run exact Native KLIB unit tests and implementation censuses at all stable releases
        id: release-checks
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.binaries.outcome == 'success' }}
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: |
          set -uo pipefail
          status_file="$EVIDENCE/release-check-status.tsv"
          : > "$status_file"
          run_check() {
            local label="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE/$label.log"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$label" "$status" | tee -a "$status_file"
          }
          for version in 2.4.0 2.4.10 2.4.20 2.4.21; do
            native="$(just kotlin-native "$version")"
            run_check "${version}-stdlib-callee-census" env \
              KRUSTY_LANGUAGE_VERSION="$version" KRUSTY_KOTLIN_NATIVE="$native" \
              "$UNITBIN" stdlib_calls_reach_header_declared_callees --nocapture
            run_check "${version}-generic-constructor-formals" env \
              KRUSTY_LANGUAGE_VERSION="$version" KRUSTY_KOTLIN_NATIVE="$native" \
              "$UNITBIN" klib_generic_constructor_target_owned_body_retains_class_formals --nocapture
            run_check "${version}-architecture-target-neutrality" env \
              KRUSTY_LANGUAGE_VERSION="$version" KRUSTY_KOTLIN_NATIVE="$native" \
              "$UNITBIN" klib_body_lowering_is_target_neutral --nocapture
            run_check "${version}-implementation-census" env \
              KRUSTY_LANGUAGE_VERSION="$version" KRUSTY_KOTLIN_NATIVE="$native" \
              KRUSTY_REQUIRE_KLIB=1 \
              KRUSTY_REQUIRE_KLIB_IMPLEMENTATION_TARGETS=native,wasm-js,wasm-wasi \
              "$UNITBIN" klib_libraries::tests::implementation_coverage:: --nocapture
          done
      - name: Provision exact 2.4.21 inputs and box corpus
        id: box-inputs
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.binaries.outcome == 'success' }}
        run: |
          set -euo pipefail
          echo "KRUSTY_LANGUAGE_VERSION=2.4.21" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLINC=$(just kotlinc 2.4.21)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native 2.4.21)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_BOX_DIR=$(just box-corpus 2.4.21)" >> "$GITHUB_ENV"
          printf '2.4.21\n' > "$EVIDENCE/box-reference-version.txt"
      - name: Run Native kt9712 and owned dependency superclass fixtures
        id: native-boxes
        if: ${{ always() && steps.box-inputs.outcome == 'success' }}
        env:
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: "1"
        run: |
          set -uo pipefail
          status_file="$EVIDENCE/native-box-status.tsv"
          : > "$status_file"
          run_case() {
            local key="$1"
            local filter="$2"
            set +e
            KRUSTY_NATIVE_BOX_ONLY="$filter" \
              ./run-tests.sh --test conformance kotlin_box_native_conformance::kotlin_codegen_box_native_conformance -- --nocapture \
              2>&1 | tee "$EVIDENCE/native-${key}.log"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$key" "$status" | tee -a "$status_file"
          }
          run_case "kt9712" "delegatedProperty/kt9712.kt"
          run_case "genericDependencyBaseClassLayout" "genericDependencyBaseClassLayout"
          run_case "dependencyObjectLiteralSuperclass" "dependencyObjectLiteralSuperclass"
      - name: Run generic dependency superclass fixture on Wasm JS and WASI
        id: wasm-boxes
        if: ${{ always() && steps.box-inputs.outcome == 'success' }}
        env:
          KRUSTY_REQUIRE_WASM_JS_CONFORMANCE: "1"
          KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE: "1"
        run: |
          set -uo pipefail
          status_file="$EVIDENCE/wasm-box-status.tsv"
          : > "$status_file"
          for target in WASM_JS WASM_WASI; do
            set +e
            env "KRUSTY_${target}_BOX_ONLY=genericDependencyBaseClassLayout" \
              ./run-tests.sh --test conformance "kotlin_box_wasm_conformance::kotlin_codegen_box_${target,,}_conformance" -- --nocapture \
              2>&1 | tee "$EVIDENCE/${target,,}-genericDependencyBaseClassLayout.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$target" "$status" | tee -a "$status_file"
          done
      - name: Upload exact version census and fixture logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-dependency-class-layout-evidence
          path: ${{ runner.temp }}/generic-layout-evidence
          if-no-files-found: warn
      - name: Fail if any captured check failed
        if: always() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          for file in "$EVIDENCE"/*-status.tsv; do
            [ -f "$file" ] || continue
            if awk -F '\t' '$2 != 0 { failed = 1 } END { exit !failed }' "$file"; then
              echo "Captured failures in $file" >&2
              exit 1
            fi
          done
