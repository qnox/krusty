name: coroutine machine compiler check
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compile:
    runs-on:
    - self-hosted
    - rust-4c-8gb
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: never
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: zulu
        java-version: '17'
    - id: just-on-path
      name: look for an installed just
      run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.just-on-path.outputs.found != 'true'
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
      with:
        tool: just
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: provision exact coroutine test inputs
      run: |
        set -euo pipefail
        echo "KRUSTY_KOTLINC=$(just kotlinc 2.4.21)" >> "$GITHUB_ENV"
        echo "KRUSTY_KOTLIN_BOX_DIR=$(just box-corpus 2.4.21)" >> "$GITHUB_ENV"
        echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native 2.4.21)" >> "$GITHUB_ENV"
        echo "KRUSTY_LANGUAGE_VERSION=2.4.21" >> "$GITHUB_ENV"
        echo "KRUSTY_DEPS_CACHE=$GITHUB_WORKSPACE/target/cache/krusty-deps" >> "$GITHUB_ENV"
        echo "KRUSTY_CLASS_DUMP_COMPILE_MISSING=1" >> "$GITHUB_ENV"
    - name: compile exact conformance test executable
      timeout-minutes: 40
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = d31f3ad5a81bb90c263dcee09ad1d80369b2831a
        git diff --exit-code d31f3ad5a81bb90c263dcee09ad1d80369b2831a HEAD -- src
        git rev-parse HEAD > compiler-source.txt
        set +e
        cargo test --features trace --profile gate -p krusty --test conformance --no-run --message-format=json 2>&1 | tee machine-check.jsonl
        status=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$status" > machine-check.exit
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        python3 - <<'PY'
        import json
        import pathlib
        import sys

        executables = []
        for line in pathlib.Path("machine-check.jsonl").read_text().splitlines():
            try:
                item = json.loads(line)
            except json.JSONDecodeError:
                continue
            target = item.get("target", {})
            executable = item.get("executable")
            if (
                item.get("reason") == "compiler-artifact"
                and target.get("name") == "conformance"
                and "test" in target.get("kind", [])
                and executable
            ):
                executables.append(pathlib.Path(executable))
        if len(executables) != 1 or not executables[0].is_file():
            print(f"expected one conformance test executable, found: {executables}", file=sys.stderr)
            sys.exit(1)
        pathlib.Path("conformance-test-executable.txt").write_text(str(executables[0]) + "\n")
        PY
        sha256sum "$(cat conformance-test-executable.txt)" > conformance-test-executable.sha256
    - name: upload compiler diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coroutine-machine-test-build
        path: |
          machine-check.jsonl
          machine-check.exit
          compiler-source.txt
          conformance-test-executable.txt
          conformance-test-executable.sha256
        if-no-files-found: error
    - name: run complete JVM coroutine fixtures
      timeout-minutes: 6
      continue-on-error: true
      env:
        KRUSTY_TRACE: suspend,lower
      run: |
        mkdir -p target/coroutine-target-results
        CONFORMANCE_TEST=$(cat conformance-test-executable.txt)
        set +e
        timeout --signal=TERM --kill-after=15s 300s env KRUSTY_BOX_ONLY=suspendStateMachine "$CONFORMANCE_TEST" --exact kotlin_box_ir_jvm_conformance::kotlin_codegen_box_conformance --test-threads=1 2>&1 | tee target/coroutine-target-results/jvm.log
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > target/coroutine-target-results/jvm.exit
        exit 0
    - name: run complete Native coroutine fixtures
      timeout-minutes: 6
      continue-on-error: true
      env:
        KRUSTY_TRACE: suspend,lower
        KRUSTY_NATIVE_BOX_ONLY: suspendStateMachine
        KRUSTY_REQUIRE_NATIVE_CONFORMANCE: '1'
        KRUSTY_TEST_THREADS: '1'
      run: |
        mkdir -p target/coroutine-target-results
        CONFORMANCE_TEST=$(cat conformance-test-executable.txt)
        set +e
        timeout --signal=TERM --kill-after=15s 300s "$CONFORMANCE_TEST" --exact kotlin_box_native_conformance::kotlin_codegen_box_native_conformance --test-threads=1 2>&1 | tee target/coroutine-target-results/native.log
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > target/coroutine-target-results/native.exit
        exit 0
    - name: run complete wasm-js coroutine fixtures
      timeout-minutes: 6
      continue-on-error: true
      env:
        KRUSTY_TRACE: suspend,lower
        KRUSTY_WASM_JS_BOX_ONLY: suspendStateMachine
        KRUSTY_REQUIRE_WASM_JS_CONFORMANCE: '1'
        KRUSTY_TEST_THREADS: '1'
      run: |
        mkdir -p target/coroutine-target-results
        CONFORMANCE_TEST=$(cat conformance-test-executable.txt)
        set +e
        timeout --signal=TERM --kill-after=15s 300s "$CONFORMANCE_TEST" --exact kotlin_box_wasm_conformance::kotlin_codegen_box_wasm_js_conformance --test-threads=1 2>&1 | tee target/coroutine-target-results/wasm-js.log
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > target/coroutine-target-results/wasm-js.exit
        exit 0
    - name: run complete wasm-wasi coroutine fixtures
      timeout-minutes: 6
      continue-on-error: true
      env:
        KRUSTY_TRACE: suspend,lower
        KRUSTY_WASM_WASI_BOX_ONLY: suspendStateMachine
        KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE: '1'
        KRUSTY_TEST_THREADS: '1'
      run: |
        mkdir -p target/coroutine-target-results
        CONFORMANCE_TEST=$(cat conformance-test-executable.txt)
        set +e
        timeout --signal=TERM --kill-after=15s 300s "$CONFORMANCE_TEST" --exact kotlin_box_wasm_conformance::kotlin_codegen_box_wasm_wasi_conformance --test-threads=1 2>&1 | tee target/coroutine-target-results/wasm-wasi.log
        status=${PIPESTATUS[0]}
        printf '%s\n' "$status" > target/coroutine-target-results/wasm-wasi.exit
        exit 0
    - name: summarize complete target fixture results
      if: always()
      run: |
        set +e
        failed=0
        for lane in jvm native wasm-js wasm-wasi; do
          result=target/coroutine-target-results/$lane.exit
          if [ -f "$result" ]; then
            status=$(cat "$result")
          else
            status=MISSING
          fi
          printf '%s: %s\n' "$lane" "$status"
          if [ "$status" != 0 ]; then failed=1; fi
        done
        exit "$failed"
    - name: upload complete target fixture results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coroutine-machine-target-results
        path: target/coroutine-target-results/
        if-no-files-found: warn
