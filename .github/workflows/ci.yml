name: Kotlin 2.5.0-RC source validation

# Manual-only rerun of the RC source checks that failed for harness/setup reasons.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-validation:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 360
    env:
      KOTLIN_VERSION: 2.5.0-RC
      KRUSTY_LANGUAGE_VERSION: 2.5.0-RC
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Verify exact source and provision exact RC JVM and Native inputs
        id: prepare
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/kotlin-2.5.0-RC-validation"
          mkdir -p "$evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          source_commit=68bb99dc6006aea849b85b3f9e12c6a497dd8882
          git merge-base --is-ancestor "$source_commit" HEAD
          git diff --quiet "$source_commit" HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)scripts/rc-klib-stamp-probe.sh'
          kotlinc="$(just kotlinc "$KOTLIN_VERSION")"
          kotlin_native="$(just kotlin-native "$KOTLIN_VERSION")"
          box_corpus="$(just box-corpus "$KOTLIN_VERSION")"
          runtime_cc="$(command -v clang || true)"
          echo "KRUSTY_KOTLINC=$kotlinc" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_NATIVE=$kotlin_native" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_BOX_DIR=$box_corpus" >> "$GITHUB_ENV"
          if [ -n "$runtime_cc" ]; then echo "KRUSTY_RUNTIME_CC=$runtime_cc" >> "$GITHUB_ENV"; fi
          printf '%s\n' "$source_commit" > "$evidence/source-base.txt"
          printf '%s\n' "$kotlinc" > "$evidence/kotlinc-path.txt"
          printf '%s\n' "$kotlin_native" > "$evidence/kotlin-native-path.txt"
          printf '%s\n' "$box_corpus" > "$evidence/box-corpus-path.txt"
          uname -a > "$evidence/runner-uname.txt"
          printf '%s\n' "$runtime_cc" > "$evidence/runtime-compiler-path.txt"
          clang --version > "$evidence/runtime-compiler-version.txt" 2>&1 || true
          git rev-parse HEAD > "$evidence/workflow-commit.txt"
          git status --short --branch > "$evidence/checkout-status.txt"
      - name: Check all four RC release tables against exact RC kotlinc
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./run-tests.sh --test conformance kotlinc_argument_conformance -- --nocapture \
            2>&1 | tee "$EVIDENCE/four-table-oracle.log"
      - name: Build compiler unit test binary
        id: compiler-unit
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -uo pipefail
          snapshot() {
            {
              date -Is
              free -h
              for path in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events; do
                if [ -r "$path" ]; then
                  printf '\n--- %s ---\n' "$path"
                  cat "$path"
                fi
              done
              printf '\n--- top resident processes ---\n'
              ps -eo pid,ppid,rss,etime,comm,args --sort=-rss | head -n 12
            } >> "$EVIDENCE/compiler-unit-memory.log" 2>&1
          }
          snapshot
          printf '%s\n' 'coverage' > "$EVIDENCE/compiler-unit-profile.txt"
          cargo test --profile coverage --no-run -p krusty --lib --message-format=json \
            > "$EVIDENCE/compiler-unit-build.log" 2>&1 &
          build_pid=$!
          (
            while kill -0 "$build_pid" 2>/dev/null; do
              snapshot
              sleep 5
            done
          ) &
          monitor_pid=$!
          set +e
          wait "$build_pid"
          status=$?
          set -e
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          snapshot
          cat "$EVIDENCE/compiler-unit-build.log"
          printf '%s\n' "$status" > "$EVIDENCE/compiler-unit-build.exit-code"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          bin="$(jq -Rr 'fromjson? | select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "krusty" and .executable != null) | .executable' "$EVIDENCE/compiler-unit-build.log" | tail -n 1)"
          if [ ! -x "$bin" ]; then
            echo "could not locate krusty library test binary in cargo artifact stream" >&2
            exit 1
          fi
          cp "$bin" compiler-unit-tests
          printf '%s\n' "$bin" > "$EVIDENCE/compiler-unit-binary.txt"
      - name: Probe Native KLIB stamps at language levels 2.0 through 2.7
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash scripts/rc-klib-stamp-probe.sh "$EVIDENCE/klib-stamps" \
            2>&1 | tee "$EVIDENCE/klib-stamp-probe.log"
      - name: Census RC stdlib implementations on Native and both Wasm targets
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.compiler-unit.outcome == 'success' }}
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: |
          set -euo pipefail
          just klib-implementation-coverage "$PWD/compiler-unit-tests" "$KOTLIN_VERSION" \
            2>&1 | tee "$EVIDENCE/implementation-census.log"
      - name: Verify Native friend-linker precedence oracle
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./run-tests.sh --test conformance friend_library_precedence_follows_the_native_linker_version -- --nocapture \
            2>&1 | tee "$EVIDENCE/native-friend-precedence-unit.log"
      - name: Run whole Native friend dependency box fixture
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: "1"
          KRUSTY_NATIVE_BOX_ONLY: multimoduleFriendDependency
        run: |
          set -euo pipefail
          ./run-tests.sh --test conformance kotlin_codegen_box_native_conformance -- --nocapture \
            2>&1 | tee "$EVIDENCE/native-friend-dependency-box.log"
      - name: Upload exact RC validation logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-2.5.0-RC-source-validation-retry
          path: ${{ runner.temp }}/kotlin-2.5.0-RC-validation
          if-no-files-found: warn
