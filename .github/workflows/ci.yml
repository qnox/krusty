name: KLIB data class array member evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-class-array-members:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: "17"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Verify source identity and prepare logs
        id: prepare
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/3472-data-class-array-evidence"
          mkdir -p "$evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          feature_commit=33bd94e090aed78ece3957c02853b410c4806e33
          git merge-base --is-ancestor "$feature_commit" HEAD
          git diff --quiet "$feature_commit" HEAD -- . ':(exclude).github/workflows/ci.yml'
          printf '%s\n' "$feature_commit" > "$evidence/feature-commit.txt"
          git rev-parse HEAD > "$evidence/workflow-commit.txt"
          git status --short --branch > "$evidence/checkout-status.txt"
      - name: Run JVM-oracle-first Native KLIB regression
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: "1"
        run: |
          set -euo pipefail
          ./run-tests.sh --test conformance native_data_class_signed_array_members_are_lowered_from_the_library_klib -- --nocapture \
            2>&1 | tee "$EVIDENCE/native-focused.log"
      - name: Run JVM-oracle-first Wasm JS and WASI KLIB regressions
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          KRUSTY_REQUIRE_WASM_JS_CONFORMANCE: "1"
          KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE: "1"
        run: |
          set -euo pipefail
          ./run-tests.sh --test conformance wasm_data_class_signed_array_members_are_lowered_from_the_library_klib -- --nocapture \
            2>&1 | tee "$EVIDENCE/wasm-focused.log"
      - name: Upload exact fixture validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-class-signed-array-klib-evidence
          path: ${{ runner.temp }}/3472-data-class-array-evidence
          if-no-files-found: warn
