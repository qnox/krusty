name: ci

# Build the conformance test binary once. Every supported Kotlin-version lane runs both its box
# corpus and every other active test in that binary. Publish only after the combined matrix passes
# and every version matches its exact box fail/not-applicable manifests.
# `merge_group` runs the same checks on a merge queue's combined commit: two pull requests can each
# match the lists on their own base and still disagree with them once both are on master.
on:
  pull_request:
  merge_group:
  push:
    branches: [master]

permissions:
  contents: read

# One run per pull-request or merge-group ref, so an update supersedes its older run. Every master
# push uses a unique group and remains authoritative evidence even when a newer commit is queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Lint + coverage (`just ci`). Conformance is `build-conformance-bin` plus the version matrix.
  # This job does not compile krusty again for it.
  ci:
    runs-on: ubuntu-latest
    env:
      # Coverage mappings are compiler-version dependent. Keep the committed baseline and the
      # instrumenting compiler on the same immutable nightly.
      KRUSTY_COVERAGE_TOOLCHAIN: nightly-2026-09-05
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Commit messages are checked here so a push does not queue a second workflow for them.
      # The check finishes in seconds; a separate job was still waiting on a runner.
      - name: attribution commits
        env:
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.event.after) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || 'HEAD^1..HEAD^2' }}
        run: scripts/check-attribution.sh "$RANGE"
      - name: box outcome manifests only shrink
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: scripts/check-box-lists.sh "$BASE" "$HEAD"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install coverage tooling
        run: rustup toolchain install "$KRUSTY_COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # Prebuilt binary: `cargo install cargo-llvm-cov` compiled it from source on every run
      # (~75s of the ci job).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '25'
      - name: cache kotlin toolchain + box corpus
        uses: actions/cache@v6
        with:
          path: |
            target/cache/kotlinc
            target/cache/box-corpus
            target/cache/ser-corpus
            target/cache/ksp-corpus
          key: kotlin-toolchain-${{ hashFiles('kotlin-versions') }}
      - name: select recorded-byte cache version
        id: recorded-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore recorded kotlinc bytes
        id: recorded-bytes
        uses: actions/cache/restore@v6
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-
      - name: select recorded-byte cache mode
        id: recorded-mode
        env:
          CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          # A restored entry is replayed. A test absent from this job's archive compiles
          # with kotlinc instead of failing. Master publishes the archive, including that
          # new recording, under this commit. A pull request does not write it.
          record=0
          compile_missing=1
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "compile_missing=$compile_missing" >> "$GITHUB_OUTPUT"
      - name: just ci
        env:
          # The instrumented e2e run costs ~2x the normal gate under [profile.coverage] (opt 1
          # with branch counters). Keep the local default strict; only this intentionally slower
          # environment raises it. A loaded runner was killed at fifteen minutes with about
          # 6500 of 7105 tests finished, so the budget is twenty minutes: a hung binary still
          # fails, a slow runner does not.
          KRUSTY_COVERAGE_E2E_TIMEOUT_SECONDS: 1200
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          # This job's archive only. The conformance job publishes a separate one.
          KRUSTY_RECORD_CLASS_DUMPS: ${{ steps.recorded-mode.outputs.record }}
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
        run: just ci
      - name: save recorded kotlinc bytes
        if: steps.recorded-mode.outputs.write == '1'
        uses: actions/cache/save@v6
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.recorded-version.outputs.version }}-${{ github.sha }}

  # Real Kotlin/Native metadata, provisioned rather than silently skipped. This lane validates the
  # common KLIB semantic boundary only; serialized IR bodies have their own follow-up.
  klib-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '25'
      - name: cache Kotlin toolchains and focused-test prerequisites
        uses: actions/cache@v6
        with:
          path: |
            target/cache/kotlin-native
            target/cache/kotlinc
            target/cache/box-corpus
          key: klib-semantics-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin-versions') }}
      - name: decode the Kotlin/Native stdlib through common metadata
        run: just klib-semantics

  build-conformance-bin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: build conformance test binary
        run: |
          set -euo pipefail
          bin=$(just conformance-bin)
          cp "$bin" conformance-bin
          # The non-box tests launch this CLI. The library is already built above.
          cargo build --profile gate -p krusty-cli
          cp target/gate/krusty krusty
      - uses: actions/upload-artifact@v7
        with:
          name: conformance-bin
          path: |
            conformance-bin
            krusty
          if-no-files-found: error

  # Supported-version matrix + the max version (for the badge later), from the kotlin-versions manifest.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      max: ${{ steps.set.outputs.max }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - id: set
        run: |
          echo "matrix=$(just matrix-json)" >> "$GITHUB_OUTPUT"
          echo "max=$(just max-version)" >> "$GITHUB_OUTPUT"

  conformance:
    needs: [build-conformance-bin, versions]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '25'
      - name: cache kotlin toolchain and conformance corpora (${{ matrix.version }})
        uses: actions/cache@v6
        with:
          path: |
            target/cache/kotlinc/${{ matrix.version }}
            target/cache/box-corpus/${{ matrix.version }}
            target/cache/ser-corpus/${{ matrix.version }}
            target/cache/ksp-toolchain
            target/cache/krusty-deps
          # Do not reuse the former box-only immutable cache: it can never acquire the newly
          # required serialization/KSP inputs.
          key: kotlin-conformance-all-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}
      # One archive per Kotlin version. A restored entry is replayed; a missing test compiles with
      # that lane's kotlinc. Master saves newly observed recordings under the exact version/commit.
      - name: restore recorded kotlinc bytes (${{ matrix.version }})
        id: recorded-bytes
        uses: actions/cache/restore@v6
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-conformance-${{ matrix.version }}-
      - name: select recorded-byte cache mode
        id: recorded-mode
        env:
          CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          compile_missing=1
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "compile_missing=$compile_missing" >> "$GITHUB_OUTPUT"
      - name: download conformance test binary
        uses: actions/download-artifact@v8
        with:
          name: conformance-bin
      - name: run box conformance ${{ matrix.version }}
        run: |
          set -euo pipefail
          chmod +x conformance-bin krusty
          just conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" > pct.txt
          read -r pct passed applicable < pct.txt
          echo "pct=$pct passed=$passed applicable=$applicable"
      - name: run non-box conformance ${{ matrix.version }}
        env:
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_RECORD_CLASS_DUMPS: "0"
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_KSP_E2E: "1"
          KRUSTY_REQUIRE_KSP_E2E: "1"
          KRUSTY_REQUIRE_SERIALIZATION_CONFORMANCE: "1"
        run: just conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      - name: save recorded kotlinc bytes (${{ matrix.version }})
        if: steps.recorded-mode.outputs.write == '1'
        uses: actions/cache/save@v6
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ github.sha }}
      - name: upload pct
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pct-${{ matrix.version }}
          path: pct.txt
          if-no-files-found: error

  # Build the release bytes once. The compatibility matrix below consumes this Maven repository;
  # it never rebuilds the plugin from the checkout.
  build-gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: build portable local-Maven distribution
        run: |
          set -euo pipefail
          version=$(just version)
          scripts/package-gradle-plugin.sh "$version" "$PWD/dist-gradle"
      - uses: actions/upload-artifact@v7
        with:
          name: krusty-gradle-plugin
          path: |
            dist-gradle/*.jar
            dist-gradle/*.zip
            dist-gradle/*-SHA256SUMS
          if-no-files-found: error

  # Execute the exact release bytes against every supported Kotlin Gradle plugin.
  gradle:
    needs: [build-conformance-bin, build-gradle-plugin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kotlin: 2.4.0,  gradle: 7.6.3 }
          - { kotlin: 2.4.0,  gradle: 9.5.0 }
          - { kotlin: 2.4.10, gradle: 8.14.3 }
          - { kotlin: 2.4.20, gradle: 7.6.3 }
          - { kotlin: 2.4.20, gradle: 9.7.0 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-provider: basic
      - uses: actions/download-artifact@v8
        with:
          name: conformance-bin
      - uses: actions/download-artifact@v8
        with:
          name: krusty-gradle-plugin
          path: dist-gradle
      - name: verify and unpack the tested Gradle plugin distribution
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist-gradle && sha256sum -c "krusty-gradle-plugin-$version-SHA256SUMS")
          unzip -q "dist-gradle/krusty-gradle-plugin-$version.zip" -d dist-gradle/unpacked
          echo "KRUSTY_GRADLE_PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "KRUSTY_GRADLE_PLUGIN_PROJECT=$PWD/dist-gradle/unpacked/krusty-gradle-plugin-$version" >> "$GITHUB_ENV"
      - name: run Gradle ${{ matrix.gradle }} integration with Kotlin ${{ matrix.kotlin }}
        env:
          KRUSTY_GRADLE_TEST_BIN: ${{ github.workspace }}/krusty
          KRUSTY_GRADLE_KGP_VERSION: ${{ matrix.kotlin }}
          KRUSTY_GRADLE_VERSION: ${{ matrix.gradle }}
          # Swatinem/rust-cache archives the Cargo target directory and may prune files that are
          # not Cargo build output. Keep Gradle's mutable Kotlin DSL workspace out of target so a
          # restored cache cannot contain a script directory without its metadata.bin.
          KRUSTY_GRADLE_USER_HOME: ${{ runner.temp }}/krusty-gradle-user-home
        run: |
          chmod +x krusty
          KRUSTY_GRADLE_BIN=$(command -v gradle) \
            cargo test --profile gate -p krusty-build -- --ignored \
              kotlin_compiler_slice_compiles_through_krusty kotlin_dsl_build_src_compiles_through_krusty

  # Build the release binaries per OS/arch (master only). Independent of conformance so it can run in
  # parallel; publishing is what waits on the gate.
  build-release:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { triple: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { triple: aarch64-apple-darwin,      os: macos-15 }
          - { triple: x86_64-apple-darwin,       os: macos-15-intel }
          - { triple: x86_64-pc-windows-msvc,   os: windows-latest }
          - { triple: aarch64-pc-windows-msvc,  os: windows-11-arm }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: install aarch64-linux linker
        if: matrix.target.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # build.rs cross-compiles the native runtime for every Linux target, riscv64 included. Apple's
      # clang ships without the RISC-V backend, so macOS builds use Homebrew's LLVM clang instead.
      - name: select LLVM clang for the native runtime
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! brew list --versions llvm >/dev/null; then
            brew install llvm
          fi
          clang="$(brew --prefix llvm)/bin/clang"
          test -x "$clang"
          "$clang" --print-targets | grep -q riscv64
          echo "KRUSTY_RUNTIME_CC=$clang" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: just build-release "${{ matrix.target.triple }}"
      - name: package compiler
        id: compiler_pkg
        shell: bash
        run: echo "path=$(just package "${{ matrix.target.triple }}")" >> "$GITHUB_OUTPUT"
      - name: package language server
        id: lsp_pkg
        shell: bash
        run: echo "path=$(just package "${{ matrix.target.triple }}" krusty-lsp)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: krusty-${{ matrix.target.triple }}
          path: |
            ${{ steps.compiler_pkg.outputs.path }}
            ${{ steps.lsp_pkg.outputs.path }}
          if-no-files-found: error

  release:
    needs: [ci, klib-semantics, conformance, build-gradle-plugin, gradle, versions, build-release]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Shorter than the release lock's TTL, so a lock that outlives it belongs to a dead job.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Master runs overlap, so two release jobs can run at once and an older commit can reach
      # this job after a newer one. A concurrency group would cancel a queued release, and with it
      # the whole run, so publishing takes a lock held in a ref instead. Under it, only the tip of
      # master that descends from the last published commit publishes: the release, the
      # latest-release marker and the badges never move backwards.
      - name: take the release lock
        id: lock
        run: echo "lock=$(scripts/release-publisher.sh acquire)" >> "$GITHUB_OUTPUT"
      - name: publish only the newest master commit
        id: tip
        run: scripts/release-publisher.sh check >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        if: steps.tip.outputs.publish == 'true'
        with:
          tool: just
      - name: collect all target artifacts
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: krusty-*
          path: dist
          merge-multiple: true
      - name: verify Gradle plugin release assets
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist && sha256sum -c "krusty-gradle-plugin-$version-SHA256SUMS")
      - name: compute version + tag
        if: steps.tip.outputs.publish == 'true'
        id: v
        run: |
          ver=$(just version)
          echo "ver=$ver"  >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      - name: package Zed extension
        if: steps.tip.outputs.publish == 'true'
        shell: bash
        run: just package-zed
      - name: publish
        if: steps.tip.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: "krusty ${{ steps.v.outputs.ver }}: Kotlin compiler written in Rust"
          target_commitish: ${{ github.sha }}
          files: dist/**
          fail_on_unmatched_files: true
      - name: record the published commit
        if: steps.tip.outputs.publish == 'true'
        run: scripts/release-publisher.sh record
      # Badge: read the max version's pct (produced by the conformance matrix) and publish to the gist.
      - name: download max-version pct
        if: ${{ steps.tip.outputs.publish == 'true' && vars.CONFORMANCE_GIST_ID != '' }}
        uses: actions/download-artifact@v8
        with:
          name: pct-${{ needs.versions.outputs.max }}
      - name: compute badge color
        if: ${{ steps.tip.outputs.publish == 'true' && vars.CONFORMANCE_GIST_ID != '' }}
        id: c
        run: |
          set -euo pipefail
          read -r pct passed applicable < pct.txt
          color=red
          awk "BEGIN{exit !($pct>=10)}" && color=orange || true
          awk "BEGIN{exit !($pct>=50)}" && color=yellow || true
          awk "BEGIN{exit !($pct>=70)}" && color=brightgreen || true
          {
            echo "pct=$pct"; echo "passed=$passed"; echo "applicable=$applicable"; echo "color=$color"
          } >> "$GITHUB_OUTPUT"
      - name: publish conformance badge → gist
        if: ${{ steps.tip.outputs.publish == 'true' && vars.CONFORMANCE_GIST_ID != '' }}
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.CONFORMANCE_GIST_ID }}
          filename: krusty-conformance.json
          label: Kotlin ${{ needs.versions.outputs.max }} conformance
          message: ${{ steps.c.outputs.pct }}% (${{ steps.c.outputs.passed }}/${{ steps.c.outputs.applicable }})
          color: ${{ steps.c.outputs.color }}
      - name: publish kotlin-version badge → gist
        if: ${{ steps.tip.outputs.publish == 'true' && vars.CONFORMANCE_GIST_ID != '' }}
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.CONFORMANCE_GIST_ID }}
          filename: krusty-kotlin.json
          label: Kotlin
          message: ${{ needs.versions.outputs.max }}
          color: blue
      - name: drop the release lock
        if: always() && steps.lock.outputs.lock != ''
        run: scripts/release-publisher.sh release "${{ steps.lock.outputs.lock }}"
