name: ci

# Build the conformance test binary once. Every supported Kotlin version gets independent JVM,
# Native, and Wasm matrix rows. Each row owns its corpus and focused target regressions.
# Publish only after all rows pass and every version matches its committed platform expectations.
# `ci-and-conformance` is the one check over core CI, conformance (including the focused KLIB
# decoder/oracle checks), and Gradle release/compatibility validation; the queue lands a batch only
# when it passes, and master requires the queue's own `merge-queue` status on each pull request.
# CI runs only for the merge queue app (infragnite/github-merge-queue), which is the one way into
# master. It pushes `mq/*` branches: a batch (the base plus one squash commit per pull request), a
# bisection run of part of a failed batch, or a `try` run of one pull request on master. Each commit
# names its base in a `Merge-Queue-Base:` trailer, which stands in for a pull request's base. The
# queue also dispatches this workflow on master now and then; only those runs save the caches every
# queue branch restores (a branch's own cache entries are visible to that branch alone).
on:
  push:
    branches: ['mq/**']
  # The queue dispatches a master run after each batch it lands, which saves the caches. Starting
  # one by hand with `release` on also builds the release on every platform and publishes it, once
  # the whole suite passed on that commit.
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish a release of this master commit after the test suite passes
        type: boolean
        default: false
  # A daily release of master's tip, as if dispatched with `release` on. Cron is UTC: 11:00 UTC is
  # 12:00 CET, and 13:00 during CEST. A tip that already has its release republishes nothing.
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read

env:
  KRUSTY_TEST_FAILURE_DIR: ${{ github.workspace }}/test-failures

# One run per queue branch (each is unique). Every master run uses a unique group and remains
# authoritative evidence even when a newer one is started.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Every cache below is restored everywhere but saved only by a master run, after the step that
# fills it. A queue branch's own entries are visible only to that branch, and one run's
# copies of the toolchains and Gradle caches (several GB) evicted the master entries that every
# branch restores, so later runs downloaded the toolchains again.
jobs:
  # Asks the runner controller where this run's jobs should run (infragnite/route-runner). The jobs
  # it places read its answer in their runs-on and fall back to their own labels when the answer
  # has no entry for them. In shadow mode the answer is each job's own labels, and the controller
  # records its proposal beside where each job really ran. A failure here must not stop the run:
  # without an answer every job keeps its own labels.
  route:
    # Every run waits on this job, so it runs on our own small runner: on GitHub's runners it queued
    # behind the jobs it had placed there and held whole runs back.
    runs-on: [self-hosted, utility]
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      runs-on: ${{ steps.route.outputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runners that ship just skip the download (install-action always fetches it from
      # GitHub releases, even when it is installed); others install it as before.
      - &just-on-path
        id: just-on-path
        name: look for an installed just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - &install-just
        if: steps.just-on-path.outputs.found != 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just
      # Only the jobs ready when the run starts: everything after build-tool-bins is placed by its
      # last step, when those jobs are released, on the queues as they are then.
      - id: route
        uses: infragnite/route-runner@8250bb2ba7237ccbcd01788e91d4b45da1db8c8a # main
        with:
          workflow: .github/workflows/ci.yml
          asking: route
          only: lint plugin-host build-tool-bins build-gradle-plugin build-maven-plugin

  # Lint and the own test suites are independent merge gates. Give each its own runner so the clean
  # Clippy build does not sit on the test critical path. Conformance and Gradle run prebuilt artifact
  # families from their independent producer jobs below; neither matrix compiles krusty again.
  # Their own labels are self-hosted rust-4c-8gb; the route answer may move them to GitHub's
  # runners. Fork PRs no longer run CI: only the queue's own branches do.
  lint:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on || '{}')['lint'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # Cancels the rest of a merge queue run after a lint failure.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      # The commit this run's change is measured from: a queue branch's base, from the trailer the
      # merge queue writes into its commits; on master, the commit itself (nothing to compare).
      - &mq-base
        name: base commit
        id: base
        run: |
          base=$(git log -1 --format='%(trailers:key=Merge-Queue-Base,valueonly)' HEAD | head -n 1)
          echo "sha=${base:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # Commit messages are checked here so a push does not queue a second workflow for them.
      # The check finishes in seconds; a separate job was still waiting on a runner.
      - name: attribution commits
        id: attribution
        env:
          RANGE: ${{ steps.base.outputs.sha }}..${{ github.sha }}
        run: scripts/check-attribution.sh "$RANGE"
      # The patch's three source files are content-pinned, so the cached copy is the file itself;
      # a hit never reaches raw.githubusercontent.com.
      - name: restore pinned IntelliJ sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/krusty-tools/intellij-community
          key: intellij-community-sources-${{ hashFiles('scripts/check-intellij-patch.sh') }}
      - name: validate pinned IntelliJ patch
        id: intellij_patch
        run: scripts/check-intellij-patch.sh
      # The release job runs tools/krusty-gradle's wrapper with the signing key, without setup-gradle's
      # wrapper validation; every committed wrapper is checked here instead.
      - name: validate Gradle wrappers
        id: gradle_wrappers
        run: scripts/check-gradle-wrappers.sh
      # A tag can be moved to other code after review; a commit cannot. Dependabot advances the pins.
      - name: actions are pinned to a commit
        id: action_pins
        run: |
          if grep -rnE '^ *(- )?uses: ' .github/workflows | grep -vE 'uses: [^ ]+@[0-9a-f]{40}( |$)'; then
            echo "pin each action above to a full commit SHA, with its version as a comment" >&2
            exit 1
          fi
      # A bare major resolves differently by pool: a runner keeps the build already in its tool
      # cache, while a GitHub-hosted runner downloads Azul's newest. The kotlinc reference caches are
      # keyed by the producing JDK, so a cache saved on one pool then misses on the other.
      - name: JDKs are pinned to an exact build
        id: jdk_pins
        run: |
          python3 - .github/workflows/*.yml <<'PY'
          import re, sys
          bad = []
          for path in sys.argv[1:]:
              block = False
              for n, line in enumerate(open(path), 1):
                  single = re.match(r"\s*java-version:\s*(?!\|)(\S+)", line)
                  if re.match(r"\s*java-version:\s*\|\s*$", line):
                      block = True
                      continue
                  item = re.match(r"\s+([^\s:#]+)\s*$", line) if block else None
                  if not item:
                      block = False
                  value = (single or item)
                  if value and not re.fullmatch(r"['\"]?\d+\.\d+\.\d+\+[\d.]+['\"]?", value.group(1)):
                      bad.append(f"{path}:{n}: {line.strip()}")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              print("name each JDK by its exact build, as setup-java resolves it (major.minor.patch+build)", file=sys.stderr)
              sys.exit(1)
          PY
      - name: outcome manifests only shrink
        id: outcome_lists
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HEAD: ${{ github.sha }}
        run: scripts/check-outcome-lists.sh "$BASE" "$HEAD"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Queue branches restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Self-hosted runners have no JDK on PATH (ubuntu-latest defaults to 17); the justfile runs
      # `java -version`.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - *just-on-path
      - *install-just
      - name: lint
        id: lint
        run: just lint
      # A queue branch that fails a check cannot land, and its run would otherwise keep every other
      # job queued for the shared runners. Cancel the rest of the run; the required aggregate still
      # reports the failure, which the queue reads. Only a failed check cancels: a runner or setup
      # failure (such as setup-java) leaves the run alone. Master runs always run to completion.
      - name: cancel the rest of a merge queue run after a lint failure
        if: >-
          failure() && startsWith(github.ref, 'refs/heads/mq/')
          && (steps.attribution.outcome == 'failure' || steps.intellij_patch.outcome == 'failure'
          || steps.gradle_wrappers.outcome == 'failure' || steps.action_pins.outcome == 'failure'
          || steps.outcome_lists.outcome == 'failure'
          || steps.lint.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "$GITHUB_RUN_ID"

  # krusty-plugin-host is outside the default members and the own-suite packages, so its own
  # compiler-independent tests run here. Compiler-dependent plugin integrations run in `e2e`.
  plugin-host:
    # GitHub-hosted: these tests ran out of memory on the 8 GB self-hosted runners, and GitHub's
    # Linux runners (16 GB) had free slots.
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on || '{}')['plugin-host'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Queue branches restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      # The host tests start real compiler-plugin hosts from their pinned toolchains on the
      # runner's JDK. The toolchains and compiled adapters stay in krusty's cache. Each job keeps
      # its own entry: this job and ci provision different Kotlin versions, and an entry is never
      # saved again once its key hits, so a shared one held only the first saver's jars and the
      # other job downloaded the rest from Maven Central on every run (~190 MB).
      - &plugin-host-runtime-cache
        name: restore plugin host runtime
        id: plugin-host-runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/krusty/plugin-host
          key: plugin-host-${{ github.job }}-${{ hashFiles('crates/krusty-plugin-host/src/pins/*.tsv', 'crates/krusty-plugin-host/adapter/*', 'crates/krusty-plugin-host/ksp-adapter/**') }}
          # A changed adapter or pin must not start from nothing: the newest entry of this job holds
          # the pinned jars, each verified by its checksum before it is reused, so only what the
          # change added is downloaded (Central answered 429 to a full download of ~190 MB).
          restore-keys: |
            plugin-host-${{ github.job }}-
      # What the restored cache lacks comes from Maven Central through Infragnite's package cache
      # (maven.infragnite.dev), which takes the cache token as a Basic password; Central answered
      # 429 to direct downloads of a new pin.
      - name: send the host's downloads through the package cache
        uses: infragnite/package-cache-action@3301abc273091e9b02fb391abdfd3a887a18ef4f # main
      - name: plugin host tests
        # The real-download test provisions into the cache restored above, not a directory of its own.
        run: |
          export KRUSTY_MAVEN_REPOSITORY="https://cache:${PACKAGE_CACHE_TOKEN}@${PACKAGE_CACHE_URL#https://}/maven"
          KRUSTY_CACHE_DIR="$HOME/.cache/krusty" cargo test --profile gate -p krusty-plugin-host -- --include-ignored
      - &save-plugin-host-runtime
        name: save plugin host runtime
        if: github.ref == 'refs/heads/master' && steps.plugin-host-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/krusty/plugin-host
          key: ${{ steps.plugin-host-runtime.outputs.cache-primary-key }}

  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    env:
      # The build compiles krusty's library and its cfg(test) unit harness side by side, and every
      # extra job token also lets rustc run more LLVM threads. Four jobs fit in 16 GB, which is
      # what GitHub's four-core runners use; eight do not.
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *mq-base
      # Self-hosted runners have no preinstalled rustup.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Queue branches restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - *just-on-path
      - *install-just
      # krusty-toolchain's oracle builds the Build Tools API implementation with its Gradle
      # wrapper, which does not run on JDK 25; the test step points it at JDK 21. The last
      # version listed stays JAVA_HOME.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: |
            21.0.13+0.3.1
            25.0.5+0.3.1
      # Toolchain entries are named by the exact toolchain they hold, never by a hash of the
      # checkout, and every job that needs one restores the same entry.
      - name: select the maximum Kotlin version
        id: max-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore kotlinc ${{ steps.max-version.outputs.version }}
        id: kotlinc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ steps.max-version.outputs.version }}
          key: kotlinc-${{ steps.max-version.outputs.version }}
      - name: restore serialization and KSP corpora
        id: kotlin-corpora
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/plugin-corpus
            target/cache/ksp-corpus
          key: kotlin-test-corpora-${{ steps.max-version.outputs.version }}
      - name: restore box corpus
        id: box-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus
          # The checkout carries the box corpus, the mock JDK its tests compile against, the CLI
          # corpus, the diagnostics test data, the bytecode corpora, and the test-generator sources that select each target's
          # cases. A key hit is never re-saved, so the key changes whenever those inputs do.
          key: box-cli-diagnostics-and-generator-corpus-v4-${{ hashFiles('kotlin-versions', 'scripts/box_selection.py', 'tests/box_selection_sources.txt') }}
      # A hit must already hold every corpus input: provisioning then refuses to fetch.
      - name: forbid corpus fetches after a cache hit
        if: steps.box-corpus.outputs.cache-hit == 'true'
        run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
      # krusty-toolchain's references (JetBrains' `kotlin` and the JDK glob matcher) are cached the
      # same way: restored from the base, run only for a missing entry, saved by master.
      # `tests/support/oracle.rs` keys each entry by the reference's identity and its inputs.
      - name: restore Kotlin Toolchain oracle output
        id: toolchain-oracle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-toolchain-oracle
          key: kotlin-toolchain-oracle-${{ steps.base.outputs.sha }}
          restore-keys: |
            kotlin-toolchain-oracle-
      - name: restore Kotlin Toolchain distribution
        id: kotlin-toolchain-cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: kotlin-toolchain-cli-${{ runner.os }}-${{ hashFiles('scripts/kotlin-toolchain/kotlin') }}
      # The native runtime's thread drivers run on every supported architecture: built for each
      # with clang and lld, and run under QEMU's user-mode emulators (tests/native_runtime_e2e.rs).
      # The packages are cached by the runner's release, so a run installs them without the Ubuntu
      # archive: the hosted runners' resolver failed for every *.ubuntu.com host for hours at a time.
      - &select-cross-packages
        name: select cross-architecture package cache
        id: cross-packages
        run: echo "key=cross-packages-v1-$(. /etc/os-release && echo "$ID-$VERSION_ID")-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
      - &restore-cross-packages
        name: restore cross-architecture packages
        id: cross-packages-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cross-packages
          key: ${{ steps.cross-packages.outputs.key }}
      - &install-cross-runners
        name: install cross-architecture runners
        # The POSIX drivers compile against each target's own glibc headers, so the layer's
        # hand-copied numbers and layouts are checked against the target's, not the host's.
        # Self-hosted runners ship these preinstalled and have no sudo.
        run: |
          set -euo pipefail
          if [ -x /usr/bin/qemu-aarch64 ] && [ -x /usr/bin/qemu-riscv64 ] && [ -x /usr/bin/ld.lld ] &&
            [ -d /usr/aarch64-linux-gnu/include ] && [ -d /usr/riscv64-linux-gnu/include ]; then
            exit 0
          fi
          packages=(qemu-user lld libc6-dev-arm64-cross libc6-dev-riscv64-cross)
          # The cached packages are exactly what the archive installed on this release: no network.
          if compgen -G "$HOME/cross-packages/*.deb" >/dev/null && sudo dpkg -i "$HOME"/cross-packages/*.deb; then
            exit 0
          fi
          # From the archive, falling back to another official mirror when the archive's hosts do
          # not resolve. apt verifies every index against Ubuntu's signing keys either way.
          if ! sudo apt-get update --error-on=any; then
            mirror=https://mirrors.edge.kernel.org/ubuntu/
            echo "::warning::the Ubuntu archive is unreachable; installing from $mirror"
            [ ! -f /etc/apt/apt-mirrors.txt ] || echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            for f in /etc/apt/sources.list.d/*.sources; do
              [ ! -f "$f" ] || sudo sed -i -E "s#https?://([a-z0-9.-]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#$mirror#g" "$f"
            done
            sudo apt-get update --error-on=any
          fi
          sudo apt-get install -y --download-only "${packages[@]}"
          mkdir -p "$HOME/cross-packages"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/cross-packages/" {} +
          sudo apt-get install -y "${packages[@]}"
      # Saved by master, as every cache here: a queue branch's own entry would be visible to it alone.
      - &save-cross-packages
        name: save cross-architecture packages
        if: github.ref == 'refs/heads/master' && steps.cross-packages-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cross-packages
          key: ${{ steps.cross-packages.outputs.key }}
      # The KLIB semantics, value-class and kotlinc-native oracle tests are ordinary e2e and unit
      # tests: the e2e job and this one run them against the maximum-version Native distribution.
      # The same entry the Native conformance row of this version restores.
      - name: restore Kotlin/Native ${{ steps.max-version.outputs.version }}
        id: kotlin-native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ steps.max-version.outputs.version }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.max-version.outputs.version }}
      # The Wasm unit tests and the KLIB coverage ratchet read each release's exact wasm-wasi stdlib
      # KLIB from KRUSTY_DEPS_CACHE and download it on demand when it is missing. Without a cache
      # restored here, every run downloaded it from Maven Central in the middle of the tests, and a
      # refused download surfaced only as "the exact target stdlib must be provisioned". Restore the
      # newest entry the e2e and conformance jobs saved; a master run saves it grown.
      - name: restore the Maven artifacts
        id: maven-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: krusty-deps-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            krusty-deps-
      - name: count the restored Maven artifacts
        id: maven-deps-restored
        run: echo "files=$(find target/cache/krusty-deps -type f 2> /dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      # The tests read this KLIB from KRUSTY_DEPS_CACHE, and a download that fails inside a test
      # surfaces only as "the exact target stdlib must be provisioned". Maven Central answers 429
      # to a client that asks for several artifacts in a row, and extends the block for every
      # request made during it, so fetch one release at a time with a pause between requests and a
      # growing wait after a refusal. A refusal that outlasts the waits fails this step with the
      # URL and the status.
      - name: provision the exact wasm stdlib of every release
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: |
          set -euo pipefail
          mkdir -p "$KRUSTY_DEPS_CACHE"
          for version in $(just kotlin-versions); do
            file="$KRUSTY_DEPS_CACHE/kotlin-stdlib-wasm-wasi-$version.klib"
            [ -f "$file" ] && continue
            url="https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-wasm-wasi/$version/kotlin-stdlib-wasm-wasi-$version.klib"
            for wait in 0 30 90 180; do
              sleep "$wait"
              status=$(curl -sSL -o "$file.part" -w '%{http_code}' "$url" || echo "curl failed")
              [ "$status" = 200 ] && break
              echo "$url answered $status"
              rm -f "$file.part"
            done
            [ "$status" = 200 ] || { echo "::error::$url was not downloaded: $status"; exit 1; }
            mv "$file.part" "$file"
            sleep 5
          done
      - name: provision Native for the normal test suites
        run: |
          root=$(just kotlin-native "$(just max-version)")
          echo "KRUSTY_KOTLIN_NATIVE=$root" >> "$GITHUB_ENV"
      - name: save Kotlin/Native ${{ steps.max-version.outputs.version }}
        if: github.ref == 'refs/heads/master' && steps.kotlin-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ steps.max-version.outputs.version }}
          key: ${{ steps.kotlin-native.outputs.cache-primary-key }}
      # The session test compiles against the embedder. This is the Maven the plugin jobs
      # install; a missing install fails that test.
      # The Maven distribution is cached and checksum-pinned (scripts/install-maven.sh), so a
      # mirror outage cannot fail a job that already holds it.
      - &restore-maven
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/krusty-tools/maven
          key: maven-distribution-3.9.11-v1
      - &install-maven
        name: install Maven
        run: scripts/install-maven.sh 3.9.11
      # Maven Central and the Gradle Plugin Portal through Infragnite's package cache
      # (maven.infragnite.dev), for the tests' Gradle builds and the Maven embedder. The step also
      # fetches the krusty-build-tools wrapper's distribution through the cache into that Gradle
      # user home, where the wrapper finds it; the checked-in URL stays on services.gradle.org.
      - name: send Gradle's and Maven's downloads through the package cache
        uses: infragnite/package-cache-action@3301abc273091e9b02fb391abdfd3a887a18ef4f # main
        env:
          # The init script goes to the Gradle user home the tests' builds use.
          GRADLE_USER_HOME: ${{ runner.temp }}/krusty-build-tools-gradle-user-home
        with:
          maven: 'true'
      # Coverage measures these same suites, instrumented, every night (.github/workflows/coverage.yml).
      - name: own test suites
        id: own-tests
        env:
          # A change to what krusty-toolchain's oracle entries hold re-runs every Kotlin Toolchain
          # case live (a queue branch restores, but never saves, the oracle cache), which takes
          # compile_cases past the ordinary 120 seconds.
          KRUSTY_TEST_TIMEOUT_SECONDS: 600
          KRUSTY_BUILD_TOOLS_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          # rust-cache prunes target before archiving it. A Gradle Kotlin-DSL workspace restored
          # from there can therefore lack metadata.bin, which Gradle 8 cannot regenerate.
          KRUSTY_BUILD_TOOLS_GRADLE_USER_HOME: ${{ runner.temp }}/krusty-build-tools-gradle-user-home
          KRUSTY_TOOLCHAIN_RUN_MISSING: 1
          KRUSTY_REQUIRE_KLIB: "1"
          KRUSTY_REQUIRE_KOTLIN_NATIVE: "1"
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: scripts/own-tests.sh
      # Holds every release's exact Native and Wasm stdlib to its implementation backlog with the
      # compiler unit binary the step above built and ran.
      - name: enforce exact KLIB implementation coverage for every release
        env:
          COMPILER_UNIT_TESTS: ${{ steps.own-tests.outputs.compiler_unit_tests }}
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_TEST_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          test -x "$COMPILER_UNIT_TESTS"
          for version in $(just supported-kotlin | tr , ' '); do
            echo "::group::KLIB implementation coverage $version"
            timeout 600s just klib-implementation-coverage "$COMPILER_UNIT_TESTS" "$version"
            # Each release's Native distribution is only read here; drop it before the next.
            rm -rf "$PWD/target/cache/kotlin-native/$version"
            echo "::endgroup::"
          done
      - name: check for new Maven artifacts
        id: maven-deps-grown
        if: github.ref == 'refs/heads/master' && success()
        env:
          RESTORED: ${{ steps.maven-deps-restored.outputs.files }}
        run: |
          now=$(find target/cache/krusty-deps -type f 2> /dev/null | wc -l)
          echo "Maven artifacts: $RESTORED restored, $now now"
          [ "$now" -gt "$RESTORED" ] || exit 0
          echo "grown=true" >> "$GITHUB_OUTPUT"
      - name: save the Maven artifacts entry
        if: steps.maven-deps-grown.outputs.grown == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: ${{ steps.maven-deps.outputs.cache-primary-key }}
      - name: save Kotlin Toolchain oracle output
        if: github.ref == 'refs/heads/master' && steps.toolchain-oracle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-toolchain-oracle
          key: kotlin-toolchain-oracle-${{ github.sha }}
      - name: save kotlinc ${{ steps.max-version.outputs.version }}
        if: github.ref == 'refs/heads/master' && steps.kotlinc.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ steps.max-version.outputs.version }}
          key: ${{ steps.kotlinc.outputs.cache-primary-key }}
      - name: save serialization and KSP corpora
        if: github.ref == 'refs/heads/master' && steps.kotlin-corpora.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/plugin-corpus
            target/cache/ksp-corpus
          key: ${{ steps.kotlin-corpora.outputs.cache-primary-key }}
      - name: save box corpus
        if: github.ref == 'refs/heads/master' && steps.box-corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus
          key: ${{ steps.box-corpus.outputs.cache-primary-key }}
      - name: save Kotlin Toolchain distribution
        if: github.ref == 'refs/heads/master' && steps.kotlin-toolchain-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: ${{ steps.kotlin-toolchain-cli.outputs.cache-primary-key }}

  build-tool-bins:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on || '{}')['build-tool-bins'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The last step asks the runner controller where the jobs waiting for this one run.
      id-token: write
    outputs:
      # Every consumer already waits for this artifact family. Publish the manifest-derived matrix
      # here instead of scheduling a separate ten-second runner solely for these two values.
      matrix: ${{ steps.versions.outputs.matrix }}
      max: ${{ steps.versions.outputs.max }}
      runs-on: ${{ steps.route.outputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Queue branches restore master's entries but never save their own: per-branch copies
          # overflowed the repository cache and evicted the master entries every branch restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Self-hosted runners have no JDK on PATH (ubuntu-latest defaults to 17); the justfile runs
      # `java -version`.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - *just-on-path
      - *install-just
      - name: select supported Kotlin versions
        id: versions
        run: |
          echo "matrix=$(just matrix-json)" >> "$GITHUB_OUTPUT"
          echo "max=$(just max-version)" >> "$GITHUB_OUTPUT"
      # One job builds every prebuilt Rust binary the later jobs run: the conformance and e2e
      # binaries, the krusty CLI and the krusty-build test binary all link one krusty library. In
      # separate jobs the conformance build compiled krusty a second time, with its test
      # dependencies' features.
      - name: build conformance, e2e, compiler and Gradle test binaries
        run: |
          set -euo pipefail
          source scripts/phase-timing.sh
          phase_log_prefix=tool-bins
          PHASE_TIMING_LOG="$(mktemp)"
          trap 'phase_report || true' EXIT
          phase_begin conformance-e2e-and-cli
          bin=$(just tool-test-bin conformance)
          phase_end conformance-e2e-and-cli
          cp "$bin" conformance-bin
          cp "$(just tool-test-bin e2e)" e2e-bin
          cp target/gate/krusty krusty
          phase_begin krusty-build-tests
          bin=$(CARGO_TEST_BINARY_REUSE="krusty krusty_jvm krusty_native krusty_wasm" just krusty-build-tests)
          phase_end krusty-build-tests
          cp "$bin" krusty-build-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-bin
          path: conformance-bin
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: e2e-bin
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-bins
          path: |
            krusty
            krusty-build-tests
          if-no-files-found: error
      # Last, so the jobs this releases are placed on the queues as they are the moment they become
      # ready. A failed ask leaves the answer empty and every job keeps its own labels.
      - id: route
        continue-on-error: true
        uses: infragnite/route-runner@8250bb2ba7237ccbcd01788e91d4b45da1db8c8a # main
        with:
          workflow: .github/workflows/ci.yml
          asking: build-tool-bins
          only: e2e conformance build-tools gradle maven bazel
          outputs: build-tool-bins.matrix=${{ steps.versions.outputs.matrix }}

  # The product e2e suite, uninstrumented, from build-tool-bins' binary. The binary reads its fixtures
  # through the checkout path it was built in, which every runner of this pool shares, so it runs on
  # the pool that built it. Coverage runs it instrumented every night (.github/workflows/coverage.yml).
  e2e:
    needs: [build-tool-bins]
    runs-on: ${{ fromJSON(needs.build-tool-bins.outputs.runs-on || '{}')['e2e'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The fallback pool is rust-4c-8gb and the suite runs one thread per core. The report at the
      # end names the machine and any process the kernel killed for memory, so an exit 137 says
      # what it was.
      - name: start runner profile
        run: scripts/runner-profile.sh start "$RUNNER_TEMP/runner-profile"
      - *mq-base
      # The Native runtime cache tests build a standalone fixture with Cargo.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - *just-on-path
      - *install-just
      # The last version listed stays JAVA_HOME, as in the ci job.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: |
            21.0.13+0.3.1
            25.0.5+0.3.1
      # The Wasm e2e programs run under Node.js, which runs WasmGC without flags from version 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: select the maximum Kotlin version
        id: max-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore kotlinc ${{ steps.max-version.outputs.version }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ steps.max-version.outputs.version }}
          key: kotlinc-${{ steps.max-version.outputs.version }}
      # The ci job saves this entry; see its restore step.
      - name: restore box corpus
        id: box-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus
          key: box-cli-diagnostics-and-generator-corpus-v4-${{ hashFiles('kotlin-versions', 'scripts/box_selection.py', 'tests/box_selection_sources.txt') }}
      # A hit must already hold every corpus input: provisioning then refuses to fetch.
      - name: forbid corpus fetches after a cache hit
        if: steps.box-corpus.outputs.cache-hit == 'true'
        run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
      - name: restore recorded kotlinc bytes
        id: recorded-bytes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.max-version.outputs.version }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-${{ steps.max-version.outputs.version }}-
      - name: select recorded-byte cache mode
        id: recorded-mode
        env:
          CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          # A restored entry is replayed. A test absent from this job's archive compiles
          # with kotlinc instead of failing. Master publishes the archive, including that
          # new recording, under this commit. A queue branch does not write it.
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"
      # The KLIB semantics, value-class and kotlinc-native oracle tests run against the
      # maximum-version Native distribution. The ci job saves this entry.
      - name: restore Kotlin/Native ${{ steps.max-version.outputs.version }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ steps.max-version.outputs.version }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.max-version.outputs.version }}
      - name: provision kotlinc, the box corpus and Native
        run: |
          set -euo pipefail
          version="${{ steps.max-version.outputs.version }}"
          just kotlinc "$version" >/dev/null
          just box-corpus "$version" >/dev/null
          echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native "$version")" >> "$GITHUB_ENV"
      # native_runtime_e2e runs the thread drivers on every other architecture and fails in CI
      # without their emulators, linker and glibc headers; not every runner this job lands on ships
      # them, so it installs them like the job that builds the binary.
      - *select-cross-packages
      - *restore-cross-packages
      - *install-cross-runners
      - *save-cross-packages
      # The Maven artifacts the suite fetches on demand into KRUSTY_DEPS_CACHE (atomicfu plugins and
      # runtimes, the pinned serialization, Compose runtime and coroutines jars). Nothing fills the
      # cache in advance: a job restores the newest entry, downloads what it lacks, and a master job
      # that downloaded something saves the grown cache for later runs.
      - name: restore the Maven artifacts
        id: maven-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: krusty-deps-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: |
            krusty-deps-
      - name: count the restored Maven artifacts
        id: maven-deps-restored
        run: echo "files=$(find target/cache/krusty-deps -type f 2> /dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: download e2e binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin
      - name: download compiler binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - name: e2e
        env:
          RUST_MIN_STACK: "134217728"
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_REQUIRE_KLIB: "1"
          KRUSTY_REQUIRE_KOTLIN_NATIVE: "1"
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: |
          set -euo pipefail
          source scripts/test-gate-defaults.sh
          source scripts/test-deadline.sh
          chmod +x e2e-bin krusty
          export KRUSTY_BIN="$PWD/krusty"
          # One thread per CPU, as many as memory holds: four on the 8 GB runners were OOM-killed.
          run_with_deadline "$KRUSTY_E2E_TIMEOUT_SECONDS" ./e2e-bin --test-threads="$(bash scripts/memory-workers.sh 2048)"
      - name: save recorded kotlinc bytes
        if: steps.recorded-mode.outputs.write == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-${{ steps.max-version.outputs.version }}-${{ github.sha }}
      # The same binary's ignored plugin and KSP controls.
      - *plugin-host-runtime-cache
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - name: compiler plugin integration tests
        env:
          RUST_MIN_STACK: "134217728"
        run: |
          set -euo pipefail
          source scripts/test-gate-defaults.sh
          source scripts/test-deadline.sh
          export KRUSTY_BIN="$PWD/krusty"
          ignored_tests="$(./e2e-bin plugin_host_compiler_e2e:: --ignored --list --format=terse)"
          printf '%s\n' "$ignored_tests"
          grep -q ': test$' <<< "$ignored_tests"
          run_with_deadline "$KRUSTY_E2E_TIMEOUT_SECONDS" ./e2e-bin plugin_host_compiler_e2e:: --include-ignored --test-threads=1
      - *save-plugin-host-runtime
      - &save-maven-deps
        name: check for new Maven artifacts
        if: github.ref == 'refs/heads/master' && success()
        env:
          RESTORED: ${{ steps.maven-deps-restored.outputs.files }}
        run: |
          now=$(find target/cache/krusty-deps -type f 2> /dev/null | wc -l)
          echo "Maven artifacts: $RESTORED restored, $now now"
          [ "$now" -gt "$RESTORED" ] || exit 0
          echo "grown=true" >> "$GITHUB_OUTPUT"
        id: maven-deps-grown
      - &save-maven-deps-entry
        name: save the Maven artifacts entry
        if: steps.maven-deps-grown.outputs.grown == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: ${{ steps.maven-deps.outputs.cache-primary-key }}
      - name: upload failed program evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: test-failures/
          if-no-files-found: ignore
      - name: runner profile
        if: always()
        run: scripts/runner-profile.sh report "$RUNNER_TEMP/runner-profile"

  conformance:
    name: conformance (${{ matrix.version }}, ${{ matrix.target }})
    needs: [build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
        target: [jvm, native, wasm-js, wasm-wasi]
    # Cold reflective box() calls share one deadline. Hosted runners kept 2s. The 8 GB
    # pool missed it once: functions/functionNtoString.kt on Kotlin 2.4.0, while the same source
    # passed for 2.4.10, 2.4.20, and 2.4.21. Give that pool 8s. The client round-trip wait stays
    # 8s above the JVM deadline. Every target uses the guarded self-hosted pool. Native once reached
    # its suite deadline on these 8 GB runners; sharing decoded KLIB trees (#3274) halved its lane
    # and its peak memory. Separate target rows preserve independent measurements.
    runs-on: ${{ fromJSON(needs.build-tool-bins.outputs.runs-on || '{}')['conformance'][format('{0}|{1}', matrix.version, matrix.target)] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    env:
      KRUSTY_BOX_CASE_TIMEOUT_MS: '8000'
      # Every target row reads the reference plugin and runtime jars the plugin corpora name from
      # here; the "provision plugin jars" step below fills it before any test runs.
      KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
      # Each target row keeps its own kotlinc box reference cache; see its restore step.
      BOX_REFERENCES: box-reference-classes-${{ matrix.target != 'jvm' && format('{0}-', matrix.target) || '' }}${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One label serves machines of different speeds. The last step reports which machine this
      # row had and how much of its CPU time went to other guests or waited on CPU, disk or memory.
      - name: start runner profile
        run: scripts/runner-profile.sh start "$RUNNER_TEMP/runner-profile"
      - *mq-base
      - *just-on-path
      - *install-just
      # Kotlin's CLI corpus names JDK 8, 11, 17 and 21 homes; kotlin_cli_jvm_conformance finds them
      # through the JAVA_HOME_<release>_X64 variables this exports and fails a case it cannot run.
      # The last version listed stays JAVA_HOME.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: |
            8.0.512+9
            11.0.33+10
            17.0.21+0.3.1
            21.0.13+0.3.1
            25.0.5+0.3.1
      # Every row and the ci job restore one kotlinc entry per version, named by that version.
      - name: restore kotlinc ${{ matrix.version }}
        id: kotlinc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ matrix.version }}
          key: kotlinc-${{ matrix.version }}
      # The Maven artifacts the suite fetches on demand into KRUSTY_DEPS_CACHE (atomicfu plugins and
      # runtimes, the pinned serialization, Compose runtime and coroutines jars). Nothing fills the
      # cache in advance: a job restores the newest entry, downloads what it lacks, and a master job
      # that downloaded something saves the grown cache for later runs.
      - name: restore the Maven artifacts
        id: maven-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: krusty-deps-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: |
            krusty-deps-
      - name: count the restored Maven artifacts
        id: maven-deps-restored
        run: echo "files=$(find target/cache/krusty-deps -type f 2> /dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      # The Native lane's JVM oracle needs the same extra libraries (the atomicfu plugin), so it
      # restores the entry the JVM lane saves; only the JVM lane saves it.
      - name: restore serialization and KSP conformance inputs (${{ matrix.version }})
        if: matrix.target == 'jvm' || matrix.target == 'native'
        id: conformance-inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/plugin-corpus/*/${{ matrix.version }}
            target/cache/ksp-toolchain
            target/cache/krusty-deps
          key: kotlin-conformance-inputs-v2-${{ matrix.version }}
      # The atomicfu plugin jar is not in the distribution. A test process fetches a missing jar
      # under one shared download budget, and a slow transfer used to spend it so that every later
      # case failed with "needs the atomicfu compiler plugin jar". Provision the jars the
      # descriptors name here instead, with retries, keyed by the descriptors so a change to a pin
      # fetches afresh.
      - name: restore plugin jars (${{ matrix.version }})
        id: plugin-jars
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: plugin-jars-v1-${{ matrix.version }}-${{ hashFiles('src/plugins/*/boxes/corpus.txt') }}
      - name: provision plugin jars (${{ matrix.version }})
        run: scripts/provision-plugin-jars.sh "${{ matrix.version }}"
      - name: restore Wasm target KLIB dependencies (${{ matrix.version }})
        if: startsWith(matrix.target, 'wasm-')
        id: wasm-klibs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: wasm-target-klibs-v1-${{ matrix.target }}-${{ matrix.version }}
      # Native cases are analyzed against this version's Kotlin/Native stdlib KLIB.
      # `scripts/kotlin-native.sh` re-downloads a restored root whose stdlib payload is incomplete.
      # The ci job restores the same entry for the maximum version.
      - name: restore Kotlin/Native ${{ matrix.version }}
        if: matrix.target == 'native'
        id: kotlin-native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ matrix.version }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}
      # Every Native row replays the kotlinc-native results its box lane and focused checks
      # recorded: the box lane's owned multimodule fixtures alone run 68 kotlinc-native graphs,
      # about three quarters of a cold row's case time. Master records what is missing.
      - name: restore recorded kotlinc-native bytes
        if: matrix.target == 'native'
        id: native-recordings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/native-recordings
          key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            recorded-kotlinc-native-bytes-${{ matrix.version }}-
      - name: select kotlinc-native recording mode
        if: matrix.target == 'native'
        id: native-recording-mode
        env:
          CACHE_HIT: ${{ steps.native-recordings.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"
      # kotlinc's KLIB bytes for each box case, keyed like the JVM recordings: restored from the
      # base, completed live for a missing entry, and saved only by a master push.
      - name: restore KLIB box reference bytes
        if: matrix.target != 'jvm'
        id: klib-recordings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/klib-references
          key: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-
      # A restore through `restore-keys` never reports a hit, so whether a master push saves is
      # decided by the entries it added: one archive per exact-input fingerprint, never rewritten.
      - name: list restored KLIB box reference bytes
        if: matrix.target != 'jvm'
        id: klib-recordings-restored
        run: echo "entries=$(scripts/cache-entries.sh target/cache/klib-references)" >> "$GITHUB_OUTPUT"
      - name: restore box corpus (${{ matrix.version }})
        id: box-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus/${{ matrix.version }}
          # The checkout carries the box corpus, the mock JDK its tests compile against, the CLI
          # corpus, the diagnostics test data, the bytecode corpora, and the test-generator sources that select each target's
          # cases. A key hit is never re-saved, so the key changes whenever those inputs do.
          key: box-cli-diagnostics-and-generator-corpus-v4-${{ matrix.version }}-${{ hashFiles('kotlin-versions', 'scripts/box_selection.py', 'tests/box_selection_sources.txt') }}
      # A hit must already hold every corpus input: provisioning then refuses to fetch.
      - name: forbid corpus fetches after a cache hit (${{ matrix.version }})
        if: steps.box-corpus.outputs.cache-hit == 'true'
        run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
      # One archive per Kotlin version. A restored entry is replayed; a missing test compiles with
      # that lane's kotlinc. Master saves newly observed recordings under the exact version/commit.
      - name: restore recorded kotlinc bytes (${{ matrix.version }})
        if: matrix.target == 'jvm'
        id: recorded-bytes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            recorded-kotlinc-bytes-conformance-${{ matrix.version }}-
      - name: select recorded-byte cache mode
        if: matrix.target == 'jvm'
        id: recorded-mode
        env:
          CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
          MASTER_PUSH: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          compile_missing=1
          write=0
          if [ "$MASTER_PUSH" = true ] && [ "$CACHE_HIT" != true ]; then
            write=1
          fi
          echo "write=$write" >> "$GITHUB_OUTPUT"
          echo "compile_missing=$compile_missing" >> "$GITHUB_OUTPUT"
      # The byte score compiles every applicable box case with that version's kotlinc. Those
      # inventories live in their own cache, target/cache/ref-classes, whose entries
      # tests/box_reference_classes.rs keys by source, classpath, unit modes, the exact compiler and
      # the producing JDK, plus REF_CACHE_SALT, which a producer or layout change bumps. Restored
      # from the base and saved by master like the recorded bytes. The GHA key names only the
      # Kotlin version: an edit to the test harness or to one case invalidates just the entries
      # whose inputs it changed, instead of the ~7,300 compiles behind a fresh cache.
      # Owned Native/Wasm cases require these same JVM oracle inventories.
      # The bytecodeText and bytecodeListing reference checks in the non-box step compile through
      # the same cache, so master saves it after that step and pull requests replay those compiles.
      # The focused Native and Wasm tests compile JVM oracles no JVM row reads (about 30 per Kotlin
      # version), so each of those rows saves its own copy. The JVM row's cache seeds a row that has
      # none yet, and that row's first save keeps only the entries its own run read or compiled.
      - name: restore kotlinc box references (${{ matrix.version }})
        id: box-references
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/ref-classes
          key: ${{ env.BOX_REFERENCES }}-${{ steps.base.outputs.sha }}
          restore-keys: |
            ${{ env.BOX_REFERENCES }}-
            box-reference-classes-${{ matrix.version }}-
      - name: mark seeded kotlinc box references (${{ matrix.version }})
        id: box-references-seeded
        if: >-
          matrix.target != 'jvm' && github.ref == 'refs/heads/master'
          && !startsWith(steps.box-references.outputs.cache-matched-key, format('{0}-', env.BOX_REFERENCES))
        run: mkdir -p target && touch target/ref-classes-seeded
      - name: download conformance binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-bin
      # Only the JVM row runs the compiler binary (its box step and the CLI conformance). The Native
      # and Wasm rows drive the compiler in-process from the conformance binary.
      - name: download compiler binary
        if: matrix.target == 'jvm'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      # One box run writes both reports over the same applicable cases: pct.txt is the case report
      # "<pct> <passed> <applicable>" and jvm-byte-equality.txt the JVM byte report
      # "<pct> <matched> <total>" (.class bytes). Printing their badge fields validates each and
      # previews, without publishing, what the master release would show.
      - name: run box conformance ${{ matrix.version }}
        if: matrix.target == 'jvm'
        env:
          # A cold lane compiles every missing kotlinc reference before it can publish the cache.
          # The full JVM corpus can exceed 30 minutes on slower self-hosted workers.
          KRUSTY_CONFORMANCE_TIMEOUT_SECONDS: "2400"
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
          # The box cases' extra libraries (the atomicfu plugin and runtime, Compose, serialization)
          # resolve from the restored `krusty-deps` entry; without this they went to
          # `~/.cache/krusty-deps` and were downloaded from Maven Central on every run.
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        run: |
          set -euo pipefail
          chmod +x conformance-bin krusty
          just conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" jvm-byte-equality.txt > pct.txt
          bash scripts/conformance-badge.sh fields conformance pct.txt "${{ matrix.version }}"
          bash scripts/conformance-badge.sh fields jvm-byte-equality jvm-byte-equality.txt "${{ matrix.version }}"
      - name: run native box conformance ${{ matrix.version }}
        if: matrix.target == 'native'
        id: native_box
        continue-on-error: true
        # The corpus deadline fits a cold row on the slowest pool: an evicted recordings cache
        # must slow a row down, not fail it. A cold 2.4.21 row (no kotlinc-native recordings, no
        # KLIB references) took 765 s on a 4-vCPU GitHub-class runner with the oracle in persistent
        # kotlinc-native servers; the slowest pool compiles up to 2.4x slower, about 1,840 s, and
        # this budget keeps a quarter on top of that. Keep ordinary and focused deadlines
        # unchanged; a corpus timeout still fails this row.
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: "2300"
          KRUSTY_NATIVE_BYTE_REPORT: ${{ github.workspace }}/native-byte-equality.txt
          KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/native-recordings
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.native-recording-mode.outputs.write }}
        run: |
          chmod +x conformance-bin
          just native-conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" native-pct.txt
          bash scripts/conformance-badge.sh fields native-conformance native-pct.txt "${{ matrix.version }}"
      - name: run focused Native conformance ${{ matrix.version }}
        # Keep focused target regressions independent of a recorded corpus failure. They share the
        # exact Native distribution/KLIB setup, but not the corpus process or its ratchet.
        if: matrix.target == 'native' && (success() || steps.native_box.outcome == 'failure')
        id: native_focused
        continue-on-error: true
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/native-recordings
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.native-recording-mode.outputs.write }}
        run: just native-conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      - name: upload Native conformance
        if: always() && matrix.target == 'native'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pct-${{ matrix.version }}
          path: native-pct.txt
          if-no-files-found: error
      - name: save recorded kotlinc-native bytes
        if: matrix.target == 'native' && steps.native-recording-mode.outputs.write == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/native-recordings
          key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ github.sha }}
      - name: enforce native box conformance ${{ matrix.version }}
        if: matrix.target == 'native' && steps.native_box.outcome == 'failure'
        run: exit 1
      - name: enforce focused Native conformance ${{ matrix.version }}
        if: matrix.target == 'native' && steps.native_focused.outcome == 'failure'
        run: exit 1
      # Both Wasm lanes run every accepted case under Node.js, which runs WasmGC without flags from
      # version 22. Each lane's ratchet fails the step on a regression or an unrecorded pass. Each
      # lane analyzes against its exact wasm-js or wasm-wasi stdlib KLIB before target
      # emission. They remain separate because Kotlin publishes different platform surfaces.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: startsWith(matrix.target, 'wasm-')
        with:
          node-version: '22'
      - name: run wasm box conformance ${{ matrix.version }}
        if: startsWith(matrix.target, 'wasm-')
        # Each case also compiles kotlinc's KLIB reference when no recording exists. A cold
        # 2.4.21 wasm-js row took 825 s on a 4-vCPU GitHub-class runner; at the slowest pool's up
        # to 2.4x that is about 1,980 s, and this budget keeps a quarter on top of that.
        env:
          KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: "2500"
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_WASM_JS_BYTE_REPORT: ${{ github.workspace }}/wasm-js-byte-equality.txt
          KRUSTY_WASM_WASI_BYTE_REPORT: ${{ github.workspace }}/wasm-wasi-byte-equality.txt
          KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x conformance-bin
          just wasm-conformance-run "${{ matrix.target }}" "$PWD/conformance-bin" "${{ matrix.version }}"
      # Focused Wasm checks exercise both targets; run that complete inventory once per version.
      - name: run focused Wasm conformance ${{ matrix.version }}
        if: matrix.target == 'wasm-js'
        # The focused tests that compile with the reference kotlinc-wasm replay its recorded
        # library from the same cache the corpus step restores, and master publishes new ones.
        env:
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/klib-references
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: "1"
          KRUSTY_CLASS_DUMP_WRITE: ${{ github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true' && '1' || '0' }}
        run: just wasm-conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      - name: list new KLIB box reference bytes
        if: always() && matrix.target != 'jvm' && github.ref == 'refs/heads/master'
        id: klib-recordings-added
        env:
          RESTORED: ${{ steps.klib-recordings-restored.outputs.entries }}
        run: |
          set -euo pipefail
          entries=$(scripts/cache-entries.sh target/cache/klib-references)
          echo "added=$([ "$entries" != "$RESTORED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: save KLIB box reference bytes
        if: always() && steps.klib-recordings-added.outputs.added == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/klib-references
          key: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ github.sha }}
      - name: upload KLIB byte equality
        if: always() && matrix.target != 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klib-byte-equality-${{ matrix.version }}-${{ matrix.target }}
          path: '*-byte-equality.txt'
          if-no-files-found: error
      - name: run non-box conformance ${{ matrix.version }}
        id: non_box
        if: matrix.target == 'jvm'
        env:
          # Required serialization/reference CLI toolchains can be cold. Keep the local
          # 120-second default; this complete CI pass includes their provisioning and compilation.
          KRUSTY_CONFORMANCE_TIMEOUT_SECONDS: "600"
          # box_selection_reference runs the upstream test generators' selection over the whole
          # Kotlin test-data tree as one BoxRunner call: about 1s locally, past the 10s default on a
          # busy 8 GB runner while the step's other tests share its cores.
          KRUSTY_BOX_TIMEOUT_MS: "60000"
          KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
          KRUSTY_RECORD_CLASS_DUMPS: "0"
          KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
          KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
          KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
          KRUSTY_REQUIRE_SERIALIZATION_CONFORMANCE: "1"
        run: just conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
      # kotlinc's diagnostics test data, scored by false accepts against
      # tests/diagnostics_false_accepts and by reported diagnostics against
      # tests/diagnostics_ledger_mismatches. Its kotlinc results are box reference compiles, restored
      # with the box references and saved with them after the JVM steps that fill that cache.
      # This job runs only on merge-queue branches and dispatched master runs, like the other lanes.
      # It runs after non-box conformance, and also when that step failed, so neither lane's
      # failure hides the other's result.
      - name: run diagnostics conformance ${{ matrix.version }}
        if: >-
          (success() || steps.non_box.outcome == 'failure')
          && matrix.target == 'jvm' && matrix.version == needs.build-tool-bins.outputs.max
        env:
          KRUSTY_DIAGNOSTICS_TIMEOUT_SECONDS: "10800"
        run: just diagnostics-conformance "$PWD/conformance-bin" "${{ matrix.version }}"
      # Entries no run read for a week (removed or edited cases, an old salt) go before saving, so
      # the cache follows the suite instead of growing with every input it ever compiled. Entries
      # a cut-short run never reached stay until they have gone a week unread.
      - name: prune kotlinc box references (${{ matrix.version }})
        if: >-
          !cancelled() && github.ref == 'refs/heads/master'
          && steps.box-references.outputs.cache-hit != 'true'
        run: >-
          scripts/prune-reference-cache.sh target/cache/ref-classes 7
          ${{ steps.box-references-seeded.outcome == 'success' && 'target/ref-classes-seeded' || '' }}
      # Also after a failed or timed-out run: each entry is published whole (an OK or FAILED marker
      # renamed into place) and only for a complete compile, so what a cut-short run saves is exact.
      # A cold cache takes longer than the lane's deadline on the slower runners; saving only on
      # success left it cold for every queue run.
      - name: save kotlinc box references (${{ matrix.version }})
        if: >-
          !cancelled() && github.ref == 'refs/heads/master'
          && steps.box-references.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/ref-classes
          key: ${{ env.BOX_REFERENCES }}-${{ github.sha }}
      - name: save recorded kotlinc bytes (${{ matrix.version }})
        if: matrix.target == 'jvm' && steps.recorded-mode.outputs.write == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/class-dumps
          key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ github.sha }}
      - name: upload pct
        if: always() && matrix.target == 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pct-${{ matrix.version }}
          path: pct.txt
          if-no-files-found: error
      - name: upload JVM byte equality
        if: always() && matrix.target == 'jvm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-byte-equality-${{ matrix.version }}
          path: jvm-byte-equality.txt
          if-no-files-found: error
      # Several rows may miss the same kotlinc entry in one run; the first save wins and the
      # others only warn that the key exists.
      - name: save kotlinc ${{ matrix.version }}
        if: github.ref == 'refs/heads/master' && steps.kotlinc.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ matrix.version }}
          key: ${{ steps.kotlinc.outputs.cache-primary-key }}
      - name: save serialization and KSP conformance inputs (${{ matrix.version }})
        if: matrix.target == 'jvm' && github.ref == 'refs/heads/master' && steps.conformance-inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cache/plugin-corpus/*/${{ matrix.version }}
            target/cache/ksp-toolchain
            target/cache/krusty-deps
          key: ${{ steps.conformance-inputs.outputs.cache-primary-key }}
      - name: save plugin jars (${{ matrix.version }})
        if: matrix.target == 'jvm' && github.ref == 'refs/heads/master' && steps.plugin-jars.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: ${{ steps.plugin-jars.outputs.cache-primary-key }}
      - name: save Wasm target KLIB dependencies (${{ matrix.version }})
        if: startsWith(matrix.target, 'wasm-') && github.ref == 'refs/heads/master' && steps.wasm-klibs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/krusty-deps
          key: ${{ steps.wasm-klibs.outputs.cache-primary-key }}
      - name: save Kotlin/Native ${{ matrix.version }}
        if: matrix.target == 'native' && github.ref == 'refs/heads/master' && steps.kotlin-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlin-native/${{ matrix.version }}
          key: ${{ steps.kotlin-native.outputs.cache-primary-key }}
      - *save-maven-deps
      - *save-maven-deps-entry
      - name: save box corpus (${{ matrix.version }})
        if: github.ref == 'refs/heads/master' && steps.box-corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/box-corpus/${{ matrix.version }}
          key: ${{ steps.box-corpus.outputs.cache-primary-key }}
      - name: upload failed program evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-failures-${{ matrix.version }}-${{ matrix.target }}
          path: test-failures/
          if-no-files-found: ignore
      - name: runner profile
        if: always()
        run: scripts/runner-profile.sh report "$RUNNER_TEMP/runner-profile"


  # The one check a ruleset requires: its context does not change with either matrix. A required
  # check that is skipped counts as passing, so this job is always scheduled and fails itself unless
  # core CI, the conformance matrix (including KLIB semantics), the plugin build, and the
  # complete Gradle matrix succeeded. A failed shared build or version inventory skips a consumer,
  # which fails this aggregate too.
  ci-and-conformance:
    name: ci-and-conformance
    needs: [ci, lint, plugin-host, e2e, conformance, build-gradle-plugin, gradle, maven, build-tools, analysis-api, bazel]
    if: always()
    runs-on: [self-hosted, utility]
    steps:
      - name: require every merge gate to succeed
        env:
          CI_RESULT: ${{ needs.ci.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          PLUGIN_HOST_RESULT: ${{ needs.plugin-host.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          GRADLE_PLUGIN_RESULT: ${{ needs.build-gradle-plugin.result }}
          GRADLE_RESULT: ${{ needs.gradle.result }}
          MAVEN_RESULT: ${{ needs.maven.result }}
          BUILD_TOOLS_RESULT: ${{ needs.build-tools.result }}
          ANALYSIS_API_RESULT: ${{ needs.analysis-api.result }}
          BAZEL_RESULT: ${{ needs.bazel.result }}
        run: |
          echo "ci: $CI_RESULT"
          echo "lint: $LINT_RESULT"
          echo "plugin-host: $PLUGIN_HOST_RESULT"
          echo "e2e: $E2E_RESULT"
          echo "conformance: $CONFORMANCE_RESULT"
          echo "build-gradle-plugin: $GRADLE_PLUGIN_RESULT"
          echo "gradle: $GRADLE_RESULT"
          echo "maven: $MAVEN_RESULT"
          echo "build-tools: $BUILD_TOOLS_RESULT"
          echo "analysis-api: $ANALYSIS_API_RESULT"
          echo "bazel: $BAZEL_RESULT"
          if [ "$CI_RESULT" != success ] \
            || [ "$LINT_RESULT" != success ] \
            || [ "$PLUGIN_HOST_RESULT" != success ] \
            || [ "$E2E_RESULT" != success ] \
            || [ "$CONFORMANCE_RESULT" != success ] \
            || [ "$GRADLE_PLUGIN_RESULT" != success ] \
            || [ "$GRADLE_RESULT" != success ] \
            || [ "$MAVEN_RESULT" != success ] \
            || [ "$BUILD_TOOLS_RESULT" != success ] \
            || [ "$ANALYSIS_API_RESULT" != success ] \
            || [ "$BAZEL_RESULT" != success ]; then
            echo "lint, plugin host tests, the own test suites (including KLIB implementation coverage), e2e, conformance (including KLIB semantics), every Gradle gate, the Maven goal, every build-tools lane, the Analysis API session provider, and every Bazel lane must succeed" >&2
            exit 1
          fi

  # Build the release bytes once. The compatibility matrix below consumes this Maven repository;
  # it never rebuilds the plugin from the checkout.
  build-gradle-plugin:
    # GitHub-hosted: a one- or two-minute producer that the gradle matrix waits for; in the
    # self-hosted queue it waited hours (2026-11-04), holding the whole run open.
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on || '{}')['build-gradle-plugin'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - name: select the Gradle user home
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/krusty-gradle-user-home" >> "$GITHUB_ENV"
      - &setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # No Actions cache of the Gradle user home: every job downloads through the package cache.
          cache-disabled: true
      # Maven Central and the Gradle Plugin Portal through Infragnite's package cache
      # (maven.infragnite.dev): an init script in GRADLE_USER_HOME, so set that first.
      - &package-cache
        name: send Gradle's downloads through the package cache
        uses: infragnite/package-cache-action@3301abc273091e9b02fb391abdfd3a887a18ef4f # main
      - name: build portable local-Maven distribution
        run: |
          set -euo pipefail
          version=$(just version)
          scripts/package-gradle-plugin.sh "$version" "$PWD/dist-gradle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-gradle-plugin
          path: |
            dist-gradle/*.jar
            dist-gradle/*.zip
            dist-gradle/*-SHA256SUMS
          if-no-files-found: error

  # Build, test and package the Kotlin Build Tools API implementation once per exact supported
  # Kotlin version, driving the shared krusty binary. Release publishes these bytes unchanged.
  build-tools:
    name: build-tools (${{ matrix.kotlin }})
    needs: [build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
    runs-on: ${{ fromJSON(needs.build-tool-bins.outputs.runs-on || '{}')['build-tools'][matrix.kotlin] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - name: select the Gradle user home
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/krusty-gradle-user-home" >> "$GITHUB_ENV"
      - *setup-gradle
      # No Actions cache: each row downloads its dependencies through the package cache, which
      # answers the rows side by side, and its TestKit build shares this Gradle user home.
      - *package-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - name: build, test and package for Kotlin ${{ matrix.kotlin }}
        run: |
          set -euo pipefail
          chmod +x krusty
          scripts/package-build-tools.sh "$(just version)" "${{ matrix.kotlin }}" "$PWD/krusty" "$PWD/dist-build-tools"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-build-tools-kotlin-${{ matrix.kotlin }}
          path: dist-build-tools/*
          if-no-files-found: error

  # krusty's Analysis API session provider (tools/krusty-analysis-api) against the Analysis API that
  # KSP2 ships. It needs no krusty binary yet: the provider refuses every query.
  analysis-api:
    runs-on: ${{ fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - name: select the Gradle user home
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/krusty-gradle-user-home" >> "$GITHUB_ENV"
      - *setup-gradle
      - *package-cache
      - name: test the session provider
        run: tools/krusty-analysis-api/gradlew --no-daemon -p tools/krusty-analysis-api test

  # Execute the exact release bytes against every supported Kotlin Gradle plugin.
  gradle:
    needs: [build-tool-bins, build-gradle-plugin]
    strategy:
      fail-fast: false
      matrix:
        # Every release in the kotlin-versions manifest runs the full suite on the newest validated
        # Gradle. The row below adds the older maintained Gradle, which runs the boundary suite: the
        # builds whose Gradle API surface differs by Gradle release (task wiring, the configuration
        # and build caches, kotlin-dsl's embedded compiler, kapt, KSP, multiplatform and the verify
        # report). Every other test exercises the plugin and KGP, which the full lanes cover.
        kotlin: ${{ fromJson(needs.build-tool-bins.outputs.matrix) }}
        gradle: [9.9.2]
        suite: [full]
        include:
          # Gradle maintains only the latest minor of the current major and of the previous one:
          # 9.9 and 8.14. Each lane runs that line's latest patch.
          - { kotlin: 2.4.21, gradle: 8.14.8, suite: boundary }
    runs-on: ${{ fromJSON(needs.build-tool-bins.outputs.runs-on || '{}')['gradle'][format('{0}|{1}|{2}', matrix.kotlin, matrix.gradle, matrix.suite)] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    # A lane takes under 10 minutes; one stuck on its runner (a download that never finished) ran for
    # hours, holding the batch that waits on it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      - name: select Android integration requirements
        id: android
        run: |
          if printf '9.6.0\n%s\n' "${{ matrix.gradle }}" | sort -V -C; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      # The SDK is installed into a directory of this job alone, but its contents depend only on the
      # packages below. actions/cache versions an entry by its path, so the cache lives at one fixed
      # path and is copied into the job's directory, where setup-android then downloads nothing.
      # Saved by a master run once the install has filled it, like every cache here.
      - name: restore the Android integration SDK
        id: android-sdk
        if: steps.android.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/krusty-android-sdk
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-platforms-android-36
      - name: seed the job's Android SDK from the cache
        if: steps.android.outputs.enabled == 'true' && steps.android-sdk.outputs.cache-hit == 'true'
        env:
          SDK_CACHE: ${{ runner.temp }}/krusty-android-sdk
          SDK_DIR: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/sdk
        run: |
          mkdir -p "$SDK_DIR"
          cp -a "$SDK_CACHE/." "$SDK_DIR/"
      - name: provision the Android integration SDK
        if: steps.android.outputs.enabled == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # SDK installation and downloader state belong to one matrix job, including reruns.
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/sdk
          ANDROID_HOME: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/sdk
          ANDROID_USER_HOME: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/user
        with:
          packages: 'platforms;android-36'
      - name: stage the Android SDK at the cache path
        if: steps.android.outputs.enabled == 'true' && github.ref == 'refs/heads/master' && steps.android-sdk.outputs.cache-hit != 'true'
        env:
          SDK_CACHE: ${{ runner.temp }}/krusty-android-sdk
          SDK_DIR: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/sdk
        run: |
          rm -rf "$SDK_CACHE"
          mkdir -p "$SDK_CACHE"
          cp -a "$SDK_DIR/." "$SDK_CACHE/"
      - name: save the Android integration SDK
        if: steps.android.outputs.enabled == 'true' && github.ref == 'refs/heads/master' && steps.android-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/krusty-android-sdk
          key: ${{ steps.android-sdk.outputs.cache-primary-key }}
      # Our runners' image holds each Gradle the matrix runs in the tool cache. setup-gradle installs a
      # gradle-version itself (and asks services.gradle.org first) unless it is the gradle on PATH, and
      # those downloads failed lanes with 504s and timeouts.
      - name: look for an installed Gradle
        id: gradle-on-path
        shell: bash
        env:
          GRADLE_ENTRY: ${{ runner.tool_cache }}/gradle/${{ matrix.gradle }}/${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        run: |
          if [ -f "$GRADLE_ENTRY.complete" ] && [ -x "$GRADLE_ENTRY/bin/gradle" ]; then
            echo "$GRADLE_ENTRY/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # The nested fixture builds share one isolated Gradle user home, outside the checkout.
      - name: select the integration Gradle user home
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/krusty-gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ steps.gradle-on-path.outputs.found != 'true' && matrix.gradle || '' }}
          # No Actions cache of the Gradle user home: every job downloads through the package cache.
          cache-disabled: true
      - *package-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krusty-gradle-plugin
          path: dist-gradle
      - name: verify and unpack the tested Gradle plugin distribution
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist-gradle && sha256sum -c "krusty-gradle-plugin-$version-SHA256SUMS")
          unzip -q "dist-gradle/krusty-gradle-plugin-$version.zip" -d dist-gradle/unpacked
          echo "KRUSTY_GRADLE_PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "KRUSTY_GRADLE_PLUGIN_PROJECT=$PWD/dist-gradle/unpacked/krusty-gradle-plugin-$version" >> "$GITHUB_ENV"
      - name: run Gradle ${{ matrix.gradle }} integration with Kotlin ${{ matrix.kotlin }}
        env:
          # setup-android exports both SDK aliases; retain its isolated user state here too.
          ANDROID_USER_HOME: ${{ runner.temp }}/krusty-android/${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/user
          KRUSTY_GRADLE_TEST_BIN: ${{ github.workspace }}/krusty
          KRUSTY_GRADLE_KGP_VERSION: ${{ matrix.kotlin }}
          KRUSTY_GRADLE_VERSION: ${{ matrix.gradle }}
          # Keep Gradle's mutable Kotlin DSL workspace out of the checkout. A later archive of the
          # workspace must not retain a script directory without its metadata.bin.
          KRUSTY_GRADLE_USER_HOME: ${{ env.GRADLE_USER_HOME }}
        run: |
          chmod +x krusty krusty-build-tests
          tests="kotlin_compiler_slice_compiles_through_krusty kotlin_dsl_build_src_compiles_through_krusty"
          tests="$tests kapt_project_compiles_through_krusty multiplatform_jvm_compiles_through_krusty"
          tests="$tests verify_task_reports_krusty_against_kotlinc verify_task_reports_kotlin_dsl_compiles_after_kotlinc_compiles_them"
          tests="$tests ksp2_generated_sources_compile_through_krusty"
          if [ "${{ matrix.suite }}" = full ]; then
            tests="$tests serialization_plugin_compiles_through_krusty verify_task_reports_only_the_current_invocation"
            tests="$tests verify_task_reports_an_unsupported_kotlin_gradle_plugin verify_task_reports_projects_that_each_load_the_plugin"
            tests="$tests verify_task_reports_a_kotlin_gradle_plugin_older_than_the_plugin_api"
            tests="$tests body_only_dependency_edit_keeps_dependent_compile_up_to_date"
            tests="$tests oss_corpus_init_script_applies_the_packaged_plugin"
            tests="$tests compose_refusal_is_handed_to_kotlinc_with_its_classes"
          fi
          # The SDK setup uses the same Gradle compatibility decision as the test inventory.
          if [ "${{ steps.android.outputs.enabled }}" = true ]; then
            tests="$tests android_variants_compile_through_krusty"
            tests="$tests android_compose_app_is_compiled_by_krusty_with_a_handoff_for_what_it_refuses"
          fi
          KRUSTY_GRADLE_BIN=$(command -v gradle) \
            ./krusty-build-tests --ignored $tests

  # Build the Maven plugin's release bytes once: a portable local Maven repository the release
  # publishes and the job below consumes.
  build-maven-plugin:
    # GitHub-hosted: a one- or two-minute producer that the maven matrix waits for; in the
    # self-hosted queue it waited hours (2026-11-04), holding the whole run open.
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on || '{}')['build-maven-plugin'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
          cache: maven
          cache-dependency-path: tools/krusty-maven/pom.xml
      - *restore-maven
      - *install-maven
      # Maven Central through the package cache: a mirror added to ~/.m2/settings.xml, so after
      # setup-java, which rewrites that file.
      - &package-cache-maven
        name: send Maven's downloads through the package cache
        uses: infragnite/package-cache-action@3301abc273091e9b02fb391abdfd3a887a18ef4f # main
        with:
          gradle: 'false'
          maven: 'true'
      - name: build portable local-Maven distribution
        run: |
          set -euo pipefail
          version=$(just version)
          scripts/package-maven-plugin.sh "$version" "$PWD/dist-maven"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-maven-plugin
          path: |
            dist-maven/*.jar
            dist-maven/*.zip
            dist-maven/*-SHA256SUMS
          if-no-files-found: error

  # Run the Maven plugin's verify goal from the packaged release repository against
  # kotlin-maven-plugin builds, with the shared krusty binary.
  maven:
    needs: [build-tool-bins, build-maven-plugin]
    runs-on: ${{ fromJSON(needs.build-tool-bins.outputs.runs-on || '{}')['maven'] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    permissions:
      contents: read
      # The package-cache step exchanges the job's GitHub OIDC token for a cache token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *just-on-path
      - *install-just
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
          cache: maven
          cache-dependency-path: tools/krusty-maven/pom.xml
      - *restore-maven
      - *install-maven
      - *package-cache-maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krusty-maven-plugin
          path: dist-maven
      - name: verify and unpack the tested Maven plugin distribution
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist-maven && sha256sum -c "krusty-maven-plugin-$version-SHA256SUMS")
          unzip -q "dist-maven/krusty-maven-plugin-$version.zip" -d dist-maven/unpacked
          echo "KRUSTY_MAVEN_PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "KRUSTY_MAVEN_PLUGIN_REPOSITORY=$PWD/dist-maven/unpacked/krusty-maven-plugin-$version/repository" >> "$GITHUB_ENV"
      - name: run the Maven verify goal
        env:
          KRUSTY_MAVEN_TEST_BIN: ${{ github.workspace }}/krusty
        run: |
          chmod +x krusty krusty-build-tests
          ./krusty-build-tests --ignored maven_verify_goal_ --test-threads=1

  # Build Kotlin with the Bazel module the release would publish, as a consumer depends on it,
  # with the toolchain's compiler and an override, in action and worker mode.
  bazel:
    needs: [build-tool-bins]
    strategy:
      fail-fast: false
      matrix:
        bazel: [8.4.2, 9.3.1]
    runs-on: ${{ fromJSON(needs.build-tool-bins.outputs.runs-on || '{}')['bazel'][matrix.bazel] || fromJSON('["self-hosted", "rust-4c-8gb"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - *just-on-path
      - *install-just
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-bins
      # The smoke test generates the registry with the site's Node.js script; the self-hosted image
      # has no Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The smoke test consumes the reference release's own kotlin-stdlib.jar from the kotlinc
      # distribution the other jobs cache; Maven Central refused the jar to GitHub-hosted runners
      # (HTTP 404 on every retry for minutes) while it stayed published.
      - name: select the maximum Kotlin version
        id: max-version
        run: echo "version=$(just max-version)" >> "$GITHUB_OUTPUT"
      - name: restore kotlinc ${{ steps.max-version.outputs.version }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/kotlinc/${{ steps.max-version.outputs.version }}
          key: kotlinc-${{ steps.max-version.outputs.version }}
      # ubuntu-latest has Bazelisk installed as `bazel`; the self-hosted image installs it as
      # `bazelisk`.
      - name: put bazelisk on PATH as bazel
        run: |
          set -euo pipefail
          if ! command -v bazel >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$(command -v bazelisk)" "$RUNNER_TEMP/bin/bazel"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      # Bazelisk's downloads and the repository cache (the BCR modules the consumer resolves) are
      # kept by setup-bazel, which saves them from a master run only. It keys the Bazelisk cache on
      # .bazelversion, so the matrix's Bazel is written there, and the repository cache on the smoke
      # script because it writes the consumer's MODULE.bazel.
      - name: record the Bazel version for the Bazelisk cache key
        run: echo '${{ matrix.bazel }}' > .bazelversion
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          repository-cache: scripts/bazel-smoke.sh
          cache-save: ${{ github.ref == 'refs/heads/master' }}
      - name: build the packaged Bazel module with Bazel ${{ matrix.bazel }}
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: |
          set -euo pipefail
          chmod +x krusty
          kotlinc=$(just kotlinc "${{ steps.max-version.outputs.version }}")
          scripts/bazel-smoke.sh "$PWD/krusty" "$(dirname "$kotlinc")/../lib/kotlin-stdlib.jar"

  # A release is started by hand (`release` input) or by the daily schedule on a master commit and
  # builds its own immutable artifacts there, even after master advances. All six platforms build
  # concurrently on their hosted runners; the queue's own master runs leave them out.
  build-release:
    needs: [ci-and-conformance]
    if: github.ref == 'refs/heads/master' && (inputs.release || github.event_name == 'schedule')
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { triple: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { triple: aarch64-apple-darwin,      os: macos-15 }
          - { triple: x86_64-apple-darwin,       os: macos-15-intel }
          - { triple: x86_64-pc-windows-msvc,   os: windows-latest }
          - { triple: aarch64-pc-windows-msvc,  os: windows-11-arm }
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target.triple }}
      - *just-on-path
      - *install-just
      - name: install aarch64-linux linker
        if: matrix.target.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      # build.rs cross-compiles the native runtime for every Linux target, riscv64 included. Apple's
      # clang ships without the RISC-V backend, so macOS builds use Homebrew's LLVM clang instead.
      # The major is pinned, not Homebrew's moving `llvm`: the runner images already ship llvm@18,
      # the clang the Linux runners use too.
      - name: select LLVM clang for the native runtime
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! brew list --versions llvm@18 >/dev/null; then
            brew install llvm@18
          fi
          clang="$(brew --prefix llvm@18)/bin/clang"
          test -x "$clang"
          "$clang" --print-targets | grep -q riscv64
          echo "KRUSTY_RUNTIME_CC=$clang" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        env:
          CARGO_TERM_VERBOSE: 'true'
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          node scripts/release-build-progress.cjs &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true; wait "$progress_pid" 2>/dev/null || true' EXIT
          time just build-release "${{ matrix.target.triple }}"
      - name: upload release build timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-timings-${{ matrix.target.triple }}
          path: target/cargo-timings/
          if-no-files-found: warn
      - name: package compiler
        id: compiler_pkg
        shell: bash
        run: echo "path=$(just package "${{ matrix.target.triple }}")" >> "$GITHUB_OUTPUT"
      - name: package language server
        id: lsp_pkg
        shell: bash
        run: echo "path=$(just package "${{ matrix.target.triple }}" krusty-lsp)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krusty-${{ matrix.target.triple }}
          path: |
            ${{ steps.compiler_pkg.outputs.path }}
            ${{ steps.lsp_pkg.outputs.path }}
          if-no-files-found: error

  release:
    needs: [ci, lint, plugin-host, e2e, conformance, build-gradle-plugin, gradle, build-maven-plugin, maven, build-tools, bazel, build-tool-bins, build-release]
    if: github.ref == 'refs/heads/master'
    # Publication runs Gradle to build and sign Maven Central and Plugin Portal artifacts.
    runs-on: [self-hosted, rust-4c-8gb]
    # Shorter than either lock's TTL; only dead jobs' locks may be taken over.
    timeout-minutes: 25
    # The publishing secrets live in this environment, which only master may deploy to, so a
    # branch that edits this workflow cannot read them.
    environment: release
    permissions:
      contents: write
      # Dispatches the pages workflow, which regenerates the Bazel registry.
      actions: write
      # Sign and store the build provenance attestations of the release files.
      id-token: write
      attestations: write
    steps:
      # No persisted token: the Gradle builds below run third-party code next to the signing key.
      # Only the steps that push get the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit history only: the build number counts commits and lint reads their
          # messages, but no step needs old trees or blobs (a clone took 33 s full, 6 s without).
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      # Every validated master ancestor publishes. Only retries of this exact commit wait on
      # this lock; slow immutable package publication cannot hold the global latest/badge lock.
      - name: take the commit publication lock
        id: lock
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock=$(scripts/release-publisher.sh acquire)
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: publish this validated master commit
        id: tip
        run: scripts/release-publisher.sh check >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.tip.outputs.publish == 'true'
        with:
          tool: just
      - name: collect all target artifacts
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: krusty-*
          path: dist
          merge-multiple: true
      - name: verify Gradle plugin release assets
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist && sha256sum -c "krusty-gradle-plugin-$version-SHA256SUMS")
      - name: verify Maven plugin release assets
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version=$(just version)
          (cd dist && sha256sum -c "krusty-maven-plugin-$version-SHA256SUMS")
      - name: verify Build Tools API implementation release assets
        if: steps.tip.outputs.publish == 'true'
        env:
          KOTLIN_VERSIONS: ${{ needs.build-tool-bins.outputs.matrix }}
        run: |
          set -euo pipefail
          version=$(just version)
          for kotlin in $(jq -r '.[]' <<<"$KOTLIN_VERSIONS"); do
            (cd dist && sha256sum -c "krusty-build-tools-$version-kotlin-$kotlin-SHA256SUMS")
          done
      - name: compute version + tag
        if: steps.tip.outputs.publish == 'true'
        id: v
        run: |
          ver=$(just version)
          echo "ver=$ver"  >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      # The Gradle plugin downloads its release's compiler and checks it against this file, which it
      # trusts only through the signature beside it: by a subkey that the maintainer's root key
      # (bundled in the plugin) binds, published as krusty-<ver>-signing-key.asc.
      - name: checksum the compiler archives
        if: steps.tip.outputs.publish == 'true'
        run: |
          set -euo pipefail
          ver=${{ steps.v.outputs.ver }}
          (cd dist && sha256sum krusty-"$ver"-*.tar.gz krusty-"$ver"-*.zip > "krusty-$ver-SHA256SUMS")
          test "$(wc -l < "dist/krusty-$ver-SHA256SUMS")" -eq 6
      - name: sign the compiler checksums
        if: steps.tip.outputs.publish == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: scripts/sign-release-checksums.sh "${{ steps.v.outputs.ver }}" dist
      - name: package Zed extension
        if: steps.tip.outputs.publish == 'true'
        shell: bash
        run: just package-zed
      # The Bazel module of this release, naming the SHA-256 of each compiler archive above.
      - name: package Bazel module
        if: steps.tip.outputs.publish == 'true'
        run: scripts/package-bazel-module.sh "${{ steps.v.outputs.ver }}" dist
      # The validated max-version reports travel with each immutable release.
      - name: download max-version pct
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pct-${{ needs.build-tool-bins.outputs.max }}
      - name: download max-version JVM byte equality
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jvm-byte-equality-${{ needs.build-tool-bins.outputs.max }}
      - name: download max-version Native conformance
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-pct-${{ needs.build-tool-bins.outputs.max }}
      - name: package release badge data
        if: steps.tip.outputs.publish == 'true'
        env:
          MAX_VERSION: ${{ needs.build-tool-bins.outputs.max }}
        run: bash scripts/package-release-badges.sh "$MAX_VERSION" . dist
      # SLSA build provenance for every published file, so `gh attestation verify <file> -R qnox/krusty`
      # ties it to this workflow run and commit.
      - name: attest build provenance
        if: steps.tip.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**
      # A tag is immutably bound before publication, including retries after a rewritten history.
      # Drafts may resume incomplete uploads; a public release's assets are never replaced.
      - name: publish
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # bind-tag pushes the immutable tag; the checkout no longer authenticates Git.
          RELEASE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -euo pipefail
          scripts/release-publisher.sh bind-tag "$TAG"
          mapfile -t assets < <(find dist -type f | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            case $draft in
              true)
                gh release upload "$TAG" --clobber "${assets[@]}"
                gh release edit "$TAG" --draft=false --latest=false
                ;;
              false) ;;
              *) echo "cannot determine draft state of $TAG" >&2; exit 1 ;;
            esac
          else
            notes_file="$RUNNER_TEMP/krusty-release-notes.md"
            trap 'rm -f "$notes_file"' EXIT
            gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" |
              python3 scripts/format-release-notes.py > "$notes_file"
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --latest=false \
              --title "krusty $VER: Kotlin compiler written in Rust" --notes-file "$notes_file" "${assets[@]}"
            gh release edit "$TAG" --draft=false --latest=false
          fi
      # Each exact version keeps its existing Maven Central deployment journal. The Plugin Portal
      # also checks its immutable marker before retrying a previously successful upload.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.tip.outputs.publish == 'true'
        with:
          distribution: zulu
          java-version: '17.0.21+0.3.1'
      # No setup-gradle here: it injects an init script into every Gradle build, and these builds
      # hold the signing key and publishing credentials. The lint job validates the wrapper jar,
      # whose properties pin the distribution's checksum.
      # The maintainer's krusty signing subkey (`gpg --armor --export-secret-subkeys <id>!`) signs
      # every published artifact. SIGNING_KEY_ID, its 8-hex-digit short id, is optional: without
      # it the id is read from the key itself.
      - name: signing key id
        id: signing
        if: steps.tip.outputs.publish == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEY_ID" ]]; then
            id=$SIGNING_KEY_ID
          elif [[ -n "$SIGNING_KEY" ]]; then
            # A pipe, not a here-string, which an older bash backs with a temporary file.
            id=$(printf '%s\n' "$SIGNING_KEY" | scripts/signing-key-id.sh)
          else
            id=
          fi
          echo "signing key: ${id:-none}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: make the public signing subkey retrievable for Maven Central
        if: steps.tip.outputs.publish == 'true'
        run: scripts/publish-release-signing-key.sh "${{ steps.v.outputs.ver }}" dist
      # Maven Central goes first: it skips a version it already has, so a rerun after a failed
      # Plugin Portal upload does not trip over Central's immutable versions.
      - name: publish the Gradle plugin to Maven Central
        if: steps.tip.outputs.publish == 'true'
        env:
          # Records the upload in refs/krusty/central/<version>; the checkout no longer
          # authenticates Git. The script keeps it from the Gradle build.
          RELEASE_TOKEN: ${{ github.token }}
          # A Central Portal user token for the verified dev.krustythecompiler namespace.
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ steps.signing.outputs.id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_CENTRAL_USERNAME" || -z "$MAVEN_CENTRAL_PASSWORD" ]]; then
            echo "MAVEN_CENTRAL_USERNAME/MAVEN_CENTRAL_PASSWORD are not set; skipping Maven Central"
            exit 0
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo "SIGNING_KEY is not set; refusing to publish an unsigned plugin" >&2
            exit 1
          fi
          scripts/publish-maven-central.sh "${{ steps.v.outputs.ver }}"
      - name: publish the Gradle plugin to the Gradle Plugin Portal
        if: steps.tip.outputs.publish == 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ steps.signing.outputs.id }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$GRADLE_PUBLISH_KEY" || -z "$GRADLE_PUBLISH_SECRET" ]]; then
            echo "GRADLE_PUBLISH_KEY/GRADLE_PUBLISH_SECRET are not set; skipping the Plugin Portal"
            exit 0
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo "SIGNING_KEY is not set; refusing to publish an unsigned plugin" >&2
            exit 1
          fi
          scripts/publish-gradle-plugin-portal.sh "${{ steps.v.outputs.ver }}"
      # Rebuild the site, whose Bazel registry is generated from the releases, so it lists this one.
      - name: refresh the Bazel registry
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
      # The global lock is held only while promoting latest and the released ref.
      - name: take the latest promotion lock
        if: steps.tip.outputs.publish == 'true'
        id: latest_lock
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock=$(scripts/release-publisher.sh acquire-latest)
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: select monotonic latest promotion
        if: steps.tip.outputs.publish == 'true'
        id: latest
        run: scripts/release-publisher.sh check-promotion >> "$GITHUB_OUTPUT"
      # Advance the monotonic guard before external updates. If a later update fails, this same
      # SHA may retry; an older publisher can never overwrite it after the lock is released.
      - name: record the promoted commit
        if: steps.latest.outputs.promote == 'true'
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: scripts/release-publisher.sh record
      - name: promote the GitHub release
        if: steps.latest.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release edit "$TAG" --latest
      - name: drop the latest promotion lock
        if: always() && steps.latest_lock.outputs.lock != ''
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: scripts/release-publisher.sh release-latest "${{ steps.latest_lock.outputs.lock }}"
      - name: drop the release lock
        if: always() && steps.lock.outputs.lock != ''
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: scripts/release-publisher.sh release "${{ steps.lock.outputs.lock }}"
