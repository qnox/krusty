name: 3300 authenticated delegate implementation validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3300-delegate-property-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-tool-bins
          save-if: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: find installed just
        id: just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: install just
        if: steps.just.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: checkout exact reviewed product source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          workflow_commit=$(git rev-parse HEAD)
          source_pin=27f6ed9dfcf3f76a65e4d6c115d660350c13caff
          git fetch origin "$source_pin"
          git checkout --detach "$source_pin"
          test "$(git rev-parse HEAD)" = "$source_pin"
          printf '%s\n' "$workflow_commit" > evidence/validation-workflow-commit.txt
          printf '%s\n' "$source_pin" > evidence/source-commit.txt
          git rev-parse HEAD > evidence/product-commit.txt
          sha256sum \
            tests/box_regressions/delegatePropertyNameCapability.kt \
            tests/box_regressions/libraryDelegatesNotNullDispatch.kt \
            tests/box_regressions/libraryObjectMembers.kt \
            tests/box_regressions/multimodule/genericElvisNullProof.kt \
            > evidence/owned-fixtures.sha256
      - name: provision pinned Kotlin and target inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          echo "KRUSTY_RUNTIME_CC=$(command -v clang)" >> "$GITHUB_ENV"
          echo "KRUSTY_LANGUAGE_VERSION=2.4.0" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLINC=$(just kotlinc 2.4.0)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_NATIVE=$(just kotlin-native 2.4.0)" >> "$GITHUB_ENV"
          echo "KRUSTY_KOTLIN_BOX_DIR=$(just box-corpus 2.4.0)" >> "$GITHUB_ENV"
          echo "KRUSTY_DEPS_CACHE=$GITHUB_WORKSPACE/target/cache/krusty-deps" >> "$GITHUB_ENV"
          for fixture in \
            delegatedProperty/delegateWithPrivateSet.kt \
            delegatedProperty/local/kt13557.kt \
            delegatedProperty/local/kt19690.kt \
            delegatedProperty/local/kt23117.kt \
            delegatedProperty/protectedVarWithPrivateSet.kt; do
            sha256sum "$(just box-corpus 2.4.0)/$fixture"
          done > evidence/upstream-fixtures.sha256
      - name: syntax-check Native runtime with build.rs target flags
        working-directory: crates/krusty-native
        shell: bash
        run: |
          set -euo pipefail
          compiler="${KRUSTY_RUNTIME_CC:-$(command -v clang)}"
          common_flags=(
            -std=c11 -ffreestanding -nostdlib -fno-pic -fno-stack-protector
            -fno-asynchronous-unwind-tables -fno-unwind-tables -ffunction-sections -O2
            -fsyntax-only
          )
          sources=(
            krusty_rt.c krusty_unsigned_arrays.c krusty_collections.c krusty_maps.c
            krusty_classes.c krusty_lang.c krusty_appendable.c krusty_fp.c krusty_gc.c
            krusty_threads.c krusty_start.c krusty_posix_thread.c krusty_posix_io.c
            krusty_posix_net.c krusty_posix_process.c krusty_posix_string.c
          )
          for arch in x86_64 aarch64 riscv64; do
            triple="$arch-unknown-linux-gnu"
            case "$arch" in
              x86_64) arch_flags=(-mcmodel=small -fcf-protection=none) ;;
              aarch64) arch_flags=(-mcmodel=small) ;;
              riscv64) arch_flags=(-mno-relax) ;;
            esac
            for source in "${sources[@]}"; do
              "$compiler" "--target=$triple" "${common_flags[@]}" "${arch_flags[@]}" \
                -I runtime "runtime/$source" >> ../../evidence/c-preflight.log 2>&1 || {
                  cat ../../evidence/c-preflight.log
                  exit 1
                }
            done
          done
          printf 'syntax-checked %s runtime sources for x86_64, aarch64, and riscv64\n' "${#sources[@]}" \
            | tee ../../evidence/c-preflight-summary.txt
      - name: build conformance executable once
        id: build_conformance
        timeout-minutes: 40
        env:
          CARGO_BUILD_JOBS: '1'
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 bash scripts/cargo-test-binary.sh conformance -p krusty --test conformance > evidence/build.log 2>&1
          cat evidence/build.log
          binary="$(tail -n 1 evidence/build.log)"
          test -x "$binary"
          cp "$binary" conformance-bin
          sha256sum conformance-bin > evidence/conformance-binary.sha256
          cp conformance-bin evidence/conformance-bin
      - name: run the previous 14 guards and full delegate fixture on all four lanes
        timeout-minutes: 70
        env:
          KRUSTY_TEST_THREADS: '1'
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: '1'
          KRUSTY_REQUIRE_WASM_JS_CONFORMANCE: '1'
          KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE: '1'
        shell: bash
        run: |
          set -uo pipefail
          result=0
          mkdir -p evidence/native-tmp evidence/native-executables
          python3 -u - evidence/native-tmp evidence/native-executables <<'PY' > evidence/native-executable-watcher.log 2>&1 &
          import os, pathlib, shutil, sys, time
          root, output = map(pathlib.Path, sys.argv[1:])
          copied = set()
          while True:
              for path in root.rglob("*"):
                  try:
                      if not path.is_file() or not os.stat(path).st_mode & 0o111 or path in copied:
                          continue
                      with path.open("rb") as stream:
                          if stream.read(4) != b"\x7fELF":
                              continue
                      destination = output / f"{path.name}.elf"
                      shutil.copy2(path, destination)
                      copied.add(path)
                      print(f"captured {path} -> {destination} bytes={destination.stat().st_size}", flush=True)
                  except FileNotFoundError:
                      pass
              time.sleep(0.01)
          PY
          watcher=$!
          run_case() {
            local lane="$1" fixture="$2" test_name="$3" key="$4" selector
            case "$lane" in
              JVM) selector=KRUSTY_BOX_ONLY ;;
              *) selector="KRUSTY_${lane}_BOX_ONLY" ;;
            esac
            set +e
            env "$selector=$fixture" TMPDIR="$GITHUB_WORKSPACE/evidence/native-tmp" timeout 600 \
              ./conformance-bin --exact "$test_name" --nocapture --test-threads=1 \
              > "evidence/$key.log" 2>&1
            local status=$?
            set -e
            printf '%s\t%s\n' "$key" "$status" | tee -a evidence/status.tsv
            cat "evidence/$key.log"
            if [ "$status" -ne 0 ] || \
              ! grep -q 'test result: ok. 1 passed; 0 failed;' "evidence/$key.log"; then
              result=1
            elif [ "$lane" = JVM ]; then
              if ! grep -q 'cases: 1 .*box()=OK: 1 | FAIL: 0' "evidence/$key.log"; then
                result=1
              fi
            elif ! grep -q 'scanned 1, passed 1' "evidence/$key.log"; then
              result=1
            fi
          }
          native_test=kotlin_box_native_conformance::kotlin_codegen_box_native_conformance
          wasm_js_test=kotlin_box_wasm_conformance::kotlin_codegen_box_wasm_js_conformance
          wasm_wasi_test=kotlin_box_wasm_conformance::kotlin_codegen_box_wasm_wasi_conformance
          jvm_test=kotlin_box_ir_jvm_conformance::kotlin_codegen_box_conformance
          for fixture in \
            delegatedProperty/delegateWithPrivateSet.kt \
            delegatedProperty/local/kt13557.kt \
            delegatedProperty/local/kt19690.kt \
            delegatedProperty/local/kt23117.kt \
            delegatedProperty/protectedVarWithPrivateSet.kt; do
            run_case NATIVE "$fixture" "$native_test" "native-$(basename "$fixture" .kt)"
          done
          for fixture in libraryDelegatesNotNullDispatch.kt libraryObjectMembers.kt multimodule/genericElvisNullProof.kt; do
            run_case NATIVE "$fixture" "$native_test" "native-$(basename "$fixture" .kt)"
          done
          for lane in WASM_JS WASM_WASI; do
            if [ "$lane" = WASM_JS ]; then test_name="$wasm_js_test"; else test_name="$wasm_wasi_test"; fi
            for fixture in libraryDelegatesNotNullDispatch.kt libraryObjectMembers.kt multimodule/genericElvisNullProof.kt; do
              run_case "$lane" "$fixture" "$test_name" "${lane,,}-$(basename "$fixture" .kt)"
            done
          done
          for lane_test in "JVM:$jvm_test" "NATIVE:$native_test" "WASM_JS:$wasm_js_test" "WASM_WASI:$wasm_wasi_test"; do
            lane="${lane_test%%:*}"
            test_name="${lane_test#*:}"
            run_case "$lane" delegatePropertyNameCapability.kt "$test_name" "${lane,,}-delegatePropertyNameCapability"
          done
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          find evidence/native-tmp -type f -name 'core*' -print > evidence/core-files.txt
          find evidence/native-executables -type f -name '*.elf' -print0 | sort -z | xargs -0 -r sha256sum > evidence/native-executables.sha256
          exit "$result"
      - name: run the dedicated Native KLIB module harness
        if: ${{ always() && steps.build_conformance.outcome == 'success' }}
        timeout-minutes: 10
        env:
          KRUSTY_REQUIRE_NATIVE_CONFORMANCE: '1'
        shell: bash
        run: |
          set +e
          mkdir -p evidence/native-tmp evidence/native-executables
          python3 -u - evidence/native-tmp evidence/native-executables <<'PY' > evidence/native-klib-watcher.log 2>&1 &
          import os, pathlib, shutil, sys, time
          root, output = map(pathlib.Path, sys.argv[1:])
          copied = set()
          while True:
              for path in root.rglob("*"):
                  try:
                      if not path.is_file() or not os.stat(path).st_mode & 0o111 or path in copied:
                          continue
                      with path.open("rb") as stream:
                          if stream.read(4) != b"\x7fELF":
                              continue
                      destination = output / f"{path.name}.elf"
                      shutil.copy2(path, destination)
                      copied.add(path)
                      print(f"captured {path} -> {destination} bytes={destination.stat().st_size}", flush=True)
                  except FileNotFoundError:
                      pass
              time.sleep(0.01)
          PY
          watcher=$!
          TMPDIR="$GITHUB_WORKSPACE/evidence/native-tmp" timeout 600 ./conformance-bin \
            --exact kotlin_box_native_conformance::native_runtime_and_library_delegates_receive_dynamic_property_names \
            --nocapture --test-threads=1 > evidence/native-klib-module-harness.log 2>&1
          status=$?
          printf 'native-klib-module-harness\t%s\n' "$status" | tee -a evidence/status.tsv
          cat evidence/native-klib-module-harness.log
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          find evidence/native-tmp -type f -name 'core*' -print > evidence/core-files.txt
          find evidence/native-executables -type f -name '*.elf' -print0 | sort -z | xargs -0 -r sha256sum > evidence/native-executables.sha256
          test "$status" -eq 0 && grep -q 'test result: ok. 1 passed; 0 failed;' evidence/native-klib-module-harness.log
      - name: upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 3300-authenticated-delegate-implementation
          path: evidence/
          if-no-files-found: error
