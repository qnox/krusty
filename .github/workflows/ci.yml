name: coroutine machine compiler check
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compile:
    runs-on:
    - self-hosted
    - rust-4c-8gb
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: check exact machine source and test compilation
      run: |
        set -euo pipefail
        git diff --exit-code 4be083f18ed2ba85a2e6db7fef315a039f91cd79 HEAD -- . ':!.github/workflows/ci.yml'
        git rev-parse HEAD > compiler-source.txt
        cargo check --profile gate -p krusty --lib --tests 2>&1 | tee machine-check.log
    - name: upload compiler diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: coroutine-machine-compiler-diagnostics
        path: |
          machine-check.log
          compiler-source.txt
        if-no-files-found: error
