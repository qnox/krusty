name: accessor outcome evidence
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-tool-bins:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      max: ${{ steps.versions.outputs.max }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        filter: tree:0
    - name: verify exact implementation source
      run: 'git diff --exit-code 71588a80e5aa779a0c7a0e1696e2a1404582f89b HEAD -- . '':!.github/workflows/ci.yml''

        git rev-parse HEAD > implementation-evidence.txt

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: zulu
        java-version: '17'
    - &id001
      id: just-on-path
      name: look for an installed just
      shell: bash
      run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - &id002
      if: steps.just-on-path.outputs.found != 'true'
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
      with:
        tool: just
    - name: select supported Kotlin versions
      id: versions
      run: 'echo "matrix=$(just matrix-json)" >> "$GITHUB_OUTPUT"

        echo "max=$(just max-version)" >> "$GITHUB_OUTPUT"

        '
    - name: build conformance and compiler binaries
      run: 'set -euo pipefail

        source scripts/phase-timing.sh

        phase_log_prefix=tool-bins

        PHASE_TIMING_LOG="$(mktemp)"

        trap ''phase_report || true'' EXIT

        phase_begin conformance-and-cli

        bin=$(just conformance-bin-and-cli)

        phase_end conformance-and-cli

        cp "$bin" conformance-bin

        cp target/gate/krusty krusty

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: conformance-bin
        path: conformance-bin
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: tool-bins
        path: krusty
        if-no-files-found: error
    timeout-minutes: 120
  conformance:
    name: conformance (${{ matrix.version }}, ${{ matrix.target }})
    needs: build-tool-bins
    strategy:
      fail-fast: false
      matrix:
        version:
        - 2.4.10
        target:
        - native
      max-parallel: 3
    runs-on: ubuntu-latest
    env:
      KRUSTY_BOX_CASE_TIMEOUT_MS: '8000'
      BOX_REFERENCES: box-reference-classes-${{ matrix.target != 'jvm' && format('{0}-', matrix.target) || '' }}${{ matrix.version
        }}
      KRUSTY_TEST_THREADS: '4'
      KRUSTY_DEPS_DEADLINE_SECONDS: '3600'
      KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: base commit
      id: base
      run: 'base=$(git log -1 --format=''%(trailers:key=Merge-Queue-Base,valueonly)'' HEAD | head -n 1)

        echo "sha=${base:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

        '
    - *id001
    - *id002
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: zulu
        java-version: '8

          11

          17

          21

          25

          '
    - name: restore kotlinc ${{ matrix.version }}
      id: kotlinc
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlinc/${{ matrix.version }}
        key: kotlinc-${{ matrix.version }}
    - name: restore serialization and KSP conformance inputs (${{ matrix.version }})
      id: conformance-inputs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: 'target/cache/ser-corpus/${{ matrix.version }}

          target/cache/ksp-toolchain

          target/cache/krusty-deps

          '
        key: kotlin-conformance-inputs-${{ matrix.version }}
    - name: restore Wasm target KLIB dependencies (${{ matrix.version }})
      if: startsWith(matrix.target, 'wasm-')
      id: wasm-klibs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/krusty-deps
        key: wasm-target-klibs-v1-${{ matrix.target }}-${{ matrix.version }}
    - name: restore Kotlin/Native ${{ matrix.version }}
      if: matrix.target == 'native'
      id: kotlin-native
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlin-native/${{ matrix.version }}
        key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}
    - name: restore recorded kotlinc-native bytes
      if: matrix.target == 'native'
      id: native-recordings
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/native-recordings
        key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ steps.base.outputs.sha }}
        restore-keys: 'recorded-kotlinc-native-bytes-${{ matrix.version }}-

          '
    - name: select kotlinc-native recording mode
      if: matrix.target == 'native'
      id: native-recording-mode
      env:
        CACHE_HIT: ${{ steps.native-recordings.outputs.cache-hit }}
        MASTER_PUSH: ${{ github.ref == 'refs/heads/master' }}
      run: "set -euo pipefail\nwrite=0\nif [ \"$MASTER_PUSH\" = true ] && [ \"$CACHE_HIT\" != true ]; then\n  write=1\nfi\n\
        echo \"write=$write\" >> \"$GITHUB_OUTPUT\"\n"
    - name: restore KLIB box reference bytes
      if: matrix.target != 'jvm'
      id: klib-recordings
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/klib-references
        key: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch
          }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ steps.base.outputs.sha }}
        restore-keys: 'box-klib-references-${{ hashFiles(''tests/box_klib_bytes/reference-format'') }}-${{ runner.os }}-${{
          runner.arch }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles(''kotlin-versions'') }}-

          '
    - name: list restored KLIB box reference bytes
      if: matrix.target != 'jvm'
      id: klib-recordings-restored
      run: echo "entries=$(scripts/cache-entries.sh target/cache/klib-references)" >> "$GITHUB_OUTPUT"
    - name: restore box corpus (${{ matrix.version }})
      id: box-corpus
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/box-corpus/${{ matrix.version }}
        key: box-cli-and-generator-corpus-v3-${{ matrix.version }}-${{ hashFiles('kotlin-versions', 'scripts/box_selection.py',
          'tests/box_selection_sources.txt') }}
    - name: forbid corpus fetches after a cache hit (${{ matrix.version }})
      if: steps.box-corpus.outputs.cache-hit == 'true'
      run: echo KRUSTY_BOX_CORPUS_OFFLINE=1 >> "$GITHUB_ENV"
    - name: restore recorded kotlinc bytes (${{ matrix.version }})
      if: matrix.target == 'jvm'
      id: recorded-bytes
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/class-dumps
        key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ steps.base.outputs.sha }}
        restore-keys: 'recorded-kotlinc-bytes-conformance-${{ matrix.version }}-

          '
    - name: select recorded-byte cache mode
      if: matrix.target == 'jvm'
      id: recorded-mode
      env:
        CACHE_HIT: ${{ steps.recorded-bytes.outputs.cache-hit }}
        MASTER_PUSH: ${{ github.ref == 'refs/heads/master' }}
      run: "set -euo pipefail\ncompile_missing=1\nwrite=0\nif [ \"$MASTER_PUSH\" = true ] && [ \"$CACHE_HIT\" != true ]; then\n\
        \  write=1\nfi\necho \"write=$write\" >> \"$GITHUB_OUTPUT\"\necho \"compile_missing=$compile_missing\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: restore kotlinc box references (${{ matrix.version }})
      id: box-references
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/ref-classes
        key: ${{ env.BOX_REFERENCES }}-${{ steps.base.outputs.sha }}
        restore-keys: '${{ env.BOX_REFERENCES }}-

          box-reference-classes-${{ matrix.version }}-

          '
    - name: mark seeded kotlinc box references (${{ matrix.version }})
      id: box-references-seeded
      if: matrix.target != 'jvm' && github.ref == 'refs/heads/master' && !startsWith(steps.box-references.outputs.cache-matched-key,
        format('{0}-', env.BOX_REFERENCES))
      run: mkdir -p target && touch target/ref-classes-seeded
    - name: download conformance binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: conformance-bin
    - name: download compiler binary
      if: matrix.target == 'jvm'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: tool-bins
    - name: run box conformance ${{ matrix.version }}
      if: matrix.target == 'jvm'
      env:
        KRUSTY_CONFORMANCE_TIMEOUT_SECONDS: '3600'
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
        KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
      run: 'set -euo pipefail

        chmod +x conformance-bin krusty

        just conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" jvm-byte-equality.txt > pct.txt

        bash scripts/conformance-badge.sh fields conformance pct.txt "${{ matrix.version }}"

        bash scripts/conformance-badge.sh fields jvm-byte-equality jvm-byte-equality.txt "${{ matrix.version }}"

        '
    - name: provision exact reference atomicfu inputs
      env:
        VERSION: ${{ matrix.version }}
      run: "set -euo pipefail\nmkdir -p \"$KRUSTY_DEPS_CACHE\"\nfor spec in \"org/jetbrains/kotlin kotlin-atomicfu-compiler-plugin-embeddable\
        \ $VERSION\" \"org/jetbrains/kotlinx atomicfu-jvm 0.32.1\"; do\n  read -r group artifact version <<< \"$spec\"\n \
        \ destination=\"$KRUSTY_DEPS_CACHE/$artifact-$version.jar\"\n  if [ ! -s \"$destination\" ]; then\n    curl --fail\
        \ --location --retry 5 --retry-all-errors --connect-timeout 10 --max-time 180 \"https://repo1.maven.org/maven2/$group/$artifact/$version/$artifact-$version.jar\"\
        \ --output \"$destination.pending\"\n    mv \"$destination.pending\" \"$destination\"\n  fi\n  jar tf \"$destination\"\
        \ >/dev/null\ndone\n"
    - name: run native box conformance ${{ matrix.version }}
      if: matrix.target == 'native'
      id: native_box
      continue-on-error: true
      env:
        KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: '3600'
        KRUSTY_NATIVE_BYTE_REPORT: ${{ github.workspace }}/native-byte-equality.txt
        KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/native-recordings
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: '1'
        KRUSTY_CLASS_DUMP_WRITE: ${{ steps.native-recording-mode.outputs.write }}
      run: 'set +e

        (

        chmod +x conformance-bin

        just native-conformance-run "$PWD/conformance-bin" "${{ matrix.version }}" native-pct.txt

        lane_status=$?

        bash scripts/conformance-badge.sh fields native-conformance native-pct.txt "${{ matrix.version }}"


        exit "$lane_status"


        ) 2>&1 | tee complete-lane.log

        status=${PIPESTATUS[0]}

        printf "%s\n" "$status" > complete-lane.exit

        exit "$status"

        '
    - name: run focused Native conformance ${{ matrix.version }}
      if: matrix.target == 'native' && (success() || steps.native_box.outcome == 'failure')
      id: native_focused
      continue-on-error: true
      env:
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/native-recordings
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: '1'
        KRUSTY_CLASS_DUMP_WRITE: ${{ steps.native-recording-mode.outputs.write }}
      run: just native-conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
    - name: upload Native conformance
      if: always() && matrix.target == 'native'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-pct-${{ matrix.version }}
        path: native-pct.txt
        if-no-files-found: error
    - name: save recorded kotlinc-native bytes
      if: matrix.target == 'native' && steps.native-recording-mode.outputs.write == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/native-recordings
        key: recorded-kotlinc-native-bytes-${{ matrix.version }}-${{ github.sha }}
    - name: enforce focused Native conformance ${{ matrix.version }}
      if: matrix.target == 'native' && steps.native_focused.outcome == 'failure'
      run: exit 1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: startsWith(matrix.target, 'wasm-')
      with:
        node-version: '22'
    - name: run wasm box conformance ${{ matrix.version }}
      if: startsWith(matrix.target, 'wasm-')
      env:
        KRUSTY_NATIVE_CONFORMANCE_TIMEOUT_SECONDS: '3600'
        KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        KRUSTY_WASM_JS_BYTE_REPORT: ${{ github.workspace }}/wasm-js-byte-equality.txt
        KRUSTY_WASM_WASI_BYTE_REPORT: ${{ github.workspace }}/wasm-wasi-byte-equality.txt
        KRUSTY_KLIB_REFERENCE_CACHE: ${{ github.workspace }}/target/cache/klib-references
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/klib-references
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: '1'
        KRUSTY_CLASS_DUMP_WRITE: ${{ github.ref == 'refs/heads/master' && steps.klib-recordings.outputs.cache-hit != 'true'
          && '1' || '0' }}
      run: 'set +e

        (

        set -euo pipefail

        chmod +x conformance-bin

        just wasm-conformance-run "${{ matrix.target }}" "$PWD/conformance-bin" "${{ matrix.version }}"


        ) 2>&1 | tee complete-lane.log

        status=${PIPESTATUS[0]}

        printf "%s\n" "$status" > complete-lane.exit

        exit "$status"

        '
      continue-on-error: true
    - name: run focused Wasm conformance ${{ matrix.version }}
      if: matrix.target == 'wasm-js'
      env:
        KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
      run: just wasm-conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
    - name: list new KLIB box reference bytes
      if: always() && matrix.target != 'jvm' && github.ref == 'refs/heads/master'
      id: klib-recordings-added
      env:
        RESTORED: ${{ steps.klib-recordings-restored.outputs.entries }}
      run: 'set -euo pipefail

        entries=$(scripts/cache-entries.sh target/cache/klib-references)

        echo "added=$([ "$entries" != "$RESTORED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

        '
    - name: save KLIB box reference bytes
      if: always() && steps.klib-recordings-added.outputs.added == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/klib-references
        key: box-klib-references-${{ hashFiles('tests/box_klib_bytes/reference-format') }}-${{ runner.os }}-${{ runner.arch
          }}-${{ matrix.target }}-${{ matrix.version }}-${{ hashFiles('kotlin-versions') }}-${{ github.sha }}
    - name: upload KLIB byte equality
      if: always() && matrix.target != 'jvm'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: klib-byte-equality-${{ matrix.version }}-${{ matrix.target }}
        path: '*-byte-equality.txt'
        if-no-files-found: error
    - name: run non-box conformance ${{ matrix.version }}
      if: matrix.target == 'jvm'
      env:
        KRUSTY_CONFORMANCE_TIMEOUT_SECONDS: '3600'
        KRUSTY_BOX_TIMEOUT_MS: '60000'
        KRUSTY_CLASS_DUMP_DIR: ${{ github.workspace }}/target/cache/class-dumps
        KRUSTY_RECORD_CLASS_DUMPS: '0'
        KRUSTY_CLASS_DUMP_WRITE: ${{ steps.recorded-mode.outputs.write }}
        KRUSTY_CLASS_DUMP_COMPILE_MISSING: ${{ steps.recorded-mode.outputs.compile_missing }}
        KRUSTY_DEPS_CACHE: ${{ github.workspace }}/target/cache/krusty-deps
        KRUSTY_REQUIRE_SERIALIZATION_CONFORMANCE: '1'
      run: just conformance-regressions "$PWD/conformance-bin" "${{ matrix.version }}"
    - name: prune kotlinc box references (${{ matrix.version }})
      if: '!cancelled() && github.ref == ''refs/heads/master'' && steps.box-references.outputs.cache-hit != ''true'''
      run: scripts/prune-reference-cache.sh target/cache/ref-classes 7 ${{ steps.box-references-seeded.outcome == 'success'
        && 'target/ref-classes-seeded' || '' }}
    - name: save kotlinc box references (${{ matrix.version }})
      if: '!cancelled() && github.ref == ''refs/heads/master'' && steps.box-references.outputs.cache-hit != ''true'''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/ref-classes
        key: ${{ env.BOX_REFERENCES }}-${{ github.sha }}
    - name: save recorded kotlinc bytes (${{ matrix.version }})
      if: matrix.target == 'jvm' && steps.recorded-mode.outputs.write == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/class-dumps
        key: recorded-kotlinc-bytes-conformance-${{ matrix.version }}-${{ github.sha }}
    - name: upload pct
      if: always() && matrix.target == 'jvm'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pct-${{ matrix.version }}
        path: pct.txt
        if-no-files-found: error
    - name: upload JVM byte equality
      if: always() && matrix.target == 'jvm'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jvm-byte-equality-${{ matrix.version }}
        path: jvm-byte-equality.txt
        if-no-files-found: error
    - name: save kotlinc ${{ matrix.version }}
      if: github.ref == 'refs/heads/master' && steps.kotlinc.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlinc/${{ matrix.version }}
        key: ${{ steps.kotlinc.outputs.cache-primary-key }}
    - name: save serialization and KSP conformance inputs (${{ matrix.version }})
      if: matrix.target == 'jvm' && github.ref == 'refs/heads/master' && steps.conformance-inputs.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: 'target/cache/ser-corpus/${{ matrix.version }}

          target/cache/ksp-toolchain

          target/cache/krusty-deps

          '
        key: ${{ steps.conformance-inputs.outputs.cache-primary-key }}
    - name: save Wasm target KLIB dependencies (${{ matrix.version }})
      if: startsWith(matrix.target, 'wasm-') && github.ref == 'refs/heads/master' && steps.wasm-klibs.outputs.cache-hit !=
        'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/krusty-deps
        key: ${{ steps.wasm-klibs.outputs.cache-primary-key }}
    - name: save Kotlin/Native ${{ matrix.version }}
      if: matrix.target == 'native' && github.ref == 'refs/heads/master' && steps.kotlin-native.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlin-native/${{ matrix.version }}
        key: ${{ steps.kotlin-native.outputs.cache-primary-key }}
    - name: save box corpus (${{ matrix.version }})
      if: github.ref == 'refs/heads/master' && steps.box-corpus.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/box-corpus/${{ matrix.version }}
        key: ${{ steps.box-corpus.outputs.cache-primary-key }}
    - name: capture only verified full-run removals
      if: always()
      env:
        TARGET: ${{ matrix.target }}
        VERSION: ${{ matrix.version }}
      run: '

        set -euo pipefail

        python3 - <<''CHECK''

        import json,os,re,subprocess

        from pathlib import Path

        text=Path(''complete-lane.log'').read_text()

        status=int(Path(''complete-lane.exit'').read_text())

        label=os.environ[''TARGET'']+''-klib''

        summary=re.findall(re.escape(label)+r'' conformance: scanned (\d+),[^\n]*compiler-panics (\d+),[^\n]*failed (\d+),[^\n]*'',text)

        assert len(summary)==1 and int(summary[0][0])>1000 and summary[0][1]==''0'', ''missing complete corpus summary or
        compiler panic''

        changes=re.findall(r''^\s+([^\n]+): expected ([a-z-]+), got ([a-z-]+)\s*$'',text,re.M)

        assert all(old==''fail'' and new==''pass'' for _,old,new in changes), ''negative or applicability outcome change''

        assert not re.search(r''^\s+unexpected(?: non-pass)? '',text,re.M), ''unexpected non-pass''

        counts=re.findall(r''FAILED <[^>]+ box expectations>: (\d+) file\(s\) outcome changed:'',text)

        assert (not changes and not counts and status==0) or (len(counts)==1 and int(counts[0])==len(changes) and status==101),
        ''incomplete mismatch report or other test failure''

        assert int(summary[0][2])==(1 if changes else 0), ''unexpected corpus failures''

        manifest=Path(''tests/box_expected_failures'')/label/(os.environ[''VERSION'']+''.txt'')

        assert manifest.is_file(), ''missing exact-version manifest''

        lines=manifest.read_text().splitlines(keepends=True)

        removed={path for path,_,_ in changes}

        assert len(removed)==len(changes) and removed<={line.strip() for line in lines}, ''mismatch paths absent from original
        manifest''

        manifest.write_text(''''.join(line for line in lines if line.strip() not in removed))

        commit=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()

        Path(''evidence-commit.txt'').write_text(commit+''\n'')

        Path(''positive-outcomes.json'').write_text(json.dumps({''runner_commit'':commit,''target'':os.environ[''TARGET''],''version'':os.environ[''VERSION''],''scanned'':int(summary[0][0]),''strict_exit'':status,''removed'':sorted(removed)},indent=2)+''\n'')

        CHECK

        start=$(git rev-parse HEAD)

        git diff -- tests/box_expected_failures tests/box_expected_not_applicable > outcome-manifests.patch

        git add tests/box_expected_failures tests/box_expected_not_applicable

        GIT_AUTHOR_NAME=''Anton Efimchuk'' GIT_AUTHOR_EMAIL=''anton.efimchuk@gmail.com'' GIT_COMMITTER_NAME=''Anton Efimchuk''
        GIT_COMMITTER_EMAIL=''anton.efimchuk@gmail.com'' git commit --allow-empty -m ''Record verified positive runner outcomes''

        scripts/check-outcome-lists.sh "$start" HEAD

        '
    - name: upload full lane evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: outcomes-${{ matrix.target }}-${{ matrix.version }}
        path: 'evidence-commit.txt

          positive-outcomes.json

          outcome-manifests.patch

          complete-lane.log

          complete-lane.exit

          '
        if-no-files-found: error
    timeout-minutes: 120
