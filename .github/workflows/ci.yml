name: unsigned array diagnostics
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: temurin
        java-version: '17'
    - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
      with:
        tool: just
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/cache/kotlinc/2.4.20
        key: kotlinc-2.4.20
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.100.0
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: capture whole unsigned fixture Wasm modules
      env:
        CARGO_BUILD_JOBS: '2'
      run: |
        set -euo pipefail
        mkdir -p evidence
        git rev-parse HEAD > evidence/checkout.txt
        git rev-parse HEAD^ > evidence/production-parent.txt
        sha256sum tests/box_regressions/unsignedArrayViews.kt > evidence/fixture.sha256
        export KRUSTY_KOTLINC="$(just kotlinc 2.4.20)"
        export KRUSTY_LANGUAGE_VERSION=2.4.20
        export KRUSTY_DEPS_DEADLINE_SECONDS=3600
        export KRUSTY_CLASS_DUMP_COMPILE_MISSING=1
        ./run-tests.sh --test conformance unsigned_array_whole_fixture_diagnostics -- --nocapture 2>&1 | tee evidence/build-and-run.log
    - name: upload complete modules
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unsigned-array-wasm-modules
        path: evidence/
        if-no-files-found: error
