name: delegation-superclass-slots

on:
  push:
    branches: [ci/delegation-superclass-slots]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, rust-4c-8gb]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-tool-bins
          save-if: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: find installed just
        id: just
        shell: bash
        run: if command -v just > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: install just
        if: steps.just.outputs.found != 'true'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: authenticate product source
        run: |
          test "$(git rev-parse HEAD^)" = 101059188321774d30a7c21ec901356ed1b8a973
          mkdir -p evidence
          git rev-parse HEAD^ > evidence/source-commit.txt
          sha256sum tests/box_regressions/moduleDelegationForwarderSlots.kt > evidence/fixture.sha256
      - name: build conformance binary once
        timeout-minutes: 40
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 bash scripts/cargo-test-binary.sh conformance -p krusty --test conformance > evidence/build.log 2>&1
          cat evidence/build.log
          cp "$(tail -n 1 evidence/build.log)" conformance-bin
          sha256sum conformance-bin > evidence/binary.sha256
      - name: JVM oracle and whole Native and Wasm regression
        timeout-minutes: 25
        run: |
          set -uo pipefail
          export KRUSTY_LANGUAGE_VERSION=2.4.21
          export KRUSTY_KOTLINC="$(just kotlinc 2.4.21)"
          export KRUSTY_KOTLIN_BOX_DIR="$(just box-corpus 2.4.21)"
          export KRUSTY_KOTLIN_NATIVE="$(just kotlin-native 2.4.21)"
          export KRUSTY_DEPS_CACHE="$PWD/target/cache/krusty-deps"
          export KRUSTY_TEST_THREADS=1
          export KRUSTY_BOX_ONLY=moduleDelegationForwarderSlots.kt
          export KRUSTY_NATIVE_BOX_ONLY=moduleDelegationForwarderSlots.kt
          export KRUSTY_WASM_JS_BOX_ONLY=moduleDelegationForwarderSlots.kt
          export KRUSTY_WASM_WASI_BOX_ONLY=moduleDelegationForwarderSlots.kt
          export KRUSTY_REQUIRE_NATIVE_CONFORMANCE=1
          export KRUSTY_REQUIRE_WASM_JS_CONFORMANCE=1
          export KRUSTY_REQUIRE_WASM_WASI_CONFORMANCE=1
          result=0
          for lane in jvm native wasm-js wasm-wasi; do
            case "$lane" in
              jvm) test_name=kotlin_box_ir_jvm_conformance::kotlin_codegen_box_conformance ;;
              native) test_name=kotlin_codegen_box_native_conformance ;;
              wasm-js) test_name=kotlin_codegen_box_wasm_js_conformance ;;
              wasm-wasi) test_name=kotlin_codegen_box_wasm_wasi_conformance ;;
            esac
            timeout 300 ./conformance-bin "$test_name" --nocapture > "evidence/$lane.log" 2>&1
            status=$?
            printf '%s exit=%s\n' "$lane" "$status" | tee -a evidence/status.txt
            cat "evidence/$lane.log"
            if [ "$status" -ne 0 ] || ! rg -q "test result: ok\. 1 passed; 0 failed" "evidence/$lane.log"; then result=1; fi
          done
          exit "$result"
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delegation-superclass-slots
          path: evidence/
          if-no-files-found: error
