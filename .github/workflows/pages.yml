# Builds the Astro landing page in site/ and publishes it to GitHub Pages (krustythecompiler.dev),
# with the Bazel registry (krustythecompiler.dev/bazel-registry) generated from the GitHub releases.
# The release job dispatches this workflow after each release, so the registry lists it.
# The metrics page (krustythecompiler.dev/metrics/) is built from the latest successful master CI
# run's box reports, the corpus-results branch and the coverage baseline. The nightly corpus run
# dispatches this workflow once it has published, and the schedule rebuilds the page every night
# even when the corpus run does not finish. The README and landing-page badges are published from
# the same box reports, so the badges and the page always agree.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", Custom domain: krustythecompiler.dev.
name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Downloads the box reports of the latest master CI run for the metrics page.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # scripts/metrics.mjs documents the layout. A source that is missing is shown as not measured.
      - name: collect the metrics page inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          in=$RUNNER_TEMP/metrics
          mkdir -p "$in/corpus" "$in/box"
          cp coverage-baseline.json "$in/"
          if git fetch -q --depth 1 origin corpus-results; then
            git show FETCH_HEAD:results.json > "$in/corpus/results.json"
            git show FETCH_HEAD:history.tsv > "$in/corpus/history.tsv"
          fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
            --status success --limit 1 --json databaseId,headSha,createdAt,url --jq '.[0] // empty')
          if [ -n "$run" ]; then
            printf '%s\n' "$run" > "$in/ci-run.json"
            gh run download -R "$GITHUB_REPOSITORY" "$(jq -r .databaseId <<<"$run")" -D "$in/box" \
              -p 'pct-*' -p 'jvm-byte-equality-*' -p 'native-pct-*'
          fi
          echo "KRUSTY_METRICS_INPUT=$in" >> "$GITHUB_ENV"
      # The newest Kotlin version of that CI run: its JVM case and byte reports and its Native case
      # report, as shields.io endpoint JSON in one gist update. Needs the CONFORMANCE_GIST_ID
      # variable and the GIST_TOKEN secret (a token with the `gist` scope).
      - name: publish badges → gist
        if: ${{ github.ref == 'refs/heads/master' && vars.CONFORMANCE_GIST_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.CONFORMANCE_GIST_ID }}
        run: |
          set -euo pipefail
          box=$KRUSTY_METRICS_INPUT/box
          version=$(node site/scripts/metrics.mjs "$KRUSTY_METRICS_INPUT" | jq -er '.box.versions[0].version')
          conformance=$(bash scripts/conformance-badge.sh json conformance "$box/pct-$version/pct.txt" "$version")
          bytes=$(bash scripts/conformance-badge.sh json jvm-byte-equality \
            "$box/jvm-byte-equality-$version/jvm-byte-equality.txt" "$version")
          native=$(bash scripts/conformance-badge.sh json native-conformance "$box/native-pct-$version/native-pct.txt" "$version")
          kotlin=$(jq -cn --arg v "$version" '{schemaVersion: 1, label: "Kotlin", message: $v, color: "blue"}')
          jq -n --arg c "$conformance" --arg b "$bytes" --arg n "$native" --arg k "$kotlin" '{files: {
            "krusty-conformance.json": {content: $c},
            "krusty-jvm-byte-equality.json": {content: $b},
            "krusty-native-conformance.json": {content: $n},
            "krusty-kotlin.json": {content: $k}}}' |
            gh api --method PATCH "gists/$GIST_ID" --input - >/dev/null
      - name: build
        working-directory: site
        run: npm ci && npm run build && npm test
      - name: generate the Bazel registry
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bazel-registry.mjs dist/bazel-registry
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
