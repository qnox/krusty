# Builds the Astro landing page in site/ and publishes it to GitHub Pages (krustythecompiler.dev),
# with the Bazel registry (krustythecompiler.dev/bazel-registry) generated from the GitHub releases.
# The release job dispatches this workflow after each release, so the registry lists it.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", Custom domain: krustythecompiler.dev.
name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: build
        working-directory: site
        run: npm ci && npm run build && npm test
      - name: generate the Bazel registry
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bazel-registry.mjs dist/bazel-registry
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
