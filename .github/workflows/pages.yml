# Builds the Astro landing page in site/ and publishes it to GitHub Pages (krustythecompiler.dev),
# with the Bazel registry (krustythecompiler.dev/bazel-registry) generated from the GitHub releases.
# The release job dispatches this workflow after each release, so the registry lists it.
# The metrics page (krustythecompiler.dev/metrics/) is built from the latest successful master CI
# run's box reports, the `summary` artifacts of the recent nightly `oss corpus` runs and the coverage
# baseline. Each finished corpus run triggers this workflow, and the schedule rebuilds the page every
# night even when the corpus run does not finish. The shields.io badge endpoints
# (krustythecompiler.dev/badges/) are packaged from the same CI run.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", Custom domain: krustythecompiler.dev.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # The badge endpoints are packaged by these scripts.
      - "scripts/package-release-badges.sh"
      - "scripts/conformance-badge.sh"
  schedule:
    - cron: '0 7 * * *'
  workflow_run:
    workflows: [oss corpus]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # Downloads the box reports and corpus summaries of the master runs for the metrics page.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, rust-4c-8gb]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # scripts/metrics.mjs documents the layout. A source that is missing is shown as not measured.
      - name: collect the metrics page inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          in=$RUNNER_TEMP/metrics
          mkdir -p "$in/corpus/runs" "$in/box"
          cp coverage-baseline.json "$in/"
          # The nightly corpus runs whose summary artifact is still kept, newest first; a run that
          # stopped before its summary job, or whose artifact expired, has none and is left out.
          # The newest also records what it built: the project list and the patches at its commit.
          newest=
          gh run list -R "$GITHUB_REPOSITORY" --workflow oss-corpus.yml --branch master --event schedule \
            --status completed --limit 60 --json databaseId,headSha,createdAt,url,conclusion --jq '.[] | @json' |
            while IFS= read -r run; do
              id=$(jq -r .databaseId <<<"$run")
              dir=$in/corpus/runs/$id
              kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                --jq '[.artifacts[] | select(.name == "summary" and (.expired | not))] | length')
              [ "$kept" -eq 1 ] || continue
              gh run download -R "$GITHUB_REPOSITORY" "$id" -n summary -D "$dir"
              rm -f "$dir/summary.md"
              printf '%s\n' "$run" > "$dir/run.json"
              if [ -z "$newest" ]; then
                newest=$id
                sha=$(jq -r .headSha <<<"$run")
                git fetch -q --depth 1 origin "$sha"
                git show "$sha:scripts/oss-corpus/projects.tsv" > "$dir/projects.tsv"
                git ls-tree --name-only "$sha" scripts/oss-corpus/patches/ | xargs -r -n1 basename > "$dir/patches.txt"
              fi
            done
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
            --status success --limit 1 --json databaseId,headSha,createdAt,url --jq '.[0] // empty')
          if [ -n "$run" ]; then
            printf '%s\n' "$run" > "$in/ci-run.json"
            gh run download -R "$GITHUB_REPOSITORY" "$(jq -r .databaseId <<<"$run")" -D "$in/box" \
              -p 'pct-*' -p 'jvm-byte-equality-*' -p 'native-pct-*'
          fi
          echo "KRUSTY_METRICS_INPUT=$in" >> "$GITHUB_ENV"
      - name: build
        working-directory: site
        run: npm ci && npm run build && npm test
      # The shields.io badge endpoints (krustythecompiler.dev/badges/*.json), from
      # the same CI run as the metrics page, packaged the way a release packages its badge assets.
      # This deploy is their only writer. Without a CI run with box reports none are published, and
      # the badges say so rather than show an old figure.
      - name: package the badge endpoints
        run: |
          set -euo pipefail
          version=$(node site/scripts/metrics.mjs "$KRUSTY_METRICS_INPUT" | jq -r '.box.versions[0].version // empty')
          if [ -z "$version" ]; then
            echo "no CI run with box reports: no badge endpoints"
            exit 0
          fi
          box=$KRUSTY_METRICS_INPUT/box
          reports=$RUNNER_TEMP/badge-reports
          mkdir -p "$reports"
          cp "$box/pct-$version/pct.txt" "$box/jvm-byte-equality-$version/jvm-byte-equality.txt" \
            "$box/native-pct-$version/native-pct.txt" "$reports/"
          bash scripts/package-release-badges.sh "$version" "$reports" site/dist/badges
      - name: generate the Bazel registry
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bazel-registry.mjs dist/bazel-registry
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
