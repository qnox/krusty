# Builds the Astro landing page in site/ and publishes it to GitHub Pages (krustythecompiler.dev),
# with the Bazel registry (krustythecompiler.dev/bazel-registry) generated from the GitHub releases.
# The release job dispatches this workflow after each release, so the registry lists it.
# The metrics page (krustythecompiler.dev/metrics/) is built from the latest successful master CI
# run's box reports, the corpus-results branch and the coverage baseline. The nightly corpus run
# dispatches this workflow once it has published, and the schedule rebuilds the page every night
# even when the corpus run does not finish.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", Custom domain: krustythecompiler.dev.
name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Downloads the box reports of the latest master CI run for the metrics page.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # scripts/metrics.mjs documents the layout. A source that is missing is shown as not measured.
      - name: collect the metrics page inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          in=$RUNNER_TEMP/metrics
          mkdir -p "$in/corpus" "$in/box"
          cp coverage-baseline.json "$in/"
          if git fetch -q --depth 1 origin corpus-results; then
            git show FETCH_HEAD:results.json > "$in/corpus/results.json"
            git show FETCH_HEAD:history.tsv > "$in/corpus/history.tsv"
          fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
            --status success --limit 1 --json databaseId,headSha,createdAt,url --jq '.[0] // empty')
          if [ -n "$run" ]; then
            printf '%s\n' "$run" > "$in/ci-run.json"
            gh run download -R "$GITHUB_REPOSITORY" "$(jq -r .databaseId <<<"$run")" -D "$in/box" \
              -p 'pct-*' -p 'jvm-byte-equality-*' -p 'native-pct-*'
          fi
          echo "KRUSTY_METRICS_INPUT=$in" >> "$GITHUB_ENV"
      - name: build
        working-directory: site
        run: npm ci && npm run build && npm test
      - name: generate the Bazel registry
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bazel-registry.mjs dist/bazel-registry
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
