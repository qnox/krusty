// Applies the krusty Gradle plugin to every Kotlin/JVM, Android and Kotlin Multiplatform project of
// the build, from the local Maven repository the corpus workflow unpacked.
// Only the main build: buildSrc and included builds are the project's build logic, and their
// settings may declare exclusive repository content that forbids the buildscript repository below.
if (gradle.parent != null) return
def repo = new File(System.getenv('KRUSTY_PLUGIN_REPOSITORY')).toURI()
def version = System.getenv('KRUSTY_PLUGIN_VERSION')
settingsEvaluated { s ->
    s.pluginManagement.repositories {
        // Declaring a repository replaces the implicit Gradle Plugin Portal; keep it.
        if (isEmpty()) gradlePluginPortal()
        maven { url = repo }
    }
}
gradle.rootProject { p ->
    p.buildscript.repositories { maven { url = repo } }
    p.buildscript.dependencies { classpath "dev.krustythecompiler:krusty-gradle-plugin:$version" }
}
gradle.allprojects { p ->
    p.pluginManager.withPlugin('org.jetbrains.kotlin.jvm') { p.pluginManager.apply('dev.krustythecompiler') }
    // From AGP 9 the Android plugin compiles Kotlin itself, without `org.jetbrains.kotlin.android`.
    p.pluginManager.withPlugin('com.android.base') { p.pluginManager.apply('dev.krustythecompiler') }
    p.pluginManager.withPlugin('org.jetbrains.kotlin.multiplatform') {
        // A plugin build without Kotlin Multiplatform support rejects the project. Its compiles
        // then stay with kotlinc, and each is reported the way the plugin reports a fallback, so
        // the comparison counts it as a miss rather than as kotlinc's output matching itself.
        try {
            p.pluginManager.apply('dev.krustythecompiler')
        } catch (Exception rejected) {
            def reason = rejected.cause?.message ?: rejected.message
            p.afterEvaluate {
                p.tasks.names.findAll { it ==~ /compile.*Kotlin.*/ }.each { n ->
                    def path = p.path == ':' ? ":$n" : "${p.path}:$n"
                    p.logger.lifecycle("krusty: task '$path' is left to kotlinc: $reason")
                }
            }
        }
    }
}
