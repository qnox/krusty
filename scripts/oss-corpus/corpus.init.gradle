import javax.inject.Inject
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener
import org.gradle.tooling.events.task.TaskFailureResult
import org.gradle.tooling.events.task.TaskFinishEvent
import org.gradle.tooling.events.task.TaskSkippedResult
import org.gradle.tooling.events.task.TaskSuccessResult

// Adds `corpusCompile`: every Kotlin/JVM compile task in the build, and lists them in
// `$CORPUS_COMPILATIONS` when it is set. Tasks are picked by name before they are realized:
// realizing every registered task would configure unrelated ones (a GraalVM native-image task
// fails without its JDK). An Android project contributes only the compiles of the variant named by
// `$CORPUS_ANDROID_VARIANT` (main, unit test and instrumented test); without it, none. Only the main
// build counts: buildSrc and included builds are the project's build logic.
if (gradle.parent != null) return
gradle.projectsEvaluated { g ->
    def root = g.rootProject
    def picked = []
    def variant = System.getenv('CORPUS_ANDROID_VARIANT')
    def androidTask = variant ? ~"compile${variant.capitalize()}(UnitTest|AndroidTest)?Kotlin" : null
    root.allprojects { p ->
        if (p.plugins.hasPlugin('org.gradle.kotlin.kotlin-dsl.base')) return
        def android = p.plugins.hasPlugin('com.android.base')
        if (android && androidTask == null) return
        p.tasks.names.findAll { android ? it ==~ androidTask : it ==~ /compile.*Kotlin.*/ }.each { n ->
            def t = p.tasks.named(n).get()
            if (t.class.name.replace('_Decorated', '') == 'org.jetbrains.kotlin.gradle.tasks.KotlinCompile') {
                picked << t
            }
        }
    }
    root.tasks.register('corpusCompile') { dependsOn { picked } }
    // One line per picked task, its path and its output directory relative to the build root: the
    // comparison reads compilations from here rather than guessing them from directory names.
    def manifest = System.getenv('CORPUS_COMPILATIONS')
    if (manifest != null) {
        new File(manifest).text = picked.collect { t ->
            "${t.path}\t${root.projectDir.toPath().relativize(t.destinationDirectory.get().asFile.toPath())}\n"
        }.join('')
    }
    // In the verify build (the krusty plugin in its `krustyVerify` mode, `$CORPUS_VERIFY_RECORDS`
    // set), `corpusCompile` also runs the plugin's verify compile of each picked task, which the
    // plugin registers beside it as `<task>KrustyVerify`, and the file lists each picked task's path
    // and the record its verify compile writes. A picked task the plugin registered no verify compile
    // for (a module it is not applied to) is left out.
    def verifyRecords = System.getenv('CORPUS_VERIFY_RECORDS')
    if (verifyRecords != null) {
        def verifies = { picked.collectEntries { t -> [t, t.project.tasks.findByName("${t.name}KrustyVerify")] }.findAll { it.value != null } }
        root.tasks.named('corpusCompile') { dependsOn { verifies().values() } }
        g.taskGraph.whenReady {
            new File(verifyRecords).text = verifies().collect { t, v ->
                "${t.path}\t${v.record.get().asFile.absolutePath}\n"
            }.join('')
        }
    }
}

// Records the plugins each project applies, for the corpus plugin survey: every Gradle plugin by
// its id (read from the `META-INF/gradle-plugins` descriptor of the jar that holds its class), and
// every Kotlin compiler plugin jar on a Kotlin/JVM compile task's plugin classpath.
def pluginIds = [:]
def idsOf = { Class c ->
    def name = c.name.replace('_Decorated', '')
    if (pluginIds.containsKey(name)) return pluginIds[name]
    def ids = []
    try {
        def location = c.protectionDomain?.codeSource?.location
        if (location != null && location.path.endsWith('.jar')) {
            def jar = new java.util.jar.JarFile(new File(location.toURI()))
            jar.entries().each { e ->
                if (e.name.startsWith('META-INF/gradle-plugins/') && e.name.endsWith('.properties')) {
                    def props = new Properties()
                    jar.getInputStream(e).withCloseable { props.load(it) }
                    if (props.getProperty('implementation-class') == name) {
                        ids << e.name.substring('META-INF/gradle-plugins/'.length(), e.name.length() - '.properties'.length())
                    }
                }
            }
            jar.close()
        }
    } catch (Throwable ignored) {}
    pluginIds[name] = ids
    ids
}
gradle.projectsEvaluated { g ->
    def survey = System.getenv('CORPUS_PLUGIN_SURVEY')
    if (survey == null) return
    def lines = new TreeSet()
    g.rootProject.allprojects { p ->
        p.plugins.each { plugin ->
            def ids = idsOf(plugin.class)
            // Prefer the qualified id over Gradle's short core aliases (`java` and `org.gradle.java`).
            def id = ids.find { it.contains('.') } ?: ids.find() ?: plugin.class.name.replace('_Decorated', '')
            lines << "gradle\t${p.path}\t${id}"
        }
        // kotlin-dsl compiles stay with kotlinc and are not compared; their plugins are Gradle's.
        if (p.plugins.hasPlugin('org.gradle.kotlin.kotlin-dsl.base')) return
        p.tasks.names.findAll { it ==~ /compile.*Kotlin.*/ }.each { n ->
            try {
                def t = p.tasks.named(n).get()
                if (t.class.name.replace('_Decorated', '') != 'org.jetbrains.kotlin.gradle.tasks.KotlinCompile') return
                t.pluginClasspath.files.each { f -> lines << "compiler\t${p.path}\t${f.name}" }
                // `-P plugin:<id>:<option>=<value>` takes its value as the next argument; record the plugin id.
                def args = t.compilerOptions.freeCompilerArgs.getOrElse([])
                args.eachWithIndex { a, i ->
                    def option = a == '-P' && i + 1 < args.size() ? args[i + 1] : a.startsWith('-P') ? a.substring(2) : null
                    if (option?.startsWith('plugin:')) {
                        lines << "compiler-arg\t${p.path}\t-P plugin:${option.split(':')[1]}"
                    } else if (a.startsWith('-Xplugin')) {
                        lines << "compiler-arg\t${p.path}\t-Xplugin"
                    }
                }
            } catch (Throwable ignored) {}
        }
    }
    new File(survey).text = lines.join('\n') + '\n'
}

// Records when each task of the build ran, in `$CORPUS_TASK_TIMES` when it is set: one line per
// finished task, its path, its start and end (epoch milliseconds) and its outcome. The comparison
// reads each compilation's compile time from here, kotlinc's task in one build and krusty's
// replacement, support check and the Kotlin task in the other.
abstract class CorpusTaskTimes implements BuildService<CorpusTaskTimes.Params>, OperationCompletionListener {
    interface Params extends BuildServiceParameters {
        Property<String> getOutput()
    }

    @Override
    synchronized void onFinish(FinishEvent event) {
        if (!(event instanceof TaskFinishEvent)) return
        def result = event.result
        def outcome = result instanceof TaskSkippedResult ? 'skipped'
                : result instanceof TaskFailureResult ? 'failed'
                : result instanceof TaskSuccessResult && result.upToDate ? 'up-to-date'
                : 'executed'
        new File(parameters.output.get()) << "${event.descriptor.taskPath}\t${result.startTime}\t${result.endTime}\t${outcome}\n"
    }
}

abstract class CorpusTaskTimesPlugin implements Plugin<Gradle> {
    @Inject
    abstract BuildEventsListenerRegistry getRegistry()

    void apply(Gradle gradle) {
        def output = System.getenv('CORPUS_TASK_TIMES')
        if (output == null) return
        new File(output).text = ''
        registry.onTaskCompletion(gradle.sharedServices.registerIfAbsent('corpusTaskTimes', CorpusTaskTimes) {
            parameters.output.set(output)
        })
    }
}

apply plugin: CorpusTaskTimesPlugin
