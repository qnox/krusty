[package]
name = "krusty-build"
version = "0.0.1"
edition = "2021"
description = "Module graph, ABI fingerprinting and cache keys for a Go-like krusty build layer"
license = "Apache-2.0"

[dependencies]
# Nothing, on purpose. `docs/ARCHITECTURE.md` makes the dependency question an explicit build-layer
# decision rather than one hidden inside a phase: lifting the LSP's project model would add
# `roxmltree`, `url`, `fs2` and `sha2` to the shipped compiler binary. Keeping the graph and the
# hasher on std alone shows that this half of the crate never needs them. The ABI module lands
# next and takes the compiler's own class reader for its class-file adapter; only the build
# providers (Gradle/Maven/BSP/JPS), which are not here at all, raise the third-party question.

[lib]
name = "krusty_build"
path = "src/lib.rs"
