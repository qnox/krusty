[package]
name = "krusty-lsp"
version = "0.0.1"
edition = "2021"
description = "Language Server Protocol implementation backed by the krusty compiler"
license = "Apache-2.0"

[dependencies]
krusty = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
url = "2"
fs2 = "0.4"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
dhat = { version = "0.3", optional = true }

[[bin]]
name = "memprofile"
path = "tools/memprofile.rs"

[features]
dhat-heap = ["dep:dhat"]
