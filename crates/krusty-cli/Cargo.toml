[package]
name = "krusty-cli"
version = "0.0.1"
edition = "2021"
description = "kotlinc-compatible batch command-line driver for the krusty compiler"
license = "Apache-2.0"

[dependencies]
# Bazel's persistent-worker protocol is line-delimited JSON (`requires-worker-protocol: json`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
krusty = { path = "../.." }
zip = { version = "8", default-features = false, features = ["deflate"] }

[[bin]]
name = "krusty"
path = "src/main.rs"
