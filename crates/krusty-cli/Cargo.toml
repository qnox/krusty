[package]
name = "krusty-cli"
version = "0.0.1"
edition = "2021"
description = "kotlinc-compatible command line for krusty, a Kotlin compiler written in Rust"
license = "Apache-2.0"
repository = "https://github.com/qnox/krusty"

[dependencies]
# Bazel's persistent-worker protocol is line-delimited JSON (`requires-worker-protocol: json`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
krusty = { path = "../.." }
zip = { version = "9", default-features = false, features = ["deflate"] }
# The compiler allocates and frees many short-lived vectors and strings; under glibc's allocator a
# quarter of a large module's compile ran in malloc and free. mimalloc took a 100-package,
# four-module build from 31.7 s to 26.4 s for about 35 MB more peak memory, with identical output.
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "krusty"
path = "src/main.rs"
